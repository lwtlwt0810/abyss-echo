      run.hazards.push({ kind: 'cloud', x, y, r: radius * 0.85, t: 4, tick: 0, dmg: dm * 0.16, color: '#a9e34b', poison: opts.poison });
    }
  }

  function hurtPlayer(dmg, src) {
    const run = G.run;
    if (!run || run.state === 'dead') return;
    if (run.invuln > 0 || run.hurtCd > 0) return;
    let d = dmg * (1 - run.armor - run.mods.armor - run.temp.armor);
    if (run.char.passive === 'armor') d *= 0.85;
    if (run.shield > 0) {
      const absorbed = Math.min(run.shield, d);
      run.shield -= absorbed; d -= absorbed;
      run.effects.push({ type: 'ring', x: run.player.x, y: run.player.y, max: 44, color: '#74c0fc', t: 0.2, life: 0.2 });
    }
    d = Math.max(1, Math.round(d));
    run.hp -= d;
    run.invuln = 0.8 + run.mods.iframe;
    run.hurtCd = 0.6;
    run.redFlash = 0.22;
    shake(0.36); hitstop(0.05);
    Sound.play('hurt');
    G.vibrate = 60;
    addText(run.player.x, run.player.y - 26, '-' + d, '#ff6b6b', 18);
    burst(run.player.x, run.player.y, '#ff6b6b', 10, 220, 4, 0.35);
    if (src) {
      const a = Math.atan2(run.player.y - src.y, run.player.x - src.x);
      run.player.vx += Math.cos(a) * 180; run.player.vy += Math.sin(a) * 180;
      // 词缀：吸血由敌人伤害回血在敌人更新中处理
    }
    if (hasRelic(run, 'thorncape')) explode(run.player.x, run.player.y, 110, 20, '#c0a2ff', {});
    if (run.hp <= 0) {
      if (hasRelic(run, 'undying') && !run.undyingUsed) {
        run.undyingUsed = true; run.hp = Math.round(run.maxHp * 0.3);
        run.invuln = 2; run.effects.push({ type: 'nova', x: run.player.x, y: run.player.y, max: 220, color: '#ffd43b', t: 0.6, life: 0.6 });
        toast('不灭之焰：免疫致命伤害'); return;
      }
      if (run.revives > 0) {
        run.revives--; run.hp = Math.round(run.maxHp * 0.5); run.invuln = 2.5;
        run.effects.push({ type: 'nova', x: run.player.x, y: run.player.y, max: 260, color: '#ffe066', t: 0.8, life: 0.8 });
        toast('回响复苏：你被拉回来了'); Sound.play('win'); return;
      }
      run.hp = 0; run.state = 'dead'; G.state = 'dead'; G.deadT = 0;
      Sound.play('dead'); Sound.setMusic(null);
      save.gold += Math.floor(run.coins * 0.6);
      save.bestFloor = Math.max(save.bestFloor, run.floor + 1);
      writeSave();
    }
  }

  // ======================================================================
  //  §22 敌人 AI（16 行为族 + 8 词缀）
  // ======================================================================
  function eShot(x, y, ang, speed, dmg, size, color, opts) {
    const run = G.run; if (!run) return null;
    if (run.ebullets.length >= MAX_EBULLETS) run.ebullets.shift();
    const b = {
      x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
      r: size, dmg, color, life: 4.2, maxLife: 4.2, t: 0,
      homing: 0, slow: 0, poison: 0, kind: 'shot', trail: false
    };
    if (opts) Object.assign(b, opts);
    run.ebullets.push(b);
    return b;
  }
  function bossShot(x, y, ang, speed, dmg, size, color, opts) { return eShot(x, y, ang, speed, dmg, size, color, opts); }
  function bossRing(x, y, n, speed, dmg, size, color, opts) {
    for (let i = 0; i < n; i++) bossShot(x, y, (i / n) * TAU + (opts && opts.off || 0), speed, dmg, size, color, opts);
  }

  function enemyShoot(e) {
    const s = e.def.shot;
    const p = G.run.player;
    const base = Math.atan2(p.y - e.y, p.x - e.x);
    if (s.ring) {
      for (let i = 0; i < s.n; i++) eShot(e.x, e.y, (i / s.n) * TAU + e.t, s.speed, e.dmg * (s.dmg / (e.def.dmg || 1)), s.size, s.color, { slow: s.slow, homing: s.homing || 0, poison: e.affixes.indexOf('toxic') >= 0 ? 2 : 0 });
    } else if (s.burst) {
      const n = s.n;
      const host = G.run;
      for (let i = 0; i < n; i++) {
        setTimeout(() => {
          if (G.run !== host || !e.alive) return;
          eShot(e.x, e.y, base + rand(-s.spread, s.spread), s.speed, e.dmg * (s.dmg / (e.def.dmg || 1)), s.size, s.color, { slow: s.slow, homing: s.homing || 0 });
        }, i * s.burst * 1000);
      }
    } else {
      for (let i = 0; i < s.n; i++) {
        const a = base + (s.n > 1 ? (i - (s.n - 1) / 2) * s.spread : 0);
        eShot(e.x, e.y, a, s.speed, e.dmg * (s.dmg / (e.def.dmg || 1)), s.size, s.color,
          { slow: s.slow, homing: s.homing || 0, poison: e.affixes.indexOf('toxic') >= 0 ? 2 : 0 });
      }
    }
    Sound.play('pistol');
  }

  function updateEnemies(dt) {
    const run = G.run, p = run.player;
    const list = run.enemies;
    for (let i = list.length - 1; i >= 0; i--) {
      const e = list[i];
      e.t += dt; e.wobble += dt * 3;
      e.hitFlash = Math.max(0, e.hitFlash - dt);
      e.hitstopCd = Math.max(0, (e.hitstopCd || 0) - dt);
      e.contactT = Math.max(0, e.contactT - dt);
      e.markT = Math.max(0, (e.markT || 0) - dt);
      // 状态
      if (e.freezeT > 0) { e.freezeT -= dt; }
      if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) { e.slowMul = 1; e.slowStacks = 0; } }
      if (e.burnT > 0) {
        e.burnT -= dt;
        e.burnTick = (e.burnTick || 0) + dt;
        if (e.burnTick > 0.5) {
          e.burnTick = 0;
          const mult = hasRelic(run, 'furnace') ? 2 : 1;
          damageEnemy(e, (e.burnStacks || 1) * 1.5 * mult, { crit: false });
          if (e.hp <= 0) continue;
        }
      }
      if (e.poisonT > 0) {
        e.poisonT -= dt;
        e.poisonTick = (e.poisonTick || 0) + dt;
        if (e.poisonTick > 0.6) {
          e.poisonTick = 0;
          const mult = hasRelic(run, 'furnace') ? 2 : 1;
          damageEnemy(e, (e.poisonStacks || 1) * 1.8 * mult, { crit: false });
          if (e.hp <= 0) continue;
        }
      }
      if (e.poisonDur > 0) e.poisonDur -= dt;
      // 词缀
      if (e.affixes.length) updateAffix(e, dt);
      if (e.shieldHp < e.shieldMax && e.shieldRegen) e.shieldHp = Math.min(e.shieldMax, e.shieldHp + e.shieldRegen * dt);
      // 冻结：完全不动作
      if (e.freezeT > 0) { e.vx *= 0.8; e.vy *= 0.8; continue; }
      const slowM = e.slowT > 0 ? (1 - (e.slowStacks || 1) * 0.12) : 1;
      const spd = e.speed * slowM * (e.affixes.indexOf('berserk') >= 0 && e.hp < e.maxHp * 0.4 ? 1.5 : 1);
      const dx = p.x - e.x, dy = p.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      e.ang = Math.atan2(dy, dx);
      const ai = e.def.ai;
      if (ai === 'chase' || ai === 'splitter' || ai === 'juggernaut') {
        e.vx = lerp(e.vx, (dx / d) * spd, 0.12);
        e.vy = lerp(e.vy, (dy / d) * spd, 0.12);
        if (e.def.trail && chance(0.05)) run.hazards.push({ kind: 'cloud', x: e.x, y: e.y, r: 34, t: 2.4, tick: 0, dmg: 2, color: '#a9e34b' });
      } else if (ai === 'ranged') {
        const want = 300;
        const k = d > want ? 1 : d < want * 0.7 ? -1 : 0;
        e.vx = lerp(e.vx, (dx / d) * spd * k, 0.1);
        e.vy = lerp(e.vy, (dy / d) * spd * k, 0.1);
        e.shotT -= dt;
        if (e.shotT <= 0 && d < 620) {
          const rate = e.def.shot.rate * (e.affixes.indexOf('berserk') >= 0 && e.hp < e.maxHp * 0.4 ? 0.6 : 1);
          e.shotT = rate; enemyShoot(e);
        }
      } else if (ai === 'charger') {
        e.shotT -= dt;
        if (e.state === 'idle') {
          e.vx = lerp(e.vx, (dx / d) * spd * 0.5, 0.1);
          e.vy = lerp(e.vy, (dy / d) * spd * 0.5, 0.1);
          if (d < 360 && e.shotT <= 0) { e.state = 'wind'; e.stT = 0.5; e.vx = 0; e.vy = 0; }
        } else if (e.state === 'wind') {
          e.stT -= dt;
          if (e.stT <= 0) { e.state = 'dash'; e.stT = 0.42; e.vx = (dx / d) * 520; e.vy = (dy / d) * 520; Sound.play('launch'); }
        } else if (e.state === 'dash') {
          e.stT -= dt;
          if (e.stT <= 0) { e.state = 'idle'; e.shotT = 2.2; e.vx *= 0.2; e.vy *= 0.2; }
        }
      } else if (ai === 'stationary') {
        e.vx *= 0.86; e.vy *= 0.86;
        if (e.def.shot) {
          e.shotT -= dt;
          if (e.shotT <= 0) { e.shotT = e.def.shot.rate; enemyShoot(e); }
        }
        if (e.def.summon) {
          e.summonT -= dt;
          if (e.summonT <= 0) {
            e.summonT = e.def.summon.rate;
            for (let k = 0; k < e.def.summon.n; k++) {
              const c = spawnEnemy(e.def.summon.type, e.x + rand(-40, 40), e.y + rand(-40, 40), false);
              if (c) burst(c.x, c.y, c.def.color, 6, 120, 3, 0.3);
            }
            Sound.play('skill');
          }
        }
      } else if (ai === 'suicide') {
        e.vx = lerp(e.vx, (dx / d) * spd, 0.16);
        e.vy = lerp(e.vy, (dy / d) * spd, 0.16);
        if (d < e.r + p.r + 10) {
          explode(e.x, e.y, 82, e.dmg, '#ff8787', {});
          e.alive = false; list.splice(i, 1);
          hurtPlayer(e.dmg, e);
          continue;
        }
      } else if (ai === 'burrow') {
        e.burrowT -= dt;
        if (e.state === 'idle') {
          e.vx = lerp(e.vx, (dx / d) * spd, 0.1);
          e.vy = lerp(e.vy, (dy / d) * spd, 0.1);
          if (e.burrowT <= 0) { e.state = 'under'; e.stT = 0.9; e.vx = 0; e.vy = 0; }
        } else if (e.state === 'under') {
          e.stT -= dt;
          e.x = lerp(e.x, p.x + rand(-30, 30), 0.06);
          e.y = lerp(e.y, p.y + rand(-30, 30), 0.06);
          if (e.stT <= 0) {
            e.state = 'idle'; e.burrowT = 3.2;
            burst(e.x, e.y, e.def.color, 12, 200, 4, 0.4);
            if (dist(e.x, e.y, p.x, p.y) < e.r + p.r + 14) hurtPlayer(e.dmg, e);
          }
        }
      } else if (ai === 'dash') {
        e.shotT -= dt;
        if (e.shotT <= 0) {
          const a = Math.atan2(dy, dx) + rand(-0.9, 0.9);
          e.vx = Math.cos(a) * 460; e.vy = Math.sin(a) * 460;
          e.shotT = rand(0.9, 1.5);
        }
        e.vx *= 0.985; e.vy *= 0.985;
      } else if (ai === 'fly') {
        const wob = Math.sin(e.wobble) * 0.8;
        e.vx = lerp(e.vx, (dx / d) * spd + Math.cos(e.wobble) * 60, 0.1);
        e.vy = lerp(e.vy, (dy / d) * spd + Math.sin(e.wobble * 1.3) * 60, 0.1);
      } else if (ai === 'stalker') {
        e.stealthA += dt;
        const hidden = e.stealthA % 4 < 2;
        e.hidden = hidden;
        const sp = hidden ? spd * 1.6 : spd;
        e.vx = lerp(e.vx, (dx / d) * sp, 0.14);
        e.vy = lerp(e.vy, (dy / d) * sp, 0.14);
      } else if (ai === 'teleport') {
        e.shotT -= dt;
        if (e.shotT <= 0) {
          e.shotT = rand(1.8, 3);
          burst(e.x, e.y, e.def.color, 10, 160, 3, 0.3);
          const a = rand(0, TAU), r = rand(160, 300);
          e.x = clamp(p.x + Math.cos(a) * r, WALL + 30, ROOM_W - WALL - 30);
          e.y = clamp(p.y + Math.sin(a) * r, WALL + 30, ROOM_H - WALL - 30);
          burst(e.x, e.y, e.def.color, 10, 160, 3, 0.3);
        }
        e.vx = lerp(e.vx, (dx / d) * spd * 0.6, 0.08);
        e.vy = lerp(e.vy, (dy / d) * spd * 0.6, 0.08);
      } else if (ai === 'orbit') {
        const R = e.def.orbitR || 200;
        e.orbA += dt * 0.9;
        const tx = p.x + Math.cos(e.orbA) * R, ty = p.y + Math.sin(e.orbA) * R;
        e.vx = lerp(e.vx, clamp(tx - e.x, -1, 1) * spd, 0.1);
        e.vy = lerp(e.vy, clamp(ty - e.y, -1, 1) * spd, 0.1);
        if (e.def.shot) {
          e.shotT -= dt;
          if (e.shotT <= 0) { e.shotT = e.def.shot.rate; enemyShoot(e); }
        }
      } else if (ai === 'mirror') {
        const side = Math.sin(e.t * 1.3) > 0 ? 1 : -1;
        const ta = e.ang + Math.PI / 2 * side;
        e.vx = lerp(e.vx, (dx / d) * spd * 0.4 + Math.cos(ta) * spd * 0.9, 0.1);
        e.vy = lerp(e.vy, (dy / d) * spd * 0.4 + Math.sin(ta) * spd * 0.9, 0.1);
        e.shotT -= dt;
        if (e.shotT <= 0) { e.shotT = 1.6; eShot(e.x, e.y, e.ang, 340, e.dmg, 7, e.def.color, {}); }
      } else if (ai === 'support') {
        e.vx = lerp(e.vx, -(dx / d) * spd * 0.7, 0.08);
        e.vy = lerp(e.vy, -(dy / d) * spd * 0.7, 0.08);
        if (e.def.summon) {
          e.summonT -= dt;
          if (e.summonT <= 0 && run.enemies.length < MAX_ENEMIES - 2) {
            e.summonT = e.def.summon.rate;
            for (let k = 0; k < e.def.summon.n; k++) {
              const c = spawnEnemy(e.def.summon.type, e.x + rand(-36, 36), e.y + rand(-36, 36), false);
              if (c) burst(c.x, c.y, c.def.color, 8, 160, 3, 0.35);
            }
            Sound.play('skill');
          }
        }
        if (e.def.shot) {
          e.shotT -= dt;
          if (e.shotT <= 0) { e.shotT = e.def.shot.rate; enemyShoot(e); }
        }
      } else {
        e.vx = lerp(e.vx, (dx / d) * spd, 0.1);
        e.vy = lerp(e.vy, (dy / d) * spd, 0.1);
      }
      // 位移
      e.x += e.vx * dt; e.y += e.vy * dt;
      const flying = e.def.float || e.def.ai === 'teleport' || e.state === 'under';
      if (!flying) resolveObstacles(e, run.room.obstacles, e.r);
      resolveWalls(e, e.r);
      // 接触伤害
      if (e.state !== 'under' && e.def.ai !== 'stationary' && !e.hidden) {
        if (d < e.r + p.r + 2 && e.contactT <= 0) {
          e.contactT = 0.6;
          const cd = (e.def.dmgOnHit || e.dmg) * (e.affixes.indexOf('toxic') >= 0 ? 1.2 : 1);
          hurtPlayer(cd, e);
          if (e.affixes.indexOf('vampiric') >= 0) e.hp = Math.min(e.maxHp, e.hp + cd * 0.5);
        }
      }
    }
    // 分离（仅 320px 内）
    for (let i = 0; i < list.length; i++) {
      const a = list[i];
      for (let j = i + 1; j < list.length; j++) {
        const b = list[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        const dd = Math.hypot(dx, dy);
        if (dd > 320 || dd < 0.01) continue;
        const min = a.r + b.r;
        if (dd < min) {
          const push = (min - dd) / dd * 0.5;
          a.x -= dx * push; a.y -= dy * push;
          b.x += dx * push; b.y += dy * push;
        }
      }
    }
  }

  function updateAffix(e, dt) {
    const run = G.run, p = run.player;
    if (e.affixes.indexOf('reflective') >= 0) {
      e.refT = (e.refT || 0) + dt;
      if (e.refT > 3) {
        e.refT = 0;
        run.effects.push({ type: 'ring', x: e.x, y: e.y, max: 90, color: '#ffd43b', t: 0.3, life: 0.3 });
        let n = 0;
        for (let i = run.bullets.length - 1; i >= 0; i--) {
          const b = run.bullets[i];
          if (dist(b.x, b.y, e.x, e.y) < 100) { run.bullets.splice(i, 1); n++; }
        }
        if (n) for (let i = 0; i < 3; i++) eShot(e.x, e.y, Math.atan2(p.y - e.y, p.x - e.x) + rand(-0.4, 0.4), 300, e.dmg * 0.6, 6, '#ffd43b', {});
      }
    }
    if (e.affixes.indexOf('summoner') >= 0) {
      e.sumT = (e.sumT || 0) + dt;
      if (e.sumT > 7 && run.enemies.length < MAX_ENEMIES - 2) {
        e.sumT = 0;
        const t = choose(FLOORS[run.floor].pool);
        const c = spawnEnemy(t, e.x + rand(-40, 40), e.y + rand(-40, 40), false);
        if (c) burst(c.x, c.y, c.def.color, 8, 140, 3, 0.3);
      }
    }
    if (e.affixes.indexOf('toxic') >= 0) {
      e.toxT = (e.toxT || 0) + dt;
      if (e.toxT > 2.5) { e.toxT = 0; run.hazards.push({ kind: 'cloud', x: e.x, y: e.y, r: 46, t: 3, tick: 0, dmg: 3, color: '#a9e34b', poison: 1 }); }
    }
  }

  // ======================================================================
  //  §23 Boss 状态机（7 Boss / 26 招式）
  // ======================================================================
  function startBossMove(b) {
    const ph = b.def.phases[b.phase] || b.def.phases[0];
    const moves = ph.moves;
    let name = choose(moves);
    if (moves.length > 1 && name === b.lastMove) name = choose(moves);
    b.lastMove = name;
    b.moveName = name; b.mt = 0; b.md = {};
    b.phaseInterval = ph.interval;
  }

  function endBossMove(b) {
    b.moveName = null; b.mt = 0;
    b.rest = (b.phaseInterval || 1.8) * rand(0.75, 1.2);
    b.vx = 0; b.vy = 0; b.beams.length = 0;
  }

  function updateBoss(dt) {
    const run = G.run, b = run.boss, p = run.player;
    if (!b || b.dead) return;
    b.t += dt;
    b.hitFlash = Math.max(0, b.hitFlash - dt);
    b.hitstopCd = Math.max(0, (b.hitstopCd || 0) - dt);
    b.tele = Math.max(0, b.tele - dt);
    b.invuln = Math.max(0, b.invuln - dt);
    b.contactT = Math.max(0, (b.contactT || 0) - dt);
    if (b.freezeT > 0) b.freezeT -= dt;
    b.ang = Math.atan2(p.y - b.y, p.x - b.x);
    if (b.invuln <= 0 && b.freezeT <= 0) {
      if (!b.moveName) {
        b.rest -= dt;
        const d = dist(b.x, b.y, p.x, p.y);
        if (d > 220) { b.vx = lerp(b.vx, Math.cos(b.ang) * 70, 0.04); b.vy = lerp(b.vy, Math.sin(b.ang) * 70, 0.04); }
        if (b.rest <= 0) startBossMove(b);
      } else {
        b.mt += dt;
        runBossMove(b, dt, p, run);
      }
    }
    // 位移
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.vx *= 0.92; b.vy *= 0.92;
    b.x = clamp(b.x, WALL + b.r, ROOM_W - WALL - b.r);
    b.y = clamp(b.y, WALL + b.r, ROOM_H - WALL - b.r);
    // 光束判定
    for (let i = b.beams.length - 1; i >= 0; i--) {
      const bm = b.beams[i];
      bm.life -= dt;
      if (bm.life <= 0) { b.beams.splice(i, 1); continue; }
      if (bm.track) bm.ang = Math.atan2(p.y - b.y, p.x - b.x) + Math.sin(b.t * 1.4) * 0.35;
      const dx = Math.cos(bm.ang), dy = Math.sin(bm.ang);
      const rx = p.x - b.x, ry = p.y - b.y;
      const t = clamp(rx * dx + ry * dy, 0, bm.len);
      const dd = Math.hypot(rx - dx * t, ry - dy * t);
      if (dd < bm.w / 2 + p.r) hurtPlayer(bm.dmg, b);
    }
    // 接触伤害
    if (dist(b.x, b.y, p.x, p.y) < b.r + p.r && b.contactT <= 0) {
      b.contactT = 0.7;
      hurtPlayer(b.dmg * 0.8, b);
    }
  }

  function runBossMove(b, dt, p, run) {
    const m = b.md, t = b.mt, aim = Math.atan2(p.y - b.y, p.x - b.x);
    const dmg = b.dmg;
    const col = b.def.color, acc = b.def.accent;
    switch (b.moveName) {
      case 'hopSlam': {
        if (t < 0.55) { b.tele = 1; }
        else if (t < 0.9) {
          if (!m.jump) { m.jump = true; m.tx = p.x; m.ty = p.y; b.tele = 0; }
          b.x = lerp(b.x, m.tx, 0.16); b.y = lerp(b.y, m.ty, 0.16);
        } else if (!m.landed) {
          m.landed = true;
          explode(b.x, b.y, 130, dmg, col, {});
          bossRing(b.x, b.y, 10, 260, dmg * 0.6, 8, acc);
          shake(0.3);
        } else if (t > 1.35) endBossMove(b);
        break;
      }
      case 'radialSlime': {
        if (t > 0.45 && !m.fired) { m.fired = true; bossRing(b.x, b.y, 14, 240, dmg * 0.55, 8, col, { off: rand(0, 1) }); Sound.play('launch'); }
        if (t > 0.9) endBossMove(b);
        break;
      }
      case 'summonMinis': {
        if (t > 0.5 && !m.done) {
          m.done = true;
          for (let i = 0; i < 3; i++) {
            const c = spawnEnemy('minislime', b.x + rand(-70, 70), b.y + rand(-50, 50), false);
            if (c) burst(c.x, c.y, c.def.color, 8, 150, 3, 0.3);
          }
          Sound.play('skill');
        }
        if (t > 1.0) endBossMove(b);
        break;
      }
      case 'rollCharge': {
        if (t < 0.5) { b.tele = 1; }
        else if (t < 1.5) {
          if (!m.roll) { m.roll = true; b.tele = 0; m.a = aim; Sound.play('launch'); }
          b.vx = Math.cos(m.a) * 520; b.vy = Math.sin(m.a) * 520;
          if (chance(0.5)) burst(b.x, b.y, col, 2, 90, 4, 0.3);
        } else endBossMove(b);
        break;
      }
      case 'spiralSlime': {
        m.a = m.a === undefined ? rand(0, TAU) : m.a;
        if (t < 1.9) {
          m.acc = (m.acc || 0) + dt;
          while (m.acc > 0.1) {
            m.acc -= 0.1; m.a += 0.42;
            bossShot(b.x, b.y, m.a, 230, dmg * 0.45, 7, col);
            bossShot(b.x, b.y, m.a + Math.PI, 230, dmg * 0.45, 7, col);
          }
        } else endBossMove(b);
        break;
      }
      case 'drillCharge': {
        if (t < 0.4) { b.tele = 1; }
        else {
          if (!m.dash) { m.dash = 1; m.dashT = 0; m.a = aim; m.count = 0; b.tele = 0; }
          m.dashT -= dt;
          if (m.dashT <= 0) {
            m.count++;
            m.a = aim; m.dashT = 0.42;
            b.vx = Math.cos(m.a) * 620; b.vy = Math.sin(m.a) * 620;
            Sound.play('launch');
            if (m.count >= 3) { endBossMove(b); break; }
          }
        }
        break;
      }
      case 'deployTurrets': {
        if (t > 0.5 && !m.done) {
          m.done = true;
          for (let i = 0; i < 2; i++) {
            const c = spawnEnemy('turret', 300 + i * 680, 260 + rand(-40, 40), false);
            if (c) burst(c.x, c.y, c.def.color, 10, 180, 4, 0.4);
          }
          Sound.play('skill');
        }
        if (t > 1.0) endBossMove(b);
        break;
      }
      case 'gearNova': {
        if (t > 0.45 && !m.a1) { m.a1 = true; bossRing(b.x, b.y, 16, 280, dmg * 0.5, 9, acc); Sound.play('bounce'); }
        if (t > 0.95 && !m.a2) { m.a2 = true; bossRing(b.x, b.y, 16, 210, dmg * 0.5, 9, col, { off: 0.2 }); Sound.play('bounce'); }
        if (t > 1.4) endBossMove(b);
        break;
      }
      case 'laserSweep': {
        if (t < 0.6) { b.tele = 1; }
        else {
          if (!m.beam) { m.beam = true; m.ba = aim - 0.8; b.tele = 0; }
          m.ba += dt * 0.85;
          b.beams = [{ ang: m.ba, len: 900, w: 26, dmg: dmg * 0.5, life: 0.2, color: acc }];
          if (chance(0.4)) Sound.play('laser');
          if (t > 2.2) endBossMove(b);
        }
        break;
      }
      case 'iceBreath': {
        if (t < 0.4) { b.tele = 1; }
        else {
          b.tele = 0;
          m.acc = (m.acc || 0) + dt;
          while (m.acc > 0.07) {
            m.acc -= 0.07;
            bossShot(b.x + Math.cos(aim) * b.r, b.y + Math.sin(aim) * b.r, aim + rand(-0.35, 0.35), rand(230, 330), dmg * 0.4, 8, '#a5d8ff', { slow: 0.35, life: 2 });
          }
          if (t > 1.6) endBossMove(b);
        }
        break;
      }
      case 'icicleRain': {
        m.acc = (m.acc || 0) + dt;
        if (m.acc > 0.22 && t < 1.8) {
          m.acc = 0;
          const x = rand(120, ROOM_W - 120), y = rand(100, ROOM_H - 100);
          run.hazards.push({ kind: 'delayBoom', x, y, r: 64, t: 0.55, dmg: dmg * 0.7, color: '#a5d8ff', freeze: 1.0 });
          bossShot(x, y - 300, Math.PI / 2, 700, dmg * 0.5, 8, '#c5f6fa', { life: 0.6 });
        }
        if (t > 2.1) endBossMove(b);
        break;
      }
      case 'teleportRing': {
        if (t < 0.35) { b.tele = 1; }
        else if (!m.tp) {
          m.tp = true;
          burst(b.x, b.y, col, 14, 200, 4, 0.35);
          const a = rand(0, TAU);
          b.x = clamp(p.x + Math.cos(a) * 240, WALL + b.r, ROOM_W - WALL - b.r);
          b.y = clamp(p.y + Math.sin(a) * 240, WALL + b.r, ROOM_H - WALL - b.r);
          burst(b.x, b.y, col, 14, 200, 4, 0.35);
          bossRing(b.x, b.y, 12, 260, dmg * 0.5, 8, acc);
          Sound.play('portal');
        } else if (t > 0.9) endBossMove(b);
        break;
      }
      case 'freezeZones': {
        if (t > 0.4 && !m.done) {
          m.done = true;
          for (let i = 0; i < 3; i++) {
            const x = p.x + rand(-220, 220), y = p.y + rand(-180, 180);
            run.hazards.push({ kind: 'slow', x: clamp(x, 120, ROOM_W - 120), y: clamp(y, 100, ROOM_H - 100), r: 110, t: 4, color: '#74c0fc' });
          }
          Sound.play('ice');
        }
        if (t > 0.9) endBossMove(b);
        break;
      }
      case 'seedBurst': {
        if (t > 0.4 && !m.done) {
          m.done = true;
          for (let i = 0; i < 5; i++) bossShot(b.x, b.y, aim + (i - 2) * 0.24, 260, dmg * 0.55, 9, acc, { homing: 1.5, life: 4 });
          Sound.play('launch');
        }
        if (t > 0.9) endBossMove(b);
        break;
      }
      case 'poisonNova': {
        if (t > 0.4 && !m.done) {
          m.done = true;
          bossRing(b.x, b.y, 18, 220, dmg * 0.5, 9, '#a9e34b', { poison: 2, life: 3.4 });
          for (let i = 0; i < 4; i++) run.hazards.push({ kind: 'cloud', x: b.x + rand(-180, 180), y: b.y + rand(-120, 120), r: 80, t: 4, tick: 0, dmg: 4, color: '#a9e34b', poison: 1 });
          Sound.play('launch');
        }
        if (t > 1.0) endBossMove(b);
        break;
      }
      case 'spawnPods': {
        if (t > 0.5 && !m.done) {
          m.done = true;
          for (let i = 0; i < 2; i++) {
            const c = spawnEnemy('spawner', 360 + i * 560, 200 + rand(-30, 30), false);
            if (c) burst(c.x, c.y, c.def.color, 12, 180, 4, 0.4);
          }
          Sound.play('skill');
        }
        if (t > 1.0) endBossMove(b);
        break;
      }
      case 'vineWall': {
        if (t > 0.45 && !m.done) {
          m.done = true;
          for (let i = 0; i < 5; i++) {
            run.hazards.push({ kind: 'delayBoom', x: 240 + i * 200, y: 360 + Math.sin(i) * 140, r: 96, t: 0.6 + i * 0.12, dmg: dmg * 0.8, color: '#8ce99a' });
          }
          Sound.play('launch');
        }
        if (t > 1.5) endBossMove(b);
        break;
      }
      case 'voidRings': {
        if (t > 0.35 && !m.a1) { m.a1 = true; bossRing(b.x, b.y, 22, 250, dmg * 0.5, 8, col); Sound.play('bounce'); }
        if (t > 0.85 && !m.a2) { m.a2 = true; bossRing(b.x, b.y, 22, 190, dmg * 0.5, 8, acc, { off: 0.14 }); Sound.play('bounce'); }
        if (t > 1.3) endBossMove(b);
        break;
      }
      case 'teleportSlam': {
        if (t < 0.4) { b.tele = 1; }
        else if (!m.tp) {
          m.tp = true; b.tele = 0;
          burst(b.x, b.y, col, 16, 220, 5, 0.4);
          b.x = p.x; b.y = p.y;
          burst(b.x, b.y, acc, 16, 220, 5, 0.4);
        } else if (t > 0.75 && !m.boom) {
          m.boom = true;
          explode(b.x, b.y, 160, dmg * 1.2, acc, {});
          bossRing(b.x, b.y, 14, 300, dmg * 0.5, 8, col);
          shake(0.28);
        } else if (t > 1.25) endBossMove(b);
        break;
      }
      case 'gravityLaser': {
        if (t < 0.6) { b.tele = 1; }
        else {
          b.tele = 0;
          if (!m.beam) { m.beam = true; }
          b.beams = [{ ang: aim, len: 1000, w: 34, dmg: dmg * 0.45, life: 0.2, track: true, color: acc }];
          if (chance(0.5)) Sound.play('laser');
          if (t > 2.0) endBossMove(b);
        }
        break;
      }
      case 'clones': {
        if (t > 0.4 && !m.done) {
          m.done = true;
          for (let i = 0; i < 2; i++) {
            const c = spawnEnemy('mirror', b.x + rand(-120, 120), b.y + rand(-90, 90), false);
            if (c) { c.hp = c.maxHp = Math.round(c.maxHp * 1.4); burst(c.x, c.y, c.def.color, 12, 180, 4, 0.4); }
          }
          Sound.play('skill');
        }
        if (t > 0.95) endBossMove(b);
        break;
      }
      case 'spiralHell': {
        m.a = m.a === undefined ? rand(0, TAU) : m.a;
        if (t < 2.2) {
          m.acc = (m.acc || 0) + dt;
          while (m.acc > 0.065) {
            m.acc -= 0.065; m.a += 0.5;
            const arms = b.phase >= 2 ? 4 : 3;
            for (let i = 0; i < arms; i++) bossShot(b.x, b.y, m.a + i * TAU / arms, 260, dmg * 0.4, 7, i % 2 ? acc : col);
          }
        } else endBossMove(b);
        break;
      }
      case 'mirrorVolley': {
        if (t < 0.5) b.tele = 1;
        else {
          b.tele = 0;
          m.acc = (m.acc || 0) + dt;
          if (m.acc > 0.3 && (m.n || 0) < 3) {
            m.acc = 0; m.n = (m.n || 0) + 1;
            for (let i = -1; i <= 1; i++) bossShot(b.x, b.y, aim + i * 0.16, 460, dmg * 0.5, 7, acc, { life: 2.4 });
            Sound.play('pierce');
          }
          if (t > 1.5) endBossMove(b);
        }
        break;
      }
      case 'dashSlash': {
        if (t < 0.4) { b.tele = 1; }
        else if (t < 0.75) {
          if (!m.d) { m.d = true; m.a = aim; b.tele = 0; Sound.play('launch'); }
          b.vx = Math.cos(m.a) * 760; b.vy = Math.sin(m.a) * 760;
        } else if (!m.slash) {
          m.slash = true;
          run.effects.push({ type: 'swing', x: b.x, y: b.y, ang: b.ang, arc: 2.4, range: 150, color: acc, t: 0.2, life: 0.2 });
          for (let i = 0; i < 6; i++) bossShot(b.x, b.y, b.ang + (i - 2.5) * 0.22, 420, dmg * 0.5, 7, acc, { life: 1.6 });
          Sound.play('melee');
        } else if (t > 1.1) endBossMove(b);
        break;
      }
      case 'shieldOrbs': {
        if (t > 0.4 && !m.done) {
          m.done = true;
          b.shieldHp = Math.round(b.maxHp * 0.12);
          for (let i = 0; i < 4; i++) {
            run.hazards.push({ kind: 'orb', x: b.x, y: b.y, ang: i * TAU / 4, r: 20, t: 6, tick: 0, dmg: dmg * 0.4, color: acc, host: b });
          }
          Sound.play('shield');
        }
        if (t > 1.0) endBossMove(b);
        break;
      }
      case 'triElement': {
        if (t > 0.4 && !m.a1) { m.a1 = true; bossRing(b.x, b.y, 18, 300, dmg * 0.4, 7, '#ff922b', { burn: 1, off: 0 }); }
        if (t > 0.7 && !m.a2) { m.a2 = true; bossRing(b.x, b.y, 18, 200, dmg * 0.45, 8, '#74c0fc', { slow: 0.35, off: 0.1 }); }
        if (t > 1.0 && !m.a3) { m.a3 = true; bossRing(b.x, b.y, 18, 250, dmg * 0.4, 7, '#a9e34b', { poison: 2, off: 0.2 }); Sound.play('launch'); }
        if (t > 1.5) endBossMove(b);
        break;
      }
      default: endBossMove(b);
    }
  }

  // ======================================================================
  //  §24 子弹 / 敌弹 / 召唤物 / 危害区 / 掉落物
  // ======================================================================
  function nearestTarget(x, y, maxD) {
    const run = G.run;
    let best = null, bd = maxD || 1e9;
    for (const e of run.enemies) {
      if (e.hidden) continue;
      const d = dist(x, y, e.x, e.y);
      if (d < bd) { bd = d; best = e; }
    }
    if (run.boss && run.boss.hp > 0) {
      const d = dist(x, y, run.boss.x, run.boss.y);
      if (d < bd + 20) { bd = d; best = run.boss; }
    }
    return best;
  }

  function bulletHit(b, target) {
    if (target === G.run.boss) {
      if (b.bossHit) return false;
      b.bossHit = true;
      damageBoss(target, damageMul(target, b.dmg), { crit: false });
    } else {
      damageEnemy(target, damageMul(target, b.dmg),
        { weapon: b.w, knock: b.knock, slow: b.slow, slowDur: b.slowDur, freeze: b.freeze, poison: b.poison, poisonDur: b.poisonDur, burn: b.burn, burnDur: b.burnDur });
    }
    return true;
  }

  function updateBullets(dt) {
    const run = G.run, obs = run.room.obstacles, p = run.player;
    for (let i = run.bullets.length - 1; i >= 0; i--) {
      const b = run.bullets[i];
      b.born += dt; b.spin = (b.spin || 0) + dt * 16;
      b.life -= dt;
      if (b.life <= 0) {
        if (b.explode) explode(b.x, b.y, b.explode, damageMul(null, b.dmg), b.color, {});
        run.bullets.splice(i, 1); continue;
      }
      if (b.mine) {
        b.arm = (b.arm === undefined ? 0.4 : b.arm) - dt;
        if (b.arm <= 0) {
          let trig = false;
          for (const e of run.enemies) if (dist(b.x, b.y, e.x, e.y) < 42 + e.r) { trig = true; break; }
          if (!trig && run.boss && dist(b.x, b.y, run.boss.x, run.boss.y) < 42 + run.boss.r) trig = true;
          if (trig) {
            explode(b.x, b.y, b.explode || 70, damageMul(null, b.dmg), b.color,
              { freeze: b.freeze, slow: b.slow, poison: b.poison, poisonDur: b.poisonDur });
            run.bullets.splice(i, 1); continue;
          }
        }
        continue;
      }
      if (b.boomerang) {
        if (b.phase === 'out' && b.born > 0.36) b.phase = 'back';
        if (b.phase === 'back') {
          const a = Math.atan2(p.y - b.y, p.x - b.x);
          b.vx = lerp(b.vx, Math.cos(a) * 1050, 0.14);
          b.vy = lerp(b.vy, Math.sin(a) * 1050, 0.14);
          if (dist(b.x, b.y, p.x, p.y) < 28) { run.bullets.splice(i, 1); continue; }
        }
      }
      if (b.homing) {
        const tg = nearestTarget(b.x, b.y, 460);
        if (tg) {
          const want = Math.atan2(tg.y - b.y, tg.x - b.x);
          const cur = Math.atan2(b.vy, b.vx);
          const na = cur + clamp(angDiff(cur, want), -b.homing * dt, b.homing * dt);
          const sp = Math.hypot(b.vx, b.vy);
          b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
        }
      }
      b.x += b.vx * dt; b.y += b.vy * dt;
      // 墙
      let wallHit = false;
      if (b.x < WALL + b.r) { b.x = WALL + b.r; b.vx = Math.abs(b.vx); wallHit = true; }
      if (b.x > ROOM_W - WALL - b.r) { b.x = ROOM_W - WALL - b.r; b.vx = -Math.abs(b.vx); wallHit = true; }
      if (b.y < WALL + b.r) { b.y = WALL + b.r; b.vy = Math.abs(b.vy); wallHit = true; }
      if (b.y > ROOM_H - WALL - b.r) { b.y = ROOM_H - WALL - b.r; b.vy = -Math.abs(b.vy); wallHit = true; }
      if (wallHit) {
        if (b.boomerang) { /* 回旋刃穿墙反弹不消耗 */ }
        else if (b.bounce > 0) {
          b.bounce--;
          if (hasRelic(run, 'kaleido')) b.dmg *= 1.1;
          burst(b.x, b.y, b.color, 3, 110, 2, 0.2);
          Sound.play('bounce');
        } else {
          if (b.explode) explode(b.x, b.y, b.explode, damageMul(null, b.dmg), b.color, {});
          run.bullets.splice(i, 1); continue;
        }
      }
      // 障碍
      if (obs && obs.length && insideObstacle(obs, b.x, b.y, b.r * 0.6)) {
        if (b.bounce > 0) { b.bounce--; b.vx *= -1; b.vy *= -1; }
        else if (!b.boomerang) {
          if (b.explode) explode(b.x, b.y, b.explode, damageMul(null, b.dmg), b.color, {});
          run.bullets.splice(i, 1); continue;
        }
      }
      // 命中
      let removed = false;
      for (const e of run.enemies) {
        if (b.hit.has(e)) continue;
        if (dist(b.x, b.y, e.x, e.y) > b.r + e.r) continue;
        b.hit.add(e);
        bulletHit(b, e);
        if (b.pull) {
          for (const o of run.enemies) {
            const dd = dist(b.x, b.y, o.x, o.y);
            if (dd < 170 && dd > 1) { o.x += (b.x - o.x) / dd * 22; o.y += (b.y - o.y) / dd * 22; }
          }
        }
        if (b.chain > 0) {
          let src = e;
          for (let c = 0; c < b.chain; c++) {
            let nx = null, nd = 200;
            for (const o of run.enemies) {
              if (o === src || b.hit.has(o)) continue;
              const dd = dist(src.x, src.y, o.x, o.y);
              if (dd < nd) { nd = dd; nx = o; }
            }
            if (!nx) break;
            run.effects.push({ type: 'zap', x: src.x, y: src.y, x2: nx.x, y2: nx.y, color: b.color, t: 0.13, life: 0.13 });
            b.hit.add(nx);
            damageEnemy(nx, damageMul(nx, b.dmg * 0.8), {});
            src = nx;
          }
        }
        run.stats.hits++;
        b.pierce--;
        if (b.pierce < 0) {
          if (b.explode) explode(b.x, b.y, b.explode, damageMul(null, b.dmg), b.color,
            { freeze: b.freeze, slow: b.slow, poison: b.poison, poisonDur: b.poisonDur, burn: b.burn });
          run.bullets.splice(i, 1);
          removed = true;
        }
        break;
      }
      if (removed) continue;
      if (run.boss && !b.bossHit && dist(b.x, b.y, run.boss.x, run.boss.y) < b.r + run.boss.r) {
        b.bossHit = true;
        damageBoss(run.boss, damageMul(run.boss, b.dmg), {});
        run.stats.hits++;
        b.pierce--;
        if (b.pierce < 0) {
          if (b.explode) explode(b.x, b.y, b.explode, damageMul(null, b.dmg), b.color, {});
          run.bullets.splice(i, 1);
        }
      }
    }
  }

  function updateEBullets(dt) {
    const run = G.run, p = run.player;
    for (let i = run.ebullets.length - 1; i >= 0; i--) {
      const b = run.ebullets[i];
      b.t = (b.t || 0) + dt;
      b.life -= dt;
      if (b.life <= 0) { run.ebullets.splice(i, 1); continue; }
      if (b.homing) {
        const want = Math.atan2(p.y - b.y, p.x - b.x);
        const cur = Math.atan2(b.vy, b.vx);
        const na = cur + clamp(angDiff(cur, want), -b.homing * dt, b.homing * dt);
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
      }
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < WALL || b.x > ROOM_W - WALL || b.y < WALL || b.y > ROOM_H - WALL) {
        run.ebullets.splice(i, 1); continue;
      }
      if (dist(b.x, b.y, p.x, p.y) < b.r + p.r) {
        hurtPlayer(b.dmg, b);
        run.ebullets.splice(i, 1); continue;
      }
    }
  }

  function updateTurrets(dt) {
    const run = G.run;
    for (let i = run.turrets.length - 1; i >= 0; i--) {
      const t = run.turrets[i];
      t.t -= dt;
      if (t.t <= 0) { run.turrets.splice(i, 1); continue; }
      t.cd = Math.max(0, (t.cd || 0) - dt);
      const tg = nearestTarget(t.x, t.y, 640);
      if (t.kind === 'worm') {
        if (tg) {
          const a = Math.atan2(tg.y - t.y, tg.x - t.x);
          t.x += Math.cos(a) * 190 * dt; t.y += Math.sin(a) * 190 * dt;
        }
        t.hitT = Math.max(0, (t.hitT || 0) - dt);
        if (tg && dist(t.x, t.y, tg.x, tg.y) < 40 + (tg.r || 20) && t.hitT <= 0) {
          t.hitT = 0.45;
          if (tg === run.boss) damageBoss(tg, damageMul(tg, t.dmg), {});
          else damageEnemy(tg, damageMul(tg, t.dmg * 1.4), {});
          burst(tg.x, tg.y, t.color, 4, 120, 3, 0.2);
        }
        continue;
      }
      if (t.kind === 'saw') {
        t.spin = (t.spin || 0) + dt * 18;
        t.hitT = Math.max(0, (t.hitT || 0) - dt);
        if (t.hitT <= 0) {
          for (const e of run.enemies) {
            if (dist(t.x, t.y, e.x, e.y) < 52 + e.r) { damageEnemy(e, damageMul(e, t.dmg), {}); t.hitT = 0.28; break; }
          }
          if (run.boss && dist(t.x, t.y, run.boss.x, run.boss.y) < 52 + run.boss.r && t.hitT <= 0) {
            damageBoss(run.boss, damageMul(run.boss, t.dmg), {}); t.hitT = 0.28;
          }
        }
        continue;
      }
      if (t.kind === 'field') {
        t.tick = (t.tick || 0) + dt;
        if (t.tick > 0.5) {
          t.tick = 0;
          for (const e of run.enemies) {
            if (dist(t.x, t.y, e.x, e.y) < 130) { e.slowT = Math.max(e.slowT, 1.2); damageEnemy(e, damageMul(e, t.dmg * 0.6), {}); }
          }
        }
        continue;
      }
      if (t.kind === 'obelisk') {
        if (!tg) continue;
        t.ang = Math.atan2(tg.y - t.y, tg.x - t.x);
        if (t.cd <= 0) {
          t.cd = 0.45;
          run.effects.push({ type: 'zap', x: t.x, y: t.y, x2: t.x + Math.cos(t.ang) * 520, y2: t.y + Math.sin(t.ang) * 520, color: t.color, t: 0.1, life: 0.1 });
          for (const e of run.enemies.slice()) {
            const dx = e.x - t.x, dy = e.y - t.y;
            const along = dx * Math.cos(t.ang) + dy * Math.sin(t.ang);
            if (along < 0) continue;
            const perp = Math.abs(dx * Math.sin(t.ang) - dy * Math.cos(t.ang));
            if (perp < 22 + e.r) damageEnemy(e, damageMul(e, t.dmg), {});
          }
          if (run.boss) damageBoss(run.boss, damageMul(run.boss, t.dmg * 0.6), {});
        }
        continue;
      }
      // turret / flower / spore
      if (!tg || t.cd > 0) continue;
      t.ang = Math.atan2(tg.y - t.y, tg.x - t.x);
      t.cd = t.rate;
      const color = t.color || '#ffd43b';
      if (t.kind === 'spore') {
        run.bullets.push({
          x: t.x, y: t.y, vx: Math.cos(t.ang) * 480, vy: Math.sin(t.ang) * 480, r: 6,
          dmg: t.dmg, color, life: 2.4, maxLife: 2.4, pierce: 0, bounce: 0, homing: 4,
          hit: new Set(), kind: 'spore', born: 0, trail: true
        });
      } else if (t.kind === 'flower') {
        for (let k = 0; k < 3; k++) {
          run.bullets.push({
            x: t.x, y: t.y, vx: Math.cos(t.ang + (k - 1) * 0.2) * 620, vy: Math.sin(t.ang + (k - 1) * 0.2) * 620,
            r: 5, dmg: t.dmg * 0.6, color, life: 1.4, maxLife: 1.4, pierce: 0, bounce: 0, homing: 0,
            hit: new Set(), kind: 'petal', born: 0, trail: true
          });
        }
      } else {
        if (run.bullets.length >= MAX_BULLETS) run.bullets.shift();
        run.bullets.push({
          x: t.x + Math.cos(t.ang) * 18, y: t.y + Math.sin(t.ang) * 18,
          vx: Math.cos(t.ang) * 900, vy: Math.sin(t.ang) * 900, r: 5,
          dmg: t.dmg, color, life: 1.3, maxLife: 1.3, pierce: 0, bounce: 0, homing: 0,
          hit: new Set(), kind: 'turret', born: 0, trail: true
        });
      }
      Sound.play('pistol');
    }
  }

  function updateHazards(dt) {
    const run = G.run, p = run.player;
    for (let i = run.hazards.length - 1; i >= 0; i--) {
      const h = run.hazards[i];
      h.t -= dt;
      if (h.t <= 0) { run.hazards.splice(i, 1); continue; }
      if (h.kind === 'sing') {
        for (const e of run.enemies) {
          const dd = dist(h.x, h.y, e.x, e.y);
          if (dd < h.r && dd > 2) {
            const pull = 120 * dt;
            e.x += (h.x - e.x) / dd * pull; e.y += (h.y - e.y) / dd * pull;
          }
        }
        h.tick = (h.tick || 0) + dt;
        if (h.tick > 0.25) {
          h.tick = 0;
          for (const e of run.enemies) if (dist(h.x, h.y, e.x, e.y) < h.r) damageEnemy(e, damageMul(e, h.dmg), {});
          if (run.boss && dist(h.x, h.y, run.boss.x, run.boss.y) < h.r + run.boss.r) damageBoss(run.boss, damageMul(run.boss, h.dmg), {});
        }
      } else if (h.kind === 'delayBoom') {
        if (h.t <= 0.02 && !h.done) {
          h.done = true;
          explode(h.x, h.y, h.r, h.dmg, h.color, { freeze: h.freeze });
        }
      } else if (h.kind === 'heal') {
        h.tick = (h.tick || 0) + dt;
        if (dist(h.x, h.y, p.x, p.y) < h.r) {
          if (h.tick > 0.5) { h.tick = 0; run.hp = Math.min(run.maxHp, run.hp + 3); addText(p.x, p.y - 24, '+3', '#69db7c', 13); }
        }
      } else if (h.kind === 'cloud') {
        h.tick = (h.tick || 0) + dt;
        if (h.tick > 0.6) {
          h.tick = 0;
          for (const e of run.enemies) if (dist(h.x, h.y, e.x, e.y) < h.r + e.r) damageEnemy(e, damageMul(e, h.dmg), {});
        }
      } else if (h.kind === 'slow') {
        for (const e of run.enemies) if (dist(h.x, h.y, e.x, e.y) < h.r) e.slowT = Math.max(e.slowT, 0.4);
      } else if (h.kind === 'orb') {
        if (h.host && h.host.hp > 0) {
          h.ang += dt * 1.4;
          h.x = h.host.x + Math.cos(h.ang) * 130;
          h.y = h.host.y + Math.sin(h.ang) * 130;
        } else { run.hazards.splice(i, 1); continue; }
        h.tick = (h.tick || 0) + dt;
        if (h.tick > 1.6) {
          h.tick = 0;
          const a = Math.atan2(p.y - h.y, p.x - h.x);
          eShot(h.x, h.y, a, 300, h.dmg, 7, h.color, {});
        }
        if (dist(h.x, h.y, p.x, p.y) < h.r + p.r) hurtPlayer(h.dmg, h);
      }
    }
  }

  function updatePickups(dt) {
    const run = G.run, p = run.player;
    const mag = run.magnet;
    for (let i = run.pickups.length - 1; i >= 0; i--) {
      const it = run.pickups[i];
      it.t += dt;
      const d = dist(it.x, it.y, p.x, p.y);
      if (d < mag) {
        const a = Math.atan2(p.y - it.y, p.x - it.x);
        const sp = d < 40 ? 620 : 420;
        it.x += Math.cos(a) * sp * dt; it.y += Math.sin(a) * sp * dt;
      } else {
        it.x += it.vx * dt; it.y += it.vy * dt;
        it.vx *= 0.92; it.vy *= 0.92;
      }
      if (d < p.r + 14) {
        collectPickup(it);
        run.pickups.splice(i, 1);
      }
    }
  }

  function collectPickup(it) {
    const run = G.run;
    if (it.type === 'gold') {
      run.coins += Math.max(1, Math.round(it.val));
      Sound.play('pickup');
    } else if (it.type === 'hp') {
      run.hp = Math.min(run.maxHp, run.hp + Math.round(run.maxHp * 0.12));
      addText(run.player.x, run.player.y - 26, '生命', '#69db7c', 14);
      Sound.play('heal');
    } else if (it.type === 'energy') {
      run.energy = Math.min(run.maxEnergy, run.energy + 25);
      Sound.play('pickup');
    } else if (it.type === 'shard') {
      run.shards++;
      toast(`回响碎片 ${run.shards}/3`);
      addText(run.player.x, run.player.y - 30, '回响碎片', '#ffe066', 16);
      Sound.play('pickup');
    } else if (it.type === 'relic') {
      G.reward = { options: rollRelicOptions(3), source: 'drop' };
      G.state = 'reward';
      Sound.play('pickup');
    }
  }

  // ======================================================================
  //  §25 主更新循环 · 相机 · 结算
  // ======================================================================
  function pauseGame() {
    if (G.state !== 'playing') return;
    G.state = 'paused';
    Sound.play('ui');
  }
  function resumeGame() {
    if (G.state !== 'paused') return;
    G.state = 'playing';
    G.hitstop = 0;
  }
  function toggleSound() {
    save.sound = !save.sound;
    writeSave();
    if (save.sound) { Sound.init(); Sound.play('ui'); }
    toast(save.sound ? '音效已开启' : '音效已关闭');
  }

  function victory() {
    const run = G.run;
    if (!run) return;
    G.state = 'victory';
    G.victoryT = 0;
    Sound.play('win');
    Sound.setMusic(null);
    save.gold += run.coins;
    save.wins += 1;
    save.kills += run.kills;
    save.bestFloor = 6;
    save.bestTime = save.bestTime ? Math.min(save.bestTime, run.time) : run.time;
    writeSave();
  }

  function updateWaves(dt) {
    const run = G.run, room = run.room;
    if (!room || !run.waveTotal || run.waveLeft <= 0) return;
    if (run.roomEnterT > 0) return;
    if (run.enemies.length > 0) return;
    run.waveTimer -= dt;
    if (run.waveTimer <= 0) {
      spawnWave(room);
      run.waveLeft--;
      run.waveTimer = 0.9;
      Sound.play('door');
    }
  }

  function updateParticles(dt) {
    const run = G.run;
    for (let i = run.particles.length - 1; i >= 0; i--) {
      const p = run.particles[i];
      p.life -= dt;
      if (p.life <= 0) { run.particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.94; p.vy *= 0.94;
    }
  }
  function updateTexts(dt) {
    const run = G.run;
    for (let i = run.texts.length - 1; i >= 0; i--) {
      const t = run.texts[i];
      t.t -= dt;
      t.y += t.vy * dt;
      if (t.t <= 0) run.texts.splice(i, 1);
    }
  }
  function updateEffects(dt) {
    const run = G.run;
    for (let i = run.effects.length - 1; i >= 0; i--) {
      const e = run.effects[i];
      e.t -= dt;
      if (e.t <= 0) run.effects.splice(i, 1);
    }
  }

  function updateCamera(dt) {
    const run = G.run;
    if (!run) return;
    const p = run.player;
    const hw = Math.min(ROOM_W / 2, view.viewW / 2);
    const hh = Math.min(ROOM_H / 2, view.viewH / 2);
    const tx = clamp(p.x, hw, ROOM_W - hw);
    const ty = clamp(p.y, hh, ROOM_H - hh);
    const k = 1 - Math.pow(0.0008, dt);
    G.cam.x = lerp(G.cam.x, tx, k);
    G.cam.y = lerp(G.cam.y, ty, k);
    run.trauma = Math.max(0, run.trauma - 2.2 * dt);
    run.redFlash = Math.max(0, run.redFlash - dt * 5);
    run.healFlash = Math.max(0, run.healFlash - dt * 3);
    if (G.vibrate > 0) {
      if (navigator.vibrate) { try { navigator.vibrate(Math.min(40, G.vibrate)); } catch (e) {} }
      G.vibrate = 0;
    }
  }

  function updateWhirl(dt) {
    const run = G.run, p = run.player;
    if (!(run.whirlT > 0)) return;
    run.whirlT -= dt;
    run.whirlTick = (run.whirlTick || 0) - dt;
    if (run.whirlTick > 0) return;
    run.whirlTick = 0.12;
    const R = 96;
    const ang = G.time * 14;
    run.effects.push({ type: 'arc', x: p.x, y: p.y, r: R, ang, color: run.char.accent, t: 0.14, life: 0.14 });
    for (const e of run.enemies.slice()) {
      if (dist(p.x, p.y, e.x, e.y) < R + e.r) {
        damageEnemy(e, damageMul(e, 14), { knock: 260 });
        // 吸血角色近战命中额外回复
        if (run.char.passive === 'lifesteal' && chance(0.25)) {
          run.hp = Math.min(run.maxHp, run.hp + 2);
        }
      }
    }
    if (run.boss && dist(p.x, p.y, run.boss.x, run.boss.y) < R + run.boss.r) damageBoss(run.boss, damageMul(run.boss, 14), {});
    Sound.play('hit');
    shake(0.05);
  }

  function updateGame(dt) {
    const run = G.run;
    if (!run) return;
    G.time += dt;
    run.time += dt;
    run.roomEnterT = Math.max(0, run.roomEnterT - dt);
    run.roomClearT = Math.max(0, run.roomClearT - dt);
    run.comboIdxT = Math.max(0, (run.comboIdxT || 0) - dt);
    run.dashBuffT = Math.max(0, (run.dashBuffT || 0) - dt);
    run.shield = Math.max(0, run.shield || 0);
    if (run.temp.until >= 0 && run.temp.until !== run.floor) {
      run.temp.dmg = 0; run.temp.atkSpeed = 0; run.temp.moveSpeed = 0; run.temp.armor = 0;
      run.temp.until = -1;
    }
    if (G.toast) { G.toast.t -= dt; if (G.toast.t <= 0) G.toast = null; }
    if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }
    G.fade = Math.max(0, G.fade - dt * 2.2);

    updatePlayer(dt);
    updateWeapons(dt);
    updateWhirl(dt);
    updateWaves(dt);
    updateEnemies(dt);
    updateBoss(dt);
    updateBullets(dt);
    updateEBullets(dt);
    updateTurrets(dt);
    updateHazards(dt);
    updatePickups(dt);
    updateParticles(dt);
    updateTexts(dt);
    updateEffects(dt);
    checkRoomClear();
    updateCamera(dt);
  }

  // ======================================================================
  //  §26 世界渲染
  // ======================================================================
  function worldToUI(x, y) {
    const sx = view.w / 2 + (x - G.cam.x) * view.scale;
    const sy = view.h / 2 + (y - G.cam.y) * view.scale;
    return { x: (sx - view.ox) / view.ui, y: (sy - view.oy) / view.ui };
  }

  function bakeFloor(room, cfg) {
    const cv = document.createElement('canvas');
    cv.width = ROOM_W; cv.height = ROOM_H;
    const g = cv.getContext('2d');
    const rf = mulberry32((room.seed ^ 0x9e37) >>> 0);
    g.fillStyle = cfg.bg; g.fillRect(0, 0, ROOM_W, ROOM_H);
    const T = 64;
    for (let y = 0; y < ROOM_H; y += T) {
      for (let x = 0; x < ROOM_W; x += T) {
        const v = rf();
        g.fillStyle = v < 0.5 ? cfg.tile : cfg.tile2;
        g.fillRect(x, y, T, T);
        g.strokeStyle = cfg.line;
        g.globalAlpha = 0.45; g.lineWidth = 1;
        g.strokeRect(x + 0.5, y + 0.5, T, T);
        g.globalAlpha = 1;
        if (v > 0.88) {
          g.fillStyle = cfg.accent;
          g.globalAlpha = 0.07;
          g.beginPath(); g.arc(x + T / 2, y + T / 2, 8 + rf() * 14, 0, TAU); g.fill();
          g.globalAlpha = 1;
        }
        if (v < 0.06) {
          g.strokeStyle = cfg.line; g.globalAlpha = 0.6;
          g.beginPath();
          g.moveTo(x + rf() * T, y + rf() * T);
          g.lineTo(x + rf() * T, y + rf() * T);
          g.stroke(); g.globalAlpha = 1;
        }
      }
    }
    // 中央徽记
    g.strokeStyle = cfg.accent; g.globalAlpha = 0.1; g.lineWidth = 3;
    g.beginPath(); g.arc(640, 360, 150, 0, TAU); g.stroke();
    g.beginPath(); g.arc(640, 360, 96, 0, TAU); g.stroke();
    g.globalAlpha = 1;
    return cv;
  }

  function beginWorld() {
    const run = G.run;
    const s = run ? run.trauma * run.trauma * 18 : 0;
    const sx = s ? rand(-s, s) : 0, sy = s ? rand(-s, s) : 0;
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.translate(view.w / 2, view.h / 2);
    ctx.scale(view.scale, view.scale);
    ctx.translate(-G.cam.x + sx, -G.cam.y + sy);
  }
  function beginUI() {
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.translate(view.ox, view.oy);
    ctx.scale(view.ui, view.ui);
  }

  function drawWalls(room, cfg) {
    const c = ctx;
    const t = WALL;
    c.fillStyle = cfg.wall;
    c.fillRect(0, 0, ROOM_W, t);
    c.fillRect(0, ROOM_H - t, ROOM_W, t);
    c.fillRect(0, 0, t, ROOM_H);
    c.fillRect(ROOM_W - t, 0, t, ROOM_H);
    // 墙沿高光
    c.fillStyle = cfg.wallHi;
    c.globalAlpha = 0.55;
    c.fillRect(0, t - 3, ROOM_W, 3);
    c.fillRect(0, ROOM_H - t, ROOM_W, 3);
    c.fillRect(t - 3, 0, 3, ROOM_H);
    c.fillRect(ROOM_W - t, 0, 3, ROOM_H);
    c.globalAlpha = 1;
    // 门
    const sides = [
      ['N', 640 - DOOR_GAP / 2, 0, DOOR_GAP, t],
      ['S', 640 - DOOR_GAP / 2, ROOM_H - t, DOOR_GAP, t],
      ['W', 0, 360 - DOOR_GAP / 2, t, DOOR_GAP],
      ['E', ROOM_W - t, 360 - DOOR_GAP / 2, t, DOOR_GAP]
    ];
    for (const [side, x, y, w, h] of sides) {
      if (!room.doors[side]) continue;
      c.fillStyle = cfg.bg2;
      c.fillRect(x, y, w, h);
      if (room.cleared) {
        c.fillStyle = cfg.accent;
        c.globalAlpha = 0.28;
        c.fillRect(x + 4, y + 4, w - 8, h - 8);
        c.globalAlpha = 0.6;
        c.fillStyle = cfg.accent;
        const pulse = 0.5 + 0.5 * Math.sin(G.time * 3);
        c.globalAlpha = 0.3 + pulse * 0.3;
        c.fillRect(x + 8, y + (h > w ? 8 : h / 2 - 2), w - 16, h > w ? h - 16 : 4);
        c.globalAlpha = 1;
      } else {
        c.fillStyle = cfg.wallHi;
        const n = 4;
        for (let i = 0; i < n; i++) {
          if (h > w) c.fillRect(x + 4, y + 6 + i * ((h - 12) / n), w - 8, (h - 12) / n - 5);
          else c.fillRect(x + 6 + i * ((w - 12) / n), y + 4, (w - 12) / n - 5, h - 8);
        }
        c.strokeStyle = cfg.accent; c.globalAlpha = 0.25; c.lineWidth = 2;
        c.strokeRect(x + 6, y + 6, w - 12, h - 12);
        c.globalAlpha = 1;
      }
    }
  }

  function drawObstacles(room, cfg) {
    const c = ctx;
    for (const o of room.obstacles) {
      c.fillStyle = 'rgba(0,0,0,.35)';
      c.fillRect(o.x + 5, o.y + 7, o.w, o.h);
      c.fillStyle = '#05070b';
      c.fillRect(o.x - 2, o.y - 2, o.w + 4, o.h + 4);
      c.fillStyle = cfg.wall;
      c.fillRect(o.x, o.y, o.w, o.h);
      c.fillStyle = hexShade(cfg.wallHi, -0.08);
      c.fillRect(o.x, o.y, o.w, Math.max(3, o.h * 0.16));
      c.fillStyle = hexShade(cfg.wall, -0.45);
      c.fillRect(o.x, o.y + o.h - Math.max(3, o.h * 0.18), o.w, Math.max(3, o.h * 0.18));
      c.fillStyle = 'rgba(0,0,0,.22)';
      for (let y = o.y + 14; y < o.y + o.h - 6; y += 14) c.fillRect(o.x, y, o.w, 2);
      for (let x = o.x + 18; x < o.x + o.w - 6; x += 20) c.fillRect(x, o.y, 2, o.h);
    }
  }

  function drawEnemy(e) {
    const c = ctx;
    if (e.hidden) {
      c.globalAlpha = 0.18;
    }
    const col = e.def.color;
    const r = e.r;
    c.save();
    c.translate(e.x, e.y);
    // 影子
    c.fillStyle = 'rgba(0,0,0,.3)';
    c.beginPath(); c.ellipse(0, r * 0.7, r * 0.9, r * 0.35, 0, 0, TAU); c.fill();
    if (e.def.glow) {
      const g = c.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 2.4);
      g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
      c.globalAlpha = (e.hidden ? 0.1 : 0.35);
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, r * 2.4, 0, TAU); c.fill();
      c.globalAlpha = e.hidden ? 0.18 : 1;
    }
    c.rotate(Math.sin(e.wobble) * 0.12);
    const shape = e.def.shape;
    c.fillStyle = col;
    c.strokeStyle = 'rgba(0,0,0,.35)';
    c.lineWidth = 2;
    if (shape === 'blob' || shape === 'smallblob') {
      c.beginPath();
      const n = 9;
      for (let i = 0; i <= n; i++) {
        const a = i / n * TAU;
        const rr = r * (0.92 + Math.sin(a * 3 + e.wobble) * 0.08);
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr * 0.92;
        i ? c.lineTo(px, py) : c.moveTo(px, py);
      }
      c.closePath(); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.25)';
      c.beginPath(); c.arc(-r * 0.3, -r * 0.35, r * 0.28, 0, TAU); c.fill();
    } else if (shape === 'wisp') {
      c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
      c.fillStyle = '#fff'; c.globalAlpha *= 0.7;
      c.beginPath(); c.arc(0, 0, r * 0.45, 0, TAU); c.fill();
      c.globalAlpha = e.hidden ? 0.18 : 1;
    } else if (shape === 'beast') {
      c.beginPath();
      c.moveTo(r, 0); c.lineTo(-r * 0.7, -r * 0.8); c.lineTo(-r * 0.4, 0); c.lineTo(-r * 0.7, r * 0.8);
      c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#ffd43b';
      c.beginPath(); c.arc(r * 0.3, -r * 0.2, 2.5, 0, TAU); c.fill();
    } else if (shape === 'turret' || shape === 'sentinel' || shape === 'bot') {
      c.fillRect(-r * 0.8, -r * 0.8, r * 1.6, r * 1.6);
      c.strokeRect(-r * 0.8, -r * 0.8, r * 1.6, r * 1.6);
      c.fillStyle = '#0b0f14';
      c.beginPath(); c.arc(0, 0, r * 0.34, 0, TAU); c.fill();
      c.fillStyle = '#ff6b6b';
      c.beginPath(); c.arc(0, 0, r * 0.18, 0, TAU); c.fill();
      c.strokeStyle = col; c.lineWidth = 5;
      c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(e.ang) * r * 1.4, Math.sin(e.ang) * r * 1.4); c.stroke();
    } else if (shape === 'shield') {
      c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill(); c.stroke();
      c.strokeStyle = '#d0ebff'; c.lineWidth = 5;
      c.beginPath(); c.arc(0, 0, r + 4, e.ang - 1.1, e.ang + 1.1); c.stroke();
    } else if (shape === 'bug') {
      c.beginPath(); c.ellipse(0, 0, r, r * 0.75, 0, 0, TAU); c.fill();
      c.strokeStyle = '#0b0f14'; c.lineWidth = 2;
      for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(i * r * 0.5, -r * 0.7); c.lineTo(i * r * 0.7, -r * 1.2); c.stroke(); }
      c.fillStyle = '#ffe066'; c.beginPath(); c.arc(0, 0, r * 0.3, 0, TAU); c.fill();
    } else if (shape === 'cultist' || shape === 'summoner') {
      c.beginPath(); c.moveTo(0, -r); c.lineTo(r * 0.85, r * 0.75); c.lineTo(-r * 0.85, r * 0.75); c.closePath();
      c.fill(); c.stroke();
      c.fillStyle = '#0b0f14'; c.beginPath(); c.arc(0, -r * 0.1, r * 0.3, 0, TAU); c.fill();
      c.fillStyle = col; c.globalAlpha *= 0.5;
      c.beginPath(); c.arc(0, -r * 0.1, r * 0.16, 0, TAU); c.fill();
      c.globalAlpha = e.hidden ? 0.18 : 1;
    } else if (shape === 'drill') {
      c.beginPath(); c.moveTo(r * 1.1, 0); c.lineTo(-r * 0.6, -r * 0.8); c.lineTo(-r * 0.6, r * 0.8); c.closePath();
      c.fill(); c.stroke();
    } else if (shape === 'spirit' || shape === 'skater' || shape === 'mirror') {
      c.beginPath();
      c.moveTo(0, -r); c.lineTo(r, 0); c.lineTo(0, r); c.lineTo(-r, 0); c.closePath();
      c.fill(); c.stroke();
    } else if (shape === 'archer' || shape === 'gunner') {
      c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill(); c.stroke();
      c.strokeStyle = '#0b0f14'; c.lineWidth = 3;
      c.beginPath(); c.arc(r * 0.2, 0, r * 0.8, -0.9, 0.9); c.stroke();
    } else if (shape === 'spawner') {
      c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill(); c.stroke();
      for (let i = 0; i < 5; i++) {
        const a = i / 5 * TAU + e.wobble * 0.6;
        c.fillStyle = '#d8f5a2';
        c.beginPath(); c.arc(Math.cos(a) * r * 0.6, Math.sin(a) * r * 0.6, r * 0.22, 0, TAU); c.fill();
      }
    } else if (shape === 'flyer') {
      c.beginPath(); c.ellipse(0, 0, r * 0.6, r * 0.8, 0, 0, TAU); c.fill();
      c.globalAlpha *= 0.7;
      const flap = Math.sin(G.time * 16 + e.wobble) * 0.5;
      c.beginPath(); c.ellipse(-r * 0.8, 0, r * 0.8, r * 0.35, flap, 0, TAU); c.fill();
      c.beginPath(); c.ellipse(r * 0.8, 0, r * 0.8, r * 0.35, -flap, 0, TAU); c.fill();
      c.globalAlpha = e.hidden ? 0.18 : 1;
    } else if (shape === 'stalker') {
      c.beginPath(); c.arc(0, 0, r, 0.5, TAU - 0.5); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#ff6b6b';
      c.beginPath(); c.arc(r * 0.5, -r * 0.2, 2.5, 0, TAU); c.fill();
    } else {
      c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.2)';
      c.beginPath(); c.arc(-r * 0.3, -r * 0.3, r * 0.3, 0, TAU); c.fill();
    }
    c.restore();
    // 状态层
    const c2 = ctx;
    if (e.freezeT > 0) {
      c2.globalAlpha = 0.55; c2.fillStyle = '#a5d8ff';
      c2.beginPath(); c2.arc(e.x, e.y, r + 3, 0, TAU); c2.fill();
      c2.globalAlpha = 1;
    }
    if (e.burnT > 0) {
      c2.globalAlpha = 0.35; c2.fillStyle = '#ff922b';
      c2.beginPath(); c2.arc(e.x, e.y + Math.sin(G.time * 12) * 2, r + 2, 0, TAU); c2.fill();
      c2.globalAlpha = 1;
    }
    if (e.poisonT > 0) {
      c2.globalAlpha = 0.3; c2.fillStyle = '#a9e34b';
      c2.beginPath(); c2.arc(e.x, e.y, r + 1, 0, TAU); c2.fill();
      c2.globalAlpha = 1;
    }
    if (e.hitFlash > 0) {
      c2.globalAlpha = Math.min(1, e.hitFlash * 10) * 0.8;
      c2.fillStyle = '#fff';
      c2.beginPath(); c2.arc(e.x, e.y, r + 1, 0, TAU); c2.fill();
      c2.globalAlpha = 1;
    }
    if (e.shieldHp > 0) {
      c2.strokeStyle = '#74c0fc'; c2.globalAlpha = 0.55; c2.lineWidth = 3;
      c2.beginPath(); c2.arc(e.x, e.y, r + 7, 0, TAU); c2.stroke();
      c2.globalAlpha = 1;
    }
    if (e.markT > 0) {
      c2.strokeStyle = '#f783ac'; c2.lineWidth = 2;
      c2.beginPath(); c2.arc(e.x, e.y, r + 9, 0, TAU); c2.stroke();
      c2.beginPath();
      c2.moveTo(e.x - r - 13, e.y); c2.lineTo(e.x - r - 5, e.y);
      c2.moveTo(e.x + r + 5, e.y); c2.lineTo(e.x + r + 13, e.y);
      c2.stroke();
    }
    if (e.elite) {
      c2.strokeStyle = '#ffd43b'; c2.globalAlpha = 0.75; c2.lineWidth = 2;
      c2.beginPath(); c2.arc(e.x, e.y, r + 6, 0, TAU); c2.stroke();
      c2.globalAlpha = 1;
    }
    if (e.hp < e.maxHp) {
      const w = Math.max(22, r * 2);
      c2.fillStyle = 'rgba(0,0,0,.55)';
      c2.fillRect(e.x - w / 2, e.y - r - 12, w, 4);
      c2.fillStyle = e.elite ? '#ffd43b' : '#ff6b6b';
      c2.fillRect(e.x - w / 2, e.y - r - 12, w * clamp(e.hp / e.maxHp, 0, 1), 4);
    }
    if (e.state === 'wind' || (e.def.ai === 'charger' && e.state === 'wind')) {
      c2.strokeStyle = '#ff6b6b'; c2.globalAlpha = 0.7 + Math.sin(G.time * 20) * 0.3;
      c2.lineWidth = 2;
      c2.beginPath(); c2.arc(e.x, e.y, r + 12, 0, TAU); c2.stroke();
      c2.globalAlpha = 1;
    }
  }

  function drawBoss(b) {
    const c = ctx;
    const r = b.r;
    c.save();
    c.translate(b.x, b.y);
    c.fillStyle = 'rgba(0,0,0,.4)';
    c.beginPath(); c.ellipse(0, r * 0.7, r * 0.95, r * 0.4, 0, 0, TAU); c.fill();
    const glow = c.createRadialGradient(0, 0, r * 0.6, 0, 0, r * 2.6);
    glow.addColorStop(0, b.def.color); glow.addColorStop(1, 'rgba(0,0,0,0)');
    c.globalAlpha = 0.3; c.fillStyle = glow;
    c.beginPath(); c.arc(0, 0, r * 2.6, 0, TAU); c.fill();
    c.globalAlpha = 1;
    const shape = b.def.shape;
    c.fillStyle = b.def.color;
    c.strokeStyle = 'rgba(0,0,0,.45)';
    c.lineWidth = 4;
    if (shape === 'gear') {
      const teeth = 12;
      c.beginPath();
      for (let i = 0; i < teeth * 2; i++) {
        const a = i / (teeth * 2) * TAU + b.t * 0.4;
        const rr = i % 2 ? r : r * 0.82;
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        i ? c.lineTo(px, py) : c.moveTo(px, py);
      }
      c.closePath(); c.fill(); c.stroke();
      c.fillStyle = b.def.accent;
      c.beginPath(); c.arc(0, 0, r * 0.4, 0, TAU); c.fill();
      c.fillStyle = '#0b0f14';
      c.beginPath(); c.arc(0, 0, r * 0.22, 0, TAU); c.fill();
    } else if (shape === 'shard') {
      c.beginPath();
      for (let i = 0; i < 7; i++) {
        const a = i / 7 * TAU + Math.sin(b.t) * 0.2;
        const rr = i % 2 ? r : r * 0.6;
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
        i ? c.lineTo(px, py) : c.moveTo(px, py);
      }
      c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#e5dbff';
      c.beginPath(); c.arc(0, 0, r * 0.35, 0, TAU); c.fill();
    } else if (shape === 'flower') {
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * TAU + b.t * 0.5;
        c.fillStyle = i % 2 ? b.def.color : b.def.accent;
        c.beginPath(); c.ellipse(Math.cos(a) * r * 0.6, Math.sin(a) * r * 0.6, r * 0.5, r * 0.3, a, 0, TAU); c.fill();
      }
      c.fillStyle = '#0b0f14';
      c.beginPath(); c.arc(0, 0, r * 0.5, 0, TAU); c.fill();
      c.fillStyle = '#ffd43b';
      c.beginPath(); c.arc(0, 0, r * 0.26, 0, TAU); c.fill();
    } else if (shape === 'eye') {
      c.beginPath(); c.ellipse(0, 0, r * 1.1, r * 0.85, 0, 0, TAU); c.fill(); c.stroke();
      c.fillStyle = '#0b0f14';
      c.beginPath(); c.ellipse(Math.cos(b.ang) * r * 0.3, Math.sin(b.ang) * r * 0.3, r * 0.45, r * 0.45, 0, 0, TAU); c.fill();
      c.fillStyle = b.def.accent;
      c.beginPath(); c.arc(Math.cos(b.ang) * r * 0.35, Math.sin(b.ang) * r * 0.35, r * 0.2, 0, TAU); c.fill();
    } else if (shape === 'blob') {
      c.beginPath();
      for (let i = 0; i <= 14; i++) {
        const a = i / 14 * TAU;
        const rr = r * (0.92 + Math.sin(a * 4 + b.t * 2) * 0.09);
        const px = Math.cos(a) * rr, py = Math.sin(a) * rr * 0.95;
        i ? c.lineTo(px, py) : c.moveTo(px, py);
      }
      c.closePath(); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.25)';
      c.beginPath(); c.arc(-r * 0.3, -r * 0.35, r * 0.25, 0, TAU); c.fill();
      c.fillStyle = '#0b0f14';
      c.beginPath(); c.arc(-r * 0.25, -r * 0.05, r * 0.13, 0, TAU); c.fill();
      c.beginPath(); c.arc(r * 0.25, -r * 0.05, r * 0.13, 0, TAU); c.fill();
    } else {
      c.beginPath();
      c.moveTo(r * 1.15, 0); c.lineTo(0, -r); c.lineTo(-r * 1.15, 0); c.lineTo(0, r);
      c.closePath(); c.fill(); c.stroke();
      c.fillStyle = b.def.accent;
      c.beginPath(); c.arc(0, 0, r * 0.4, 0, TAU); c.fill();
    }
    c.restore();
    if (b.tele > 0) {
      c.strokeStyle = '#ff6b6b';
      c.globalAlpha = 0.5 + Math.sin(G.time * 22) * 0.35;
      c.lineWidth = 3;
      c.beginPath(); c.arc(b.x, b.y, r + 14, 0, TAU); c.stroke();
      c.globalAlpha = 1;
    }
    if (b.hitFlash > 0) {
      c.globalAlpha = Math.min(1, b.hitFlash * 10) * 0.7;
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(b.x, b.y, r + 2, 0, TAU); c.fill();
      c.globalAlpha = 1;
    }
    if (b.shieldHp > 0) {
      c.strokeStyle = '#74c0fc'; c.globalAlpha = 0.6; c.lineWidth = 5;
      c.beginPath(); c.arc(b.x, b.y, r + 12, 0, TAU); c.stroke();
      c.globalAlpha = 1;
    }
    for (const bm of b.beams) {
      c.save();
      c.translate(b.x, b.y); c.rotate(bm.ang);
      const g2 = c.createLinearGradient(0, 0, bm.len, 0);
      g2.addColorStop(0, bm.color || '#ffd43b');
      g2.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = g2;
      c.globalAlpha = 0.85;
      c.fillRect(0, -bm.w / 2, bm.len, bm.w);
      c.fillStyle = '#fff'; c.globalAlpha = 0.9;
      c.fillRect(0, -bm.w / 6, bm.len, bm.w / 3);
      c.globalAlpha = 1;
      c.restore();
    }
  }

  function drawPlayer(run) {
    const c = ctx, p = run.player, ch = run.char;
    const w = curWeapon();
    c.save();
    c.translate(p.x, p.y);
    c.fillStyle = 'rgba(0,0,0,.35)';
    c.beginPath(); c.ellipse(0, 8, 15, 6, 0, 0, TAU); c.fill();
    // 护盾
    if (run.shield > 0) {
      c.strokeStyle = '#74c0fc'; c.globalAlpha = 0.55 + Math.sin(G.time * 5) * 0.15;
      c.lineWidth = 3;
      c.beginPath(); c.arc(0, 0, 22, 0, TAU); c.stroke();
      c.globalAlpha = 1;
    }
    // 武器
    c.save();
    c.rotate(p.ang);
    if (w) {
      c.fillStyle = w.color;
      if (w.fam === 'melee') c.fillRect(8, -3, 26, 6);
      else if (w.fam === 'laser' || w.fam === 'rail') c.fillRect(8, -2.5, 22, 5);
      else c.fillRect(8, -2.5, 16, 5);
      c.fillStyle = 'rgba(0,0,0,.45)';
      c.fillRect(8, 2, 8, 3);
    }
    c.restore();
    const blink = run.invuln > 0 && Math.floor(G.time * 22) % 2 === 0;
    c.globalAlpha = blink ? 0.4 : (run.stealth > 0 ? 0.5 : 1);
    const g = c.createRadialGradient(-4, -5, 2, 0, 0, 16);
    g.addColorStop(0, ch.accent);
    g.addColorStop(1, ch.color);
    c.fillStyle = g;
    c.beginPath(); c.arc(0, 0, PLAYER_R, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.65)';
    c.lineWidth = 2; c.stroke();
    // 面向
    c.fillStyle = '#0b0f14';
    c.beginPath(); c.arc(Math.cos(p.ang) * 6, Math.sin(p.ang) * 6, 4.2, 0, TAU); c.fill();
    c.globalAlpha = 1;
    c.restore();
    // 充能指示
    if (run.charging && w && w.fam === 'charge') {
      const f = clamp(run.charge / w.chargeTime, 0, 1);
      c.strokeStyle = '#ffd43b'; c.lineWidth = 3;
      c.beginPath(); c.arc(p.x, p.y, 24, -Math.PI / 2, -Math.PI / 2 + TAU * f); c.stroke();
    }
  }

  function drawTurrets(run) {
    const c = ctx;
    for (const t of run.turrets) {
      c.save(); c.translate(t.x, t.y);
      const a = clamp(t.t / (t.maxT || 10), 0, 1);
      c.globalAlpha = 0.25 + a * 0.75;
      if (t.kind === 'saw') {
        c.rotate(t.spin || 0);
        c.fillStyle = t.color;
        for (let i = 0; i < 6; i++) {
          c.rotate(TAU / 6);
          c.beginPath(); c.moveTo(8, 0); c.lineTo(24, -7); c.lineTo(24, 7); c.closePath(); c.fill();
        }
        c.beginPath(); c.arc(0, 0, 10, 0, TAU); c.fill();
      } else if (t.kind === 'field') {
        c.strokeStyle = t.color; c.lineWidth = 3;
        c.beginPath(); c.arc(0, 0, 130, 0, TAU); c.stroke();
        c.globalAlpha = 0.12; c.fillStyle = t.color;
        c.beginPath(); c.arc(0, 0, 130, 0, TAU); c.fill();
      } else if (t.kind === 'worm') {
        c.fillStyle = t.color;
        c.beginPath(); c.arc(0, 0, 12, 0, TAU); c.fill();
        c.fillStyle = '#0b0f14';
        c.beginPath(); c.arc(Math.cos(t.ang) * 6, Math.sin(t.ang) * 6, 4, 0, TAU); c.fill();
      } else {
        c.rotate(t.ang || 0);
        c.fillStyle = t.color;
        c.fillRect(-12, -12, 24, 24);
        c.fillStyle = '#0b0f14';
        c.fillRect(0, -4, 22, 8);
        c.fillStyle = t.color;
        c.beginPath(); c.arc(0, 0, 8, 0, TAU); c.fill();
      }
      c.globalAlpha = 1;
      c.restore();
    }
  }

  function drawBullets(run) {
    const c = ctx;
    for (const b of run.bullets) {
      if (b.mine) {
        c.save(); c.translate(b.x, b.y);
        const armed = (b.arm || 0) <= 0;
        c.fillStyle = armed ? '#ffd43b' : '#868e96';
        c.beginPath(); c.arc(0, 0, 9, 0, TAU); c.fill();
        c.strokeStyle = '#0b0f14'; c.lineWidth = 2;
        c.beginPath(); c.arc(0, 0, 5, 0, TAU); c.stroke();
        if (armed) {
          c.globalAlpha = 0.3 + Math.sin(G.time * 12) * 0.2;
          c.fillStyle = '#ffd43b';
          c.beginPath(); c.arc(0, 0, 20, 0, TAU); c.fill();
          c.globalAlpha = 1;
        }
        c.restore();
        continue;
      }
      c.save();
      c.translate(b.x, b.y);
      if (b.trail) {
        c.strokeStyle = b.color;
        c.globalAlpha = 0.35; c.lineWidth = b.r;
        c.beginPath(); c.moveTo(0, 0);
        c.lineTo(-b.vx * 0.016, -b.vy * 0.016);
        c.stroke();
        c.globalAlpha = 1;
      }
      c.fillStyle = b.color;
      c.globalAlpha = 0.28;
      c.beginPath(); c.arc(0, 0, b.r * 2.4, 0, TAU); c.fill();
      c.globalAlpha = 1;
      c.beginPath(); c.arc(0, 0, b.r, 0, TAU); c.fill();
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(0, 0, b.r * 0.45, 0, TAU); c.fill();
      c.restore();
    }
    // 激光
    if (run.beam) {
      const bm = run.beam;
      c.save(); c.translate(bm.x, bm.y); c.rotate(bm.ang);
      const g = c.createLinearGradient(0, 0, bm.len, 0);
      g.addColorStop(0, bm.color);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = g; c.globalAlpha = 0.75;
      c.fillRect(0, -5, bm.len, 10);
      c.fillStyle = '#fff'; c.globalAlpha = 0.9;
      c.fillRect(0, -1.8, bm.len, 3.6);
      c.globalAlpha = 1;
      c.restore();
    }
    // 火焰锥
    if (run.flame) {
      const f = run.flame;
      c.save(); c.translate(f.x, f.y);
      const g = c.createRadialGradient(0, 0, 6, 0, 0, f.range);
      g.addColorStop(0, 'rgba(255,212,59,.75)');
      g.addColorStop(0.55, 'rgba(255,146,43,.42)');
      g.addColorStop(1, 'rgba(255,107,107,0)');
      c.fillStyle = g;
      c.beginPath(); c.moveTo(0, 0);
      c.arc(0, 0, f.range, f.ang - 0.5, f.ang + 0.5);
      c.closePath(); c.fill();
      c.restore();
    }
  }

  function drawEBullets(run) {
    const c = ctx;
    for (const b of run.ebullets) {
      c.save(); c.translate(b.x, b.y);
      c.fillStyle = b.color;
      c.globalAlpha = 0.25;
      c.beginPath(); c.arc(0, 0, b.r * 2.2, 0, TAU); c.fill();
      c.globalAlpha = 1;
      c.beginPath(); c.arc(0, 0, b.r, 0, TAU); c.fill();
      c.fillStyle = '#fff';
      c.globalAlpha = 0.8;
      c.beginPath(); c.arc(0, 0, b.r * 0.4, 0, TAU); c.fill();
      c.globalAlpha = 1;
      c.restore();
    }
  }

  function drawHazards(run) {
    const c = ctx;
    for (const h of run.hazards) {
      c.save(); c.translate(h.x, h.y);
      if (h.kind === 'cloud') {
        c.fillStyle = h.color;
        c.globalAlpha = 0.16;
        c.beginPath(); c.arc(0, 0, h.r, 0, TAU); c.fill();
        c.globalAlpha = 0.4;
        c.strokeStyle = h.color; c.lineWidth = 2;
        c.beginPath(); c.arc(0, 0, h.r, 0, TAU); c.stroke();
      } else if (h.kind === 'slow') {
        c.fillStyle = h.color; c.globalAlpha = 0.14;
        c.beginPath(); c.arc(0, 0, h.r, 0, TAU); c.fill();
        c.globalAlpha = 0.35;
        c.strokeStyle = h.color; c.lineWidth = 2;
        c.beginPath(); c.arc(0, 0, h.r, 0, TAU); c.stroke();
      } else if (h.kind === 'delayBoom') {
        c.fillStyle = h.color; c.globalAlpha = 0.2;
        c.beginPath(); c.arc(0, 0, h.r, 0, TAU); c.fill();
        c.globalAlpha = 0.8;
        c.strokeStyle = h.color; c.lineWidth = 3;
        c.beginPath(); c.arc(0, 0, h.r * (1 - clamp(h.t / 0.7, 0, 1)), 0, TAU); c.stroke();
      } else if (h.kind === 'heal') {
        c.fillStyle = '#69db7c'; c.globalAlpha = 0.15;
        c.beginPath(); c.arc(0, 0, h.r, 0, TAU); c.fill();
        c.globalAlpha = 0.6;
        c.strokeStyle = '#69db7c'; c.lineWidth = 2;
        c.beginPath(); c.arc(0, 0, h.r, 0, TAU); c.stroke();
      } else if (h.kind === 'sing') {
        c.fillStyle = '#b197fc'; c.globalAlpha = 0.12;
        c.beginPath(); c.arc(0, 0, h.r, 0, TAU); c.fill();
        c.globalAlpha = 0.5;
        c.strokeStyle = '#b197fc'; c.lineWidth = 2;
        for (let k = 0; k < 3; k++) {
          c.beginPath(); c.arc(0, 0, h.r * (0.3 + k * 0.3), 0, TAU); c.stroke();
        }
      } else if (h.kind === 'orb') {
        c.fillStyle = h.color; c.globalAlpha = 0.3;
        c.beginPath(); c.arc(0, 0, h.r * 2, 0, TAU); c.fill();
        c.globalAlpha = 1;
        c.beginPath(); c.arc(0, 0, h.r, 0, TAU); c.fill();
      }
      c.globalAlpha = 1;
      c.restore();
    }
  }

  function drawPickups(run) {
    const c = ctx;
    for (const it of run.pickups) {
      c.save(); c.translate(it.x, it.y);
      const bob = Math.sin(G.time * 5 + it.t * 6) * 3;
      c.translate(0, bob);
      if (it.type === 'gold') {
        c.fillStyle = '#ffd43b';
        c.beginPath(); c.arc(0, 0, 7, 0, TAU); c.fill();
        c.strokeStyle = '#b8860b'; c.lineWidth = 1.6;
        c.beginPath(); c.arc(0, 0, 7, 0, TAU); c.stroke();
        c.fillStyle = '#fff3bf';
        c.beginPath(); c.arc(-2, -2, 2.4, 0, TAU); c.fill();
      } else if (it.type === 'hp') {
        c.fillStyle = '#69db7c';
        c.fillRect(-6, -2, 12, 4); c.fillRect(-2, -6, 4, 12);
      } else if (it.type === 'energy') {
        c.fillStyle = '#74c0fc';
        c.beginPath(); c.moveTo(0, -8); c.lineTo(7, 0); c.lineTo(0, 8); c.lineTo(-7, 0); c.closePath(); c.fill();
      } else if (it.type === 'shard') {
        c.fillStyle = '#ffe066';
        c.beginPath();
        for (let i = 0; i < 10; i++) {
          const a = i / 10 * TAU - Math.PI / 2;
          const rr = i % 2 ? 4 : 11;
          const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
          i ? c.lineTo(px, py) : c.moveTo(px, py);
        }
        c.closePath(); c.fill();
        c.globalAlpha = 0.3; c.fillStyle = '#ffe066';
        c.beginPath(); c.arc(0, 0, 18, 0, TAU); c.fill();
        c.globalAlpha = 1;
      } else {
        c.fillStyle = '#b197fc';
        c.beginPath(); c.moveTo(0, -10); c.lineTo(9, 0); c.lineTo(0, 10); c.lineTo(-9, 0); c.closePath(); c.fill();
        c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.stroke();
        c.globalAlpha = 0.28; c.fillStyle = '#b197fc';
        c.beginPath(); c.arc(0, 0, 17, 0, TAU); c.fill();
        c.globalAlpha = 1;
      }
      c.restore();
    }
  }

  function drawInteractables(run) {
    const c = ctx;
    if (run.chest) {
      c.save(); c.translate(run.chest.x, run.chest.y);
      c.fillStyle = '#8b5a2b';
      c.fillRect(-26, -6, 52, 32);
      c.fillStyle = '#c9974a';
      c.fillRect(-26, -22, 52, 20);
      c.fillStyle = '#ffd43b';
      c.fillRect(-5, -8, 10, 12);
      if (!run.chest.open) {
        c.globalAlpha = 0.35 + Math.sin(G.time * 3) * 0.2;
        c.strokeStyle = '#ffd43b'; c.lineWidth = 2;
        c.beginPath(); c.arc(0, 0, 42, 0, TAU); c.stroke();
        c.globalAlpha = 1;
      }
      c.restore();
    }
    if (run.eventData) {
      c.save(); c.translate(run.eventData.x, run.eventData.y);
      const ev = EVENTS.find((e) => e.id === run.eventData.id);
      c.fillStyle = 'rgba(0,0,0,.3)';
      c.beginPath(); c.ellipse(0, 30, 34, 12, 0, 0, TAU); c.fill();
      c.fillStyle = '#2b2b33';
      c.fillRect(-24, -20, 48, 50);
      c.fillStyle = ev ? ev.color : '#b197fc';
      c.globalAlpha = 0.85;
      c.beginPath(); c.arc(0, -24, 13, 0, TAU); c.fill();
      c.globalAlpha = 1;
      if (!run.eventData.used) {
        c.globalAlpha = 0.3 + Math.sin(G.time * 2.5) * 0.18;
        c.strokeStyle = ev ? ev.color : '#b197fc'; c.lineWidth = 2;
        c.beginPath(); c.arc(0, -4, 48, 0, TAU); c.stroke();
        c.globalAlpha = 1;
      }
      c.restore();
    }
    if (run.shopItems) {
      for (const s of run.shopItems) {
        c.save(); c.translate(s.x, s.y);
        // 石台（像素块）
        c.fillStyle = 'rgba(0,0,0,.3)';
        c.fillRect(-26, 26, 52, 6);
        c.fillStyle = '#0a0c11';
        c.fillRect(-25, 4, 50, 26);
        c.fillStyle = '#3d4453';
        c.fillRect(-23, 6, 46, 22);
        c.fillStyle = '#5a6376';
        c.fillRect(-23, 6, 46, 4);
        c.fillStyle = '#2b3040';
        c.fillRect(-23, 22, 46, 4);
        c.fillStyle = '#0a0c11';
        c.fillRect(-29, 26, 58, 6);
        c.fillStyle = '#4a5266';
        c.fillRect(-28, 27, 56, 3);
        const bob = Math.round(Math.sin(G.time * 3 + s.x) * 2);
        c.translate(0, bob);
        if (s.kind === 'weapon') {
          const w = WEAPONS[s.id];
          c.fillStyle = '#0a0c11';
          c.fillRect(-18, -10, 36, 10);
          c.fillStyle = w ? w.color : '#ffd43b';
          c.fillRect(-16, -8, 32, 5);
          c.fillStyle = '#0a0c11';
          c.fillRect(-10, -3, 8, 12);
          c.fillStyle = '#8a6b3d';
          c.fillRect(-8, -2, 4, 9);
          c.fillStyle = 'rgba(255,255,255,.6)';
          c.fillRect(-15, -7, 12, 1);
        } else if (s.kind === 'relic') {
          c.fillStyle = '#0a0c11';
          c.beginPath(); c.moveTo(0, -16); c.lineTo(14, 0); c.lineTo(0, 16); c.lineTo(-14, 0); c.closePath(); c.fill();
          c.fillStyle = '#b197fc';
          c.beginPath(); c.moveTo(0, -13); c.lineTo(11, 0); c.lineTo(0, 13); c.lineTo(-11, 0); c.closePath(); c.fill();
          c.fillStyle = '#e5dbff';
          c.fillRect(-3, -7, 3, 3);
        } else {
          c.fillStyle = '#0a0c11';
          c.fillRect(-13, -6, 26, 12); c.fillRect(-6, -13, 12, 26);
          c.fillStyle = '#69db7c';
          c.fillRect(-11, -4, 22, 8); c.fillRect(-4, -11, 8, 22);
          c.fillStyle = '#b2f2bb';
          c.fillRect(-3, -9, 2, 16); c.fillRect(-9, -3, 16, 2);
        }
        c.restore();
      }
    }
    if (run.portal) {
