      const pt = run.portal;
      c.save(); c.translate(pt.x, pt.y);
      for (let i = 0; i < 3; i++) {
        const a = G.time * (1.2 + i * 0.4) + i * 2;
        c.strokeStyle = pt.kind === 'echo' ? '#ffe066' : (pt.kind === 'end' ? '#f783ac' : '#74c0fc');
        c.globalAlpha = 0.7 - i * 0.15;
        c.lineWidth = 4 - i;
        c.beginPath();
        c.ellipse(0, 0, 40 - i * 8, 60 - i * 10, a, 0, TAU * 0.8);
        c.stroke();
      }
      c.globalAlpha = 0.3;
      c.fillStyle = pt.kind === 'echo' ? '#ffe066' : '#74c0fc';
      c.beginPath(); c.ellipse(0, 0, 34, 52, 0, 0, TAU); c.fill();
      c.globalAlpha = 1;
      c.restore();
    }
  }

  function drawEffects(run) {
    const c = ctx;
    for (const e of run.effects) {
      const k = 1 - clamp(e.t / e.life, 0, 1);
      c.save();
      if (e.type === 'nova' || e.type === 'ring') {
        c.globalAlpha = (1 - k) * 0.85;
        c.strokeStyle = e.color; c.lineWidth = 4 + (1 - k) * 8;
        c.beginPath(); c.arc(e.x, e.y, e.max * k, 0, TAU); c.stroke();
        if (e.type === 'nova') {
          c.globalAlpha = (1 - k) * 0.2;
          c.fillStyle = e.color;
          c.beginPath(); c.arc(e.x, e.y, e.max * k, 0, TAU); c.fill();
        }
      } else if (e.type === 'zap') {
        c.globalAlpha = (1 - k) * 0.9;
        c.strokeStyle = e.color; c.lineWidth = 4;
        c.beginPath(); c.moveTo(e.x, e.y); c.lineTo(e.x2, e.y2); c.stroke();
        c.strokeStyle = '#fff'; c.lineWidth = 1.5; c.stroke();
      } else if (e.type === 'swing') {
        c.globalAlpha = (1 - k) * 0.7;
        c.strokeStyle = e.color; c.lineWidth = 8;
        c.beginPath(); c.arc(e.x, e.y, e.range, e.ang - e.arc / 2, e.ang + e.arc / 2); c.stroke();
      } else if (e.type === 'arc') {
        c.globalAlpha = (1 - k) * 0.8;
        c.strokeStyle = e.color; c.lineWidth = 5 + k * 4;
        for (let i = 0; i < 3; i++) {
          const a0 = e.ang + i * (TAU / 3);
          c.beginPath(); c.arc(e.x, e.y, e.r, a0, a0 + 0.9); c.stroke();
        }
      } else if (e.type === 'muzzle') {
        c.globalAlpha = (1 - k) * 0.9;
        c.fillStyle = e.color;
        c.beginPath(); c.arc(e.x, e.y, 4 + k * 10, 0, TAU); c.fill();
      }
      c.globalAlpha = 1;
      c.restore();
    }
  }

  function drawTexts(run) {
    const c = ctx;
    c.textAlign = 'center';
    for (const t of run.texts) {
      const a = clamp(t.t / 0.62, 0, 1);
      c.globalAlpha = a;
      c.font = font(t.size, 800);
      c.lineWidth = 3;
      c.strokeStyle = 'rgba(0,0,0,.65)';
      c.strokeText(t.text, t.x, t.y);
      c.fillStyle = t.color;
      c.fillText(t.text, t.x, t.y);
    }
    c.globalAlpha = 1;
    c.textAlign = 'left';
  }

  function drawParticles(run) {
    const c = ctx;
    for (const p of run.particles) {
      c.globalAlpha = clamp(p.life / 0.5, 0, 1);
      c.fillStyle = p.color;
      c.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);

  // ---------------------------------------------------------------------
  //  像素渲染层：世界先画到低分辨率画布，再以 nearest 整数放大
  // ---------------------------------------------------------------------
  const PX = { cv: document.createElement('canvas'), c: null, w: 480, h: 270, K: 1, ox: 0, oy: 0 };

  function hexShade(hex, amt) {
    let h = (hex || '#888888').replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    const n = parseInt(h, 16) || 0x888888;
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const f = (v) => Math.max(0, Math.min(255, Math.round(v + 255 * amt)));
    r = f(r); g = f(g); b = f(b);
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  }

  function pxDisc(c, cx, cy, r, col) {
    c.fillStyle = col;
    for (let dy = -r; dy <= r; dy++) {
      const w = Math.floor(Math.sqrt(Math.max(0, r * r - dy * dy)));
      if (w > 0) c.fillRect(cx - w, cy + dy, w * 2, 1);
    }
  }

  function drawPxFloor(c, room, cfg, K, ox, oy) {
    const T = Math.max(8, Math.round(64 * K));
    const cols = Math.ceil(ROOM_W / 64), rows = Math.ceil(ROOM_H / 64);
    const base = hexShade(cfg.tile, 0.075), alt = hexShade(cfg.tile, 0.125), seam = hexShade(cfg.tile, -0.16);
    const half = Math.max(4, Math.round(T / 2));
    for (let ty = 0; ty < rows; ty++) {
      for (let tx = 0; tx < cols; tx++) {
        const hsh = ((tx * 73856093) ^ (ty * 19349663)) >>> 0;
        const x = Math.round(tx * 64 * K + ox), y = Math.round(ty * 64 * K + oy);
        c.fillStyle = seam;
        c.fillRect(x, y, T, T);
        // 两行错缝砖
        for (let r = 0; r < 2; r++) {
          const by = y + r * half;
          const off = r === 0 ? 0 : -Math.round(half / 2);
          for (let bx = off; bx < T; bx += half) {
            const w = Math.min(half - 1, T - bx - (bx < 0 ? 0 : 0));
            const px0 = x + Math.max(0, bx);
            const w0 = Math.min(half - 1, x + T - px0);
            if (w0 <= 0) continue;
            const h2 = ((hsh >> (r * 3)) ^ (bx * 7)) & 3;
            c.fillStyle = h2 === 0 ? alt : base;
            c.fillRect(px0, by, w0, Math.min(half - 1, y + T - by));
          }
        }
        // 少量裂纹/苔痕
        const m = (hsh >> 5) % 13;
        if (m === 0) {
          c.fillStyle = seam;
          c.fillRect(x + 3, y + 4, 1, 3);
          c.fillRect(x + 4, y + 7, 1, 2);
        } else if (m === 1) {
          c.fillStyle = hexShade(cfg.accent, -0.15);
          c.globalAlpha = 0.18;
          c.fillRect(x + Math.floor(T * 0.3), y + Math.floor(T * 0.35), Math.floor(T * 0.35), Math.floor(T * 0.3));
          c.globalAlpha = 1;
        }
      }
    }
  }

  function drawPxWalls(c, room, cfg, K, ox, oy) {
    const t = Math.round(WALL * K);
    const rx = Math.round(ox), ry = Math.round(oy);
    const rw = Math.round(ROOM_W * K), rh = Math.round(ROOM_H * K);
    const wallCol = cfg.wall;
    const seam = hexShade(wallCol, -0.20);
    const hi = hexShade(cfg.wallHi, 0.10);
    // 墙体
    c.fillStyle = wallCol;
    c.fillRect(rx, ry, rw, t);
    c.fillRect(rx, ry + rh - t, rw, t);
    c.fillRect(rx, ry, t, rh);
    c.fillRect(rx + rw - t, ry, t, rh);
    // 错缝砖（横向两道）
    c.fillStyle = seam;
    for (const oy2 of [ry, ry + rh - t]) {
      c.fillRect(rx, oy2 + Math.round(t / 2), rw, 1);
      for (let i = 0; i < 2; i++) {
        const off = i === 0 ? 0 : Math.round(t / 2);
        for (let x = rx - off; x < rx + rw; x += t) c.fillRect(x, oy2 + i * Math.round(t / 2), 1, Math.round(t / 2));
      }
    }
    for (const ox2 of [rx, rx + rw - t]) {
      c.fillRect(ox2 + Math.round(t / 2), ry, 1, rh);
      for (let y = ry; y < ry + rh; y += Math.round(t / 2)) c.fillRect(ox2, y, t, 1);
    }
    // 顶部受光边 + 内缘描边
    c.fillStyle = hi;
    c.fillRect(rx, ry, rw, 2);
    c.fillRect(rx, ry, 2, rh);
    c.fillStyle = hexShade(wallCol, -0.35);
    c.fillRect(rx, ry + t - 1, rw, 1);
    c.fillRect(rx + rw - 1, ry, 1, rh);
    c.fillRect(rx, ry + rh - 1, rw, 1);
    // 墙脚投影
    c.fillStyle = 'rgba(0,0,0,.30)';
    c.fillRect(rx + t, ry + t, rw - t * 2, 3);
    c.fillRect(rx + t, ry + t, 3, rh - t * 2);
    c.fillRect(rx + rw - t - 3, ry + t, 3, rh - t * 2);
    c.fillStyle = 'rgba(0,0,0,.16)';
    c.fillRect(rx + t, ry + rh - t - 6, rw - t * 2, 6);
    // 门
    const gap = Math.round(DOOR_GAP * K);
    const sides = [
      ['N', Math.round((640 - DOOR_GAP / 2) * K + ox), ry, gap, t],
      ['S', Math.round((640 - DOOR_GAP / 2) * K + ox), ry + rh - t, gap, t],
      ['W', rx, Math.round((360 - DOOR_GAP / 2) * K + oy), t, gap],
      ['E', rx + rw - t, Math.round((360 - DOOR_GAP / 2) * K + oy), t, gap]
    ];
    for (const [side, x, y, w, h] of sides) {
      if (!room.doors[side]) continue;
      const vert = h > w;
      c.fillStyle = '#05060a';
      c.fillRect(x, y, w, h);
      if (room.cleared) {
        const pulse = 0.35 + 0.3 * Math.sin(G.time * 3);
        c.fillStyle = cfg.accent;
        c.globalAlpha = 0.10 + pulse * 0.10;
        c.fillRect(x, y, w, h);
        c.globalAlpha = 0.9;
        if (vert) {
          c.fillRect(x + 1, y + 1, 2, h - 2);
          c.fillRect(x + w - 3, y + 1, 2, h - 2);
        } else {
          c.fillRect(x + 1, y + 1, w - 2, 2);
          c.fillRect(x + 1, y + h - 3, w - 2, 2);
        }
        c.globalAlpha = 1;
      } else {
        c.fillStyle = hexShade(cfg.wallHi, -0.22);
        const n = 4;
        for (let i = 0; i < n; i++) {
          if (vert) c.fillRect(x + 2, y + 3 + i * ((h - 6) / n), w - 4, Math.max(1, (h - 6) / n - 2));
          else c.fillRect(x + 3 + i * ((w - 6) / n), y + 2, Math.max(1, (w - 6) / n - 2), h - 4);
        }
      }
    }
  }

  function drawPxEnemy(c, e, K, ox, oy) {
    const R = Math.max(4, Math.round(e.r * K * 1.30));
    const X = Math.round(e.x * K + ox), Y = Math.round(e.y * K + oy);
    const base = e.def.color || '#8b5cf6';
    const dark = hexShade(base, -0.42);
    const light = hexShade(base, 0.22);
    c.globalAlpha = e.hidden ? 0.28 : 1;
    c.fillStyle = 'rgba(0,0,0,.38)';
    c.fillRect(X - R, Y + R - 1, R * 2, Math.max(1, Math.round(R * 0.4)));
    const shape = e.def.shape || 'blob';
    if (shape === 'wisp') {
      pxDisc(c, X, Y, R + 1, hexShade(base, -0.6));
      pxDisc(c, X, Y, R, base);
      pxDisc(c, X - 1, Y - 1, Math.max(1, R - 2), light);
      c.fillStyle = '#ffffff';
      c.fillRect(X - 1, Y - 1, 1, 1);
    } else if (shape === 'beast') {
      c.fillStyle = dark;
      c.fillRect(X - R - 1, Y - R, R * 2 + 2, R * 2);
      c.fillStyle = base;
      c.fillRect(X - R, Y - R + 1, R * 2, R * 2 - 2);
      // 尖角
      c.fillStyle = light;
      c.fillRect(X - R + 1, Y - R - 2, 2, 2);
      c.fillRect(X + R - 3, Y - R - 2, 2, 2);
      c.fillStyle = '#ffd43b';
      c.fillRect(X + 1, Y - 2, 2, 2);
    } else if (shape === 'square' || shape === 'armor') {
      c.fillStyle = dark;
      c.fillRect(X - R, Y - R, R * 2 + 1, R * 2 + 1);
      c.fillStyle = base;
      c.fillRect(X - R + 1, Y - R + 1, R * 2 - 1, R * 2 - 1);
      c.fillStyle = light;
      c.fillRect(X - R + 2, Y - R + 2, R * 2 - 3, 2);
      c.fillStyle = '#0b0f14';
      c.fillRect(X - 2, Y - 1, 2, 2);
      c.fillRect(X + 2, Y - 1, 2, 2);
    } else {
      pxDisc(c, X, Y, R + 1, dark);
      pxDisc(c, X, Y, R, base);
      c.fillStyle = hexShade(base, -0.26);
      c.fillRect(X - Math.round(R * 0.8), Y + Math.round(R * 0.5), Math.round(R * 1.6), Math.max(1, Math.round(R * 0.32)));
      c.fillStyle = light;
      c.fillRect(X - Math.max(1, R - 2), Y - Math.max(1, R - 2), Math.max(1, Math.round(R * 0.9)), 2);
      c.fillStyle = '#0b0f14';
      c.fillRect(X - Math.max(2, Math.round(R * 0.45)), Y - 1, 2, 2);
      c.fillRect(X + Math.max(1, Math.round(R * 0.25)), Y - 1, 2, 2);
      c.fillStyle = '#ffffff';
      c.fillRect(X - Math.max(2, Math.round(R * 0.45)), Y - 1, 1, 1);
      c.fillRect(X + Math.max(1, Math.round(R * 0.25)), Y - 1, 1, 1);
    }
    c.globalAlpha = 1;
    // 精英标记
    if (e.affix) {
      c.fillStyle = '#ffd43b';
      c.fillRect(X - 1, Y - R - 3, 2, 2);
    }
    // 血条
    if (e.maxHp && e.hp < e.maxHp) {
      const bw = Math.max(6, R * 2 + 2);
      c.fillStyle = '#0b0f14';
      c.fillRect(X - bw / 2, Y - R - 7, bw, 3);
      c.fillStyle = e.hp / e.maxHp > 0.4 ? '#69db7c' : '#ff6b6b';
      c.fillRect(X - bw / 2 + 1, Y - R - 6, Math.max(0, (bw - 2) * (e.hp / e.maxHp)), 1);
    }
  }

  function drawPxPlayer(c, run, K, ox, oy) {
    const p = run.player, ch = run.char;
    const X = Math.round(p.x * K + ox), Y = Math.round(p.y * K + oy);
    const R = Math.max(6, Math.round(PLAYER_R * K * 1.55));
    const body = ch.color, hair = ch.accent;
    const dark = '#0b0f14';
    c.fillStyle = 'rgba(0,0,0,.42)';
    c.fillRect(X - R + 1, Y + R - 1, R * 2 - 2, Math.max(1, Math.round(R * 0.35)));
    c.fillRect(X - R + 3, Y + R, R * 2 - 6, 1);
    if (run.shield > 0) {
      c.fillStyle = '#74c0fc';
      c.globalAlpha = 0.35 + Math.abs(Math.sin(G.time * 5)) * 0.35;
      const s = R + 3;
      c.fillRect(X - s, Y - s, s * 2, 1); c.fillRect(X - s, Y + s, s * 2, 1);
      c.fillRect(X - s, Y - s, 1, s * 2); c.fillRect(X + s, Y - s, 1, s * 2);
      c.globalAlpha = 1;
    }
    const blink = run.invuln > 0 && Math.floor(G.time * 20) % 2 === 0;
    c.globalAlpha = blink ? 0.5 : 1;
    const fx = Math.cos(p.ang), fy = Math.sin(p.ang);
    const dir = Math.abs(fx) > Math.abs(fy) ? (fx > 0 ? 1 : 3) : (fy > 0 ? 0 : 2);
    const moving = Math.hypot(p.vx || 0, p.vy || 0) > 20;
    const frame = moving ? (Math.floor(G.time * 8) % 2) : 0;
    // 披风（朝向反向飘动）
    const back = dir === 1 ? -1 : dir === 3 ? 1 : 0;
    const backY = dir === 0 ? -1 : dir === 2 ? 1 : 0;
    c.fillStyle = dark;
    c.fillRect(X + back * (R - 1) - Math.round(R * 0.75), Y - Math.round(R * 0.4) + backY * (R - 3), Math.round(R * 1.5), Math.round(R * 1.5));
    c.fillStyle = hair;
    c.fillRect(X + back * (R - 2) - Math.round(R * 0.6), Y - Math.round(R * 0.3) + backY * (R - 3), Math.round(R * 1.2), Math.round(R * 1.2));
    // 头部（窄）+ 躯干（宽），粗描边
    const hr = Math.max(3, Math.round(R * 0.74));
    const hd = Math.max(4, Math.round(R * 1.05));
    const headTop = Y - R;
    const bodyTop = headTop + hd;
    c.fillStyle = dark;
    c.fillRect(X - hr - 1, headTop - 1, hr * 2 + 2, hd + 2);
    c.fillRect(X - R - 1, bodyTop - 1, R * 2 + 2, Y + R - bodyTop + 2);
    // 躯干
    c.fillStyle = body;
    c.fillRect(X - R, bodyTop, R * 2, Y + R - bodyTop);
    c.fillStyle = hexShade(body, -0.28);
    c.fillRect(X - R, Y + R - 3, R * 2, 3);
    c.fillStyle = hexShade(body, 0.3);
    c.fillRect(X - R + 1, bodyTop, 2, Y + R - bodyTop);
    // 头部
    c.fillStyle = '#e8c39e';
    c.fillRect(X - hr, headTop, hr * 2, hd);
    c.fillStyle = hair;
    if (dir === 2) {
      // 背面：整头后脑
      c.fillRect(X - hr, headTop, hr * 2, hd);
      c.fillStyle = hexShade(hair, -0.2);
      c.fillRect(X - hr, headTop, hr * 2, 2);
    } else {
      c.fillRect(X - hr, headTop, hr * 2, Math.max(2, Math.round(hd * 0.4)));
      if (dir === 1) c.fillRect(X - hr, headTop, 2, hd);
      if (dir === 3) c.fillRect(X + hr - 2, headTop, 2, hd);
    }
    // 眼睛（按朝向）
    const ey = headTop + Math.round(hd * 0.58);
    c.fillStyle = '#0b0f14';
    if (dir === 0) {
      c.fillRect(X - 3, ey, 2, 2);
      c.fillRect(X + 1, ey, 2, 2);
      c.fillStyle = '#f8f9fa';
      c.fillRect(X - 3, ey, 1, 1);
      c.fillRect(X + 1, ey, 1, 1);
    } else if (dir === 1) {
      c.fillRect(X + 2, ey, 2, 2);
    } else if (dir === 3) {
      c.fillRect(X - 4, ey, 2, 2);
    }
    // 脚（两帧交替）
    c.fillStyle = '#0b0f14';
    if (frame === 0 || !moving) {
      c.fillRect(X - R + 1, Y + R, 4, 2);
      c.fillRect(X + R - 5, Y + R, 4, 2);
    } else {
      c.fillRect(X - R + 2, Y + R, 4, 2);
      c.fillRect(X + R - 6, Y + R + 1, 4, 1);
    }
    // 武器（沿瞄准方向）
    const w = curWeapon();
    if (w) {
      const len = w.fam === 'melee' ? R + 6 : R + 4;
      for (let i = 2; i < len; i++) {
        const wx = X + Math.round(fx * i), wy = Y + Math.round(fy * i) + 1;
        c.fillStyle = dark;
        c.fillRect(wx - 1, wy - 1, 3, 3);
        c.fillStyle = i === len - 1 ? '#f8f9fa' : w.color;
        c.fillRect(wx, wy, 1, 1);
      }
    }
    c.globalAlpha = 1;
  }

  function drawPxBullets(c, run, K, ox, oy) {
    for (const b of run.bullets) {
      const X = Math.round(b.x * K + ox), Y = Math.round(b.y * K + oy);
      const sz = b.r > 6 ? 3 : 2;
      const col = b.color || '#ffe066';
      c.fillStyle = hexShade(col, -0.5);
      c.fillRect(X - sz - 1, Y - sz - 1, sz * 2 + 2, sz * 2 + 2);
      c.fillStyle = col;
      c.fillRect(X - sz, Y - sz, sz * 2, sz * 2);
      c.fillStyle = '#ffffff';
      c.fillRect(X - 1, Y - 1, 1, 1);
    }
    for (const b of run.ebullets) {
      const X = Math.round(b.x * K + ox), Y = Math.round(b.y * K + oy);
      const sz = b.r > 7 ? 3 : 2;
      const col = b.color || '#ff6b6b';
      c.fillStyle = '#2b0508';
      c.fillRect(X - sz - 1, Y - sz - 1, sz * 2 + 2, sz * 2 + 2);
      c.fillStyle = col;
      c.fillRect(X - sz, Y - sz, sz * 2, sz * 2);
      c.fillStyle = '#fff3bf';
      c.fillRect(X - 1, Y - 1, 1, 1);
    }
  }

  function drawPxBoss(c, b, K, ox, oy) {
    const R = Math.max(8, Math.round(b.r * K * 1.25));
    const X = Math.round(b.x * K + ox), Y = Math.round(b.y * K + oy);
    const base = b.color || '#b197fc';
    c.fillStyle = 'rgba(0,0,0,.45)';
    c.fillRect(X - R, Y + R - 2, R * 2, Math.max(2, Math.round(R * 0.35)));
    pxDisc(c, X, Y, R + 2, '#0b0f14');
    pxDisc(c, X, Y, R, base);
    // 顶部高光与尖角
    c.fillStyle = hexShade(base, 0.28);
    c.fillRect(X - Math.round(R * 0.7), Y - R + 2, Math.round(R * 1.2), 3);
    c.fillStyle = '#0b0f14';
    c.fillRect(X - Math.round(R * 0.55), Y - R - 4, 3, 5);
    c.fillRect(X + Math.round(R * 0.3), Y - R - 5, 3, 6);
    // 眼睛
    c.fillStyle = '#ff6b6b';
    c.fillRect(X - Math.round(R * 0.45), Y - 2, 3, 3);
    c.fillRect(X + Math.round(R * 0.2), Y - 2, 3, 3);
  }

  function drawPxDecor(c, room, cfg, K, ox, oy) {
    if (!room.decorSeed) room.decorSeed = 1 + ((Math.random() * 99999) | 0);
    let seed = room.decorSeed;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    const cols = 6, rows = 4;
    for (let gy = 0; gy < rows; gy++) {
      for (let gx = 0; gx < cols; gx++) {
        const p = rnd();
        if (p > 0.55) continue;
        const wx = 120 + (gx + 0.2 + rnd() * 0.6) * ((ROOM_W - 240) / cols);
        const wy = 120 + (gy + 0.2 + rnd() * 0.6) * ((ROOM_H - 240) / rows);
        const X = Math.round(wx * K + ox), Y = Math.round(wy * K + oy);
        if (p < 0.16) {
          // 血迹
          c.fillStyle = 'rgba(122,20,28,.55)';
          c.fillRect(X - 5, Y - 2, 10, 4);
          c.fillRect(X - 3, Y + 2, 6, 3);
          c.fillStyle = 'rgba(122,20,28,.35)';
          c.fillRect(X + 6, Y + 1, 3, 2);
        } else if (p < 0.32) {
          // 碎石
          c.fillStyle = hexShade(cfg.tile, -0.3);
          c.fillRect(X - 4, Y, 4, 3);
          c.fillRect(X + 1, Y + 2, 3, 2);
          c.fillStyle = hexShade(cfg.tile, 0.18);
          c.fillRect(X - 3, Y, 2, 1);
        } else if (p < 0.44) {
          // 骨头
          c.fillStyle = '#cfd4dc';
          c.fillRect(X - 6, Y, 8, 2);
          c.fillRect(X - 7, Y - 1, 2, 4);
          c.fillRect(X + 2, Y - 1, 2, 4);
          c.fillStyle = 'rgba(0,0,0,.35)';
          c.fillRect(X - 6, Y + 2, 8, 1);
        } else if (p < 0.52) {
          // 裂纹
          c.fillStyle = hexShade(cfg.tile, -0.26);
          c.fillRect(X - 7, Y - 4, 2, 2);
          c.fillRect(X - 5, Y - 2, 2, 2);
          c.fillRect(X - 3, Y, 2, 2);
          c.fillRect(X - 1, Y + 2, 2, 2);
          c.fillRect(X + 1, Y + 4, 2, 2);
        }
      }
    }
    // 房间中央地毯（Boss/精英房）
    if (room.type === 'boss' || room.type === 'elite') {
      const cx = Math.round(640 * K + ox), cy = Math.round(360 * K + oy);
      const w = Math.round(260 * K), h = Math.round(200 * K);
      c.fillStyle = 'rgba(0,0,0,.28)';
      c.fillRect(cx - w / 2, cy - h / 2, w, h);
      c.fillStyle = room.type === 'boss' ? 'rgba(120,20,30,.55)' : 'rgba(90,60,20,.45)';
      c.fillRect(cx - w / 2 + 3, cy - h / 2 + 3, w - 6, h - 6);
      c.fillStyle = cfg.accent;
      c.globalAlpha = 0.35;
      for (let i = 0; i < 4; i++) {
        c.fillRect(cx - w / 2 + 6 + i * 4, cy - h / 2 + 6, 2, h - 12);
        c.fillRect(cx + w / 2 - 8 - i * 4, cy - h / 2 + 6, 2, h - 12);
      }
      c.globalAlpha = 1;
    }
  }

  function torchList(room) {
    const t = 34;
    return [
      { x: 440, y: t, ph: 0 }, { x: 840, y: t, ph: 1.7 },
      { x: 440, y: ROOM_H - t, ph: 3.1 }, { x: 840, y: ROOM_H - t, ph: 4.4 },
      { x: t, y: 250, ph: 2.2 }, { x: ROOM_W - t, y: 250, ph: 5.0 }
    ];
  }

  function drawPxTorches(c, room, cfg, K, ox, oy) {
    for (const t of torchList(room)) {
      const X = Math.round(t.x * K + ox), Y = Math.round(t.y * K + oy);
      const fl = Math.sin(G.time * 9 + t.ph) * 0.5 + 0.5;
      c.fillStyle = '#2b2118';
      c.fillRect(X - 2, Y - 2, 4, 6);
      c.fillStyle = '#4a3a28';
      c.fillRect(X - 3, Y - 3, 6, 2);
      c.fillStyle = '#ff922b';
      c.fillRect(X - 2, Y - 7 - fl * 2, 4, 5);
      c.fillStyle = '#ffd43b';
      c.fillRect(X - 1, Y - 8 - fl * 2, 2, 4);
      c.fillStyle = 'rgba(255,146,43,.35)';
      c.fillRect(X - 3, Y - 9 - fl * 2, 6, 2);
    }
  }

  function drawPxLights(room, cfg) {
    const sx = canvas.width / view.viewW;
    const cx = canvas.width / 2, cy = canvas.height / 2;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    for (const t of torchList(room)) {
      const X = (t.x - G.cam.x) * sx + cx;
      const Y = (t.y - G.cam.y) * sx + cy;
      const R = 210 * sx * (0.93 + 0.07 * Math.sin(G.time * 7 + t.ph));
      if (X < -R || Y < -R || X > canvas.width + R || Y > canvas.height + R) continue;
      const g = ctx.createRadialGradient(X, Y, 2, X, Y, R);
      g.addColorStop(0, 'rgba(255,176,86,.20)');
      g.addColorStop(0.4, 'rgba(255,132,54,.08)');
      g.addColorStop(1, 'rgba(255,110,40,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(X, Y, R, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function renderWorld() {
    const run = G.run;
    if (!run || !run.room) return;
    const cfg = FLOORS[run.floor];
    const room = run.room;

    // 低分辨率画布（宽度固定 480，高度按视口比例）
    const K = 480 / view.viewW;
    const w = 480, h = Math.max(200, Math.round(view.viewH * K / 2) * 2);
    if (PX.cv.width !== w || PX.cv.height !== h) {
      PX.cv.width = w; PX.cv.height = h;
      PX.c = PX.cv.getContext('2d');
      PX.c.imageSmoothingEnabled = false;
    }
    const pc = PX.c;
    const sh = run.trauma * run.trauma * 18;
    const shakeX = sh ? rand(-sh, sh) : 0, shakeY = sh ? rand(-sh, sh) : 0;
    const ox = w / 2 - G.cam.x * K + shakeX * K;
    const oy = h / 2 - G.cam.y * K + shakeY * K;
    PX.K = K; PX.ox = ox; PX.oy = oy;

    pc.setTransform(1, 0, 0, 1, 0, 0);
    pc.fillStyle = cfg.bg2;
    pc.fillRect(0, 0, w, h);
    drawPxFloor(pc, room, cfg, K, ox, oy);
    drawPxDecor(pc, room, cfg, K, ox, oy);
    drawPxWalls(pc, room, cfg, K, ox, oy);
    drawPxTorches(pc, room, cfg, K, ox, oy);

    // 道具/机关/特效沿用世界坐标绘制（低分辨率下自然像素化）
    const savedCtx = ctx;
    ctx = pc;
    pc.setTransform(K, 0, 0, K, ox, oy);
    drawObstacles(room, cfg);
    drawHazards(run);
    drawPickups(run);
    drawInteractables(run);
    drawTurrets(run);
    ctx = savedCtx;

    // 像素角色与子弹
    pc.setTransform(1, 0, 0, 1, 0, 0);
    for (const e of run.enemies) drawPxEnemy(pc, e, K, ox, oy);
    if (run.boss) drawPxBoss(pc, run.boss, K, ox, oy);
    drawPxPlayer(pc, run, K, ox, oy);
    ctx = pc;
    pc.setTransform(K, 0, 0, K, ox, oy);
    drawParticles(run);
    drawEffects(run);
    drawTexts(run);
    ctx = savedCtx;

    // 合成放大
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(PX.cv, 0, 0, w, h, 0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingEnabled = true;
    drawPxLights(room, cfg);
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    // 暗角
    const vg = ctx.createRadialGradient(view.w / 2, view.h / 2, Math.min(view.w, view.h) * 0.38, view.w / 2, view.h / 2, Math.max(view.w, view.h) * 0.78);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,.50)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, view.w, view.h);
    // 受击闪红
    if (run.redFlash > 0) {
      ctx.fillStyle = `rgba(255,40,40,${run.redFlash * 0.9})`;
      ctx.fillRect(0, 0, view.w, view.h);
    }
    // 低血脉冲
    if (run.hp / run.maxHp < 0.3) {
      const a = (0.12 + Math.sin(G.time * 4.5) * 0.08) * (1 - run.hp / (run.maxHp * 0.3));
      const g2 = ctx.createRadialGradient(view.w / 2, view.h / 2, Math.min(view.w, view.h) * 0.3, view.w / 2, view.h / 2, Math.max(view.w, view.h) * 0.7);
      g2.addColorStop(0, 'rgba(255,0,0,0)');
      g2.addColorStop(1, `rgba(255,0,0,${Math.max(0, a)})`);
      ctx.fillStyle = g2;
      ctx.fillRect(0, 0, view.w, view.h);
    }
  }

  // ======================================================================
  //  §27 HUD · 界面 · 主循环
  // ======================================================================
  function rr(x, y, w, h, r) {
    const c = ctx;
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function panel(x, y, w, h, fill, stroke) {
    const c = ctx;
    c.fillStyle = fill || 'rgba(12,15,22,.82)';
    rr(x, y, w, h, 14); c.fill();
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = 1.5; c.stroke(); }
  }
  function btn(id, x, y, w, h, label, opt) {
    const c = ctx;
    opt = opt || {};
    addHot(id, x, y, w, h);
    const hover = false;
    c.fillStyle = opt.primary ? 'rgba(77,171,247,.22)' : 'rgba(255,255,255,.07)';
    rr(x, y, w, h, 10); c.fill();
    c.strokeStyle = opt.primary ? 'rgba(116,192,252,.8)' : 'rgba(255,255,255,.18)';
    c.lineWidth = 1.5; c.stroke();
    c.fillStyle = opt.color || (opt.primary ? '#d0ebff' : '#e9ecef');
    c.font = font(opt.size || 18, 700);
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(label, x + w / 2, y + h / 2 + 1);
    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  }
  function wrapText(str, maxW, size, weight) {
    const c = ctx;
    c.font = font(size, weight || 500);
    const out = [];
    let line = '';
    for (const ch of String(str)) {
      const t = line + ch;
      if (c.measureText(t).width > maxW && line) { out.push(line); line = ch; }
      else line = t;
    }
    if (line) out.push(line);
    return out;
  }
  function pxIcon(kind, x, y, col) {
    const c = ctx;
    c.fillStyle = col;
    if (kind === 'heart') {
      c.fillRect(x + 1, y + 2, 3, 2); c.fillRect(x + 6, y + 2, 3, 2);
      c.fillRect(x, y + 4, 10, 3); c.fillRect(x + 2, y + 7, 6, 2); c.fillRect(x + 4, y + 9, 2, 1);
    } else if (kind === 'shield') {
      c.fillRect(x + 1, y + 1, 8, 4);
      c.fillRect(x + 2, y + 5, 6, 2); c.fillRect(x + 3, y + 7, 4, 2); c.fillRect(x + 4, y + 9, 2, 1);
      c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(x + 2, y + 2, 2, 5);
    } else {
      c.fillRect(x + 5, y, 4, 4); c.fillRect(x + 3, y + 3, 4, 3);
      c.fillRect(x + 2, y + 6, 4, 3); c.fillRect(x + 1, y + 8, 4, 2);
    }
  }

  // 3x5 像素数字字体（HUD 数值统一使用，保证像素感）
  const PFONT = {
    '0': ['111', '101', '101', '101', '111'], '1': ['010', '110', '010', '010', '111'],
    '2': ['111', '001', '111', '100', '111'], '3': ['111', '001', '111', '001', '111'],
    '4': ['101', '101', '111', '001', '001'], '5': ['111', '100', '111', '001', '111'],
    '6': ['111', '100', '111', '101', '111'], '7': ['111', '001', '010', '010', '010'],
    '8': ['111', '101', '111', '101', '111'], '9': ['111', '101', '111', '001', '111'],
    '/': ['001', '001', '010', '100', '100'], ':': ['000', '010', '000', '010', '000'],
    '.': ['000', '000', '000', '000', '010'], '-': ['000', '000', '111', '000', '000'],
    '+': ['000', '010', '111', '010', '000'], '%': ['101', '001', '010', '100', '101'],
    'X': ['101', '101', '010', '101', '101'], ' ': ['000', '000', '000', '000', '000']
  };
  function pxNum(str, x, y, s, col, align) {
    const c = ctx;
    const chars = String(str).toUpperCase();
    const w = Math.max(0, chars.length * 4 * s - s);
    let cx = align === 'center' ? Math.round(x - w / 2) : align === 'right' ? Math.round(x - w) : Math.round(x);
    c.fillStyle = col || '#ffffff';
    for (const ch of chars) {
      const g = PFONT[ch];
      if (g) {
        for (let r = 0; r < 5; r++) {
          for (let k = 0; k < 3; k++) {
            if (g[r][k] === '1') c.fillRect(cx + k * s, y + r * s, s, s);
          }
        }
      }
      cx += 4 * s;
    }
    return w;
  }

  function pxBar(x, y, w, h, frac, color, label, icon) {
    const c = ctx;
    const f = clamp(frac, 0, 1);
    // 外框
    c.fillStyle = '#0a0c11';
    c.fillRect(x - 3, y - 3, w + 6, h + 6);
    c.fillStyle = '#2b3040';
    c.fillRect(x - 2, y - 2, w + 4, h + 4);
    c.fillStyle = '#171a22';
    c.fillRect(x, y, w, h);
    // 填充
    if (f > 0) {
      const fw = Math.max(2, Math.round((w - 2) * f));
      c.fillStyle = hexShade(color, -0.35);
      c.fillRect(x + 1, y + 1, fw, h - 2);
      c.fillStyle = color;
      c.fillRect(x + 1, y + 1, fw, Math.max(1, h - 4));
      c.fillStyle = hexShade(color, 0.35);
      c.fillRect(x + 1, y + 1, fw, 1);
      // 刻度
      c.fillStyle = 'rgba(0,0,0,.28)';
      for (let i = 20; i < fw; i += 20) c.fillRect(x + i, y + 1, 1, h - 2);
    }
    // 图标
    if (icon) {
      c.fillStyle = '#0a0c11';
      c.fillRect(x - 16, y - 3, 20, h + 6);
      c.fillStyle = '#2b3040';
      c.fillRect(x - 15, y - 2, 18, h + 4);
      c.fillStyle = '#11141a';
      c.fillRect(x - 13, y - 1, 14, h + 2);
      pxIcon(icon, x - 11, y + Math.max(0, (h - 10) / 2), icon === 'heart' ? '#ff8787' : icon === 'shield' ? '#a5d8ff' : '#74c0fc');
    }
    if (label) {
      const s = 2;
      pxNum(label, x + w / 2, y + Math.round((h - 10) / 2), s, 'rgba(0,0,0,.6)', 'center');
      pxNum(label, x + w / 2, y + Math.round((h - 10) / 2) - 1, s, '#fff', 'center');
    }
  }

  function drawMinimap(run) {
    const cfg = FLOORS[run.floor];
    const cell = 13, pad = 3;
    const mw = cfg.cols * cell, mh = cfg.rows * cell;
    const bx = 1084, by = 14, bw = 180, bh = 180;
    ctx.fillStyle = 'rgba(6,8,12,.72)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#31384a';
    ctx.fillRect(bx, by, bw, 3); ctx.fillRect(bx, by + bh - 3, bw, 3);
    ctx.fillRect(bx, by, 3, bh); ctx.fillRect(bx + bw - 3, by, 3, bh);
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.fillRect(bx + 3, by + 3, bw - 6, 1);
    const x0 = bx + (bw - mw) / 2, y0 = by + (bh - mh) / 2;
    for (const r of run.dungeon.rooms) {
      if (!r.visited && r.type !== 'boss') continue;
      const x = x0 + r.x * cell + 1, y = y0 + r.y * cell + 1;
      let col = '#4a5568';
      if (r.type === 'boss') col = r.cleared ? '#e599f7' : '#ff6b6b';
      else if (r.type === 'elite') col = '#ffa94d';
      else if (r.type === 'treasure') col = '#ffd43b';
      else if (r.type === 'shop') col = '#66d9e8';
      else if (r.type === 'event') col = '#b197fc';
      else if (r.type === 'start') col = '#8ce99a';
      else col = r.cleared ? '#5c6b82' : '#3f4b5f';
      ctx.fillStyle = col;
      ctx.fillRect(x, y, cell - 2, cell - 2);
      if (r === run.room) {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        ctx.strokeRect(x - 1, y - 1, cell, cell);
      }
    }
    // 门连线
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1;
    for (const r of run.dungeon.rooms) {
      if (!r.visited) continue;
      const x = x0 + r.x * cell + cell / 2 - 1, y = y0 + r.y * cell + cell / 2 - 1;
      for (const id in r.doors) {
        const n = r.doors[id];
        if (!n.visited) continue;
        if (id === 'E' || id === 'S') {
          ctx.beginPath(); ctx.moveTo(x, y);
          ctx.lineTo(x0 + n.x * cell + cell / 2 - 1, y0 + n.y * cell + cell / 2 - 1);
          ctx.stroke();
        }
      }
    }
  }

  function renderHUD() {
    const run = G.run;
    if (!run) return;
    beginUI();
    const ch = run.char;
    // 状态面板（左上）
    ctx.fillStyle = 'rgba(6,8,12,.80)';
    ctx.fillRect(14, 12, 302, 86);
    ctx.fillStyle = '#31384a';
    ctx.fillRect(14, 12, 302, 3);
    ctx.fillRect(14, 95, 302, 3);
    ctx.fillRect(14, 12, 3, 86);
    ctx.fillRect(313, 12, 3, 86);
    ctx.fillStyle = 'rgba(255,255,255,.07)';
    ctx.fillRect(17, 15, 296, 1);
    ctx.fillStyle = '#0a0c11';
    ctx.fillRect(17, 96, 296, 2);
    pxBar(58, 24, 240, 20, run.hp / run.maxHp, '#ff6b6b', `${Math.max(0, Math.ceil(run.hp))} / ${run.maxHp}`, 'heart');
    pxBar(58, 51, 240, 14, run.energy / run.maxEnergy, '#4dabf7', '', 'bolt');
    if (run.shield > 0) pxBar(58, 71, 240, 10, run.shield / Math.max(1, run.maxShield || run.shield), '#ced4da', '', 'shield');
    // 楼层 / 金币 / 进度
    ctx.fillStyle = '#e9ecef';
    ctx.font = font(14, 800);
    ctx.fillText(`第 ${run.floor + 1} 层 · ${FLOORS[run.floor].name}`, 18, 122);
    ctx.fillStyle = '#ffd43b';
    ctx.font = font(13, 800);
    ctx.fillText('◆', 18, 143);
    pxNum(run.coins, 38, 132, 2, '#ffd43b');
    ctx.fillStyle = '#adb5bd';
    ctx.font = font(12, 700);
    ctx.fillText('击杀', 96, 142);
    pxNum(run.kills, 128, 132, 2, '#dee2e6');
    ctx.fillStyle = '#adb5bd';
    ctx.fillText('碎片', 166, 142);
    pxNum(run.shards, 200, 132, 2, '#a5d8ff');
    // 遗物条
    let rx = 18;
    for (let i = 0; i < run.relicIds.length && i < 12; i++) {
      const r = RELIC_MAP[run.relicIds[i]];
      if (!r) continue;
      ctx.fillStyle = '#0a0c11';
      ctx.fillRect(rx - 2, 152, 26, 26);
      ctx.fillStyle = RARITY[r.rar].bg;
      ctx.fillRect(rx - 1, 153, 24, 24);
      ctx.fillStyle = RARITY[r.rar].color;

      ctx.font = font(13, 800); ctx.textAlign = 'center';

      ctx.textAlign = 'left';
      rx += 28;
    }
    if (run.relicIds.length > 12) {
      ctx.fillStyle = '#adb5bd'; ctx.font = font(11, 700);
      ctx.fillText(`+${run.relicIds.length - 12}`, rx + 2, 170);
    }
    // 小地图 + 暂停
    drawMinimap(run);
    addHot('pause', 1236, 200, 34, 34);
    ctx.fillStyle = 'rgba(8,10,16,.7)';
    rr(1236, 200, 34, 34, 9); ctx.fill();
    ctx.fillStyle = '#dee2e6';
    ctx.fillRect(1247, 209, 4, 16);
    ctx.fillRect(1256, 209, 4, 16);
    // Boss 血条
    if (run.boss) {
      const b = run.boss;
      pxBar(360, 30, 560, 16, b.hp / b.maxHp, '#ff6b6b', '', null);
      ctx.fillStyle = '#fff'; ctx.font = font(14, 700); ctx.textAlign = 'center';
      ctx.fillText(`${b.name} · ${b.def.title}`, 640, 15);
      ctx.textAlign = 'left';
      const ph = b.def.phases;
      for (let i = 0; i < ph.length; i++) {
        ctx.fillStyle = i <= b.phase ? '#ffd43b' : 'rgba(255,255,255,.25)';
        ctx.beginPath(); ctx.arc(360 + 8 + i * 14, 44, 4, 0, TAU); ctx.fill();
      }
    }
    // 技能按钮
    const skX = 1176, skY = 614, skR = 48;
    addHot('skill', skX - skR, skY - skR, skR * 2, skR * 2);
    const cdFrac = run.skillCd > 0 ? 1 - run.skillCd / Math.max(0.01, run.skillBase || ch.cd) : 1;
    ctx.fillStyle = 'rgba(10,12,18,.7)';
    ctx.beginPath(); ctx.arc(skX, skY, skR, 0, TAU); ctx.fill();
    ctx.strokeStyle = run.skillCd > 0 ? 'rgba(255,255,255,.18)' : ch.accent;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(skX, skY, skR - 4, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(cdFrac, 0, 1)); ctx.stroke();
    ctx.fillStyle = run.skillCd > 0 ? 'rgba(255,255,255,.35)' : ch.accent;
    ctx.font = font(15, 800); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(run.skillCd > 0 ? run.skillCd.toFixed(1) : '技能', skX, skY);
    ctx.font = font(11, 600); ctx.fillStyle = '#adb5bd';
    ctx.fillText(ch.activeName, skX, skY + 62);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    // 武器槽
    for (let i = 0; i < 2; i++) {
      const id = run.weapons[i];
      const x = 1010 + i * 74, y = 596, w = 68, h = 34;
      addHot('weapon' + i, x, y, w, h);
      ctx.fillStyle = i === run.slot ? '#3a2f0c' : 'rgba(8,10,16,.8)';
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = i === run.slot ? '#ffd43b' : '#2b3040';
      ctx.fillRect(x, y, w, 2); ctx.fillRect(x, y + h - 2, w, 2);
      ctx.fillRect(x, y, 2, h); ctx.fillRect(x + w - 2, y, 2, h);
      const wd = id ? WEAPONS[id] : null;
      ctx.font = font(11, 700);
      ctx.fillStyle = wd ? wd.color : '#495057';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(wd ? wd.name : '空', x + w / 2, y + h / 2 + 1);
      if (wd) {
        ctx.fillStyle = 'rgba(255,255,255,.45)';
        ctx.font = font(9, 600);
        ctx.fillText(wd.fam, x + w / 2, y + h - 6);
      }
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    }
    // 触屏摇杆
    if (Input.touchMode) {
      for (const s of [Input.moveStick, Input.aimStick]) {
        if (!s.on) continue;
        const b = toUI(s.bx, s.by);
        const cur = toUI(s.x, s.y);
        ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(b.x, b.y, 70, 0, TAU); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,.14)';
        for (let k = 0; k < 4; k++) {
          const a = k * Math.PI / 2;
          ctx.beginPath();
          ctx.moveTo(b.x + Math.cos(a) * 58, b.y + Math.sin(a) * 58);
          ctx.lineTo(b.x + Math.cos(a) * 70, b.y + Math.sin(a) * 70);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(255,255,255,.30)';
        ctx.beginPath(); ctx.arc(cur.x, cur.y, 28, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(cur.x, cur.y, 28, 0, TAU); ctx.stroke();
      }

    // 提示 / 播报
    if (G.toast) {
      ctx.globalAlpha = clamp(G.toast.t / 0.5, 0, 1);
      ctx.fillStyle = 'rgba(8,10,16,.8)';
      ctx.font = font(16, 700);

      rr(640 - tw / 2 - 16, 636, tw + 32, 34, 10); ctx.fill();
      ctx.fillStyle = '#f1f3f5'; ctx.textAlign = 'center';
      ctx.fillText(G.toast.text, 640, 659);
      ctx.textAlign = 'left'; ctx.globalAlpha = 1;
    }
    if (G.banner) {
      const a = clamp(G.banner.t / 0.6, 0, 1);
      ctx.globalAlpha = a;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff'; ctx.font = font(36, 800);
      ctx.fillText(G.banner.title, 640, 148);
      ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = font(15, 600);
      ctx.fillText(G.banner.sub, 640, 176);
      ctx.textAlign = 'left'; ctx.globalAlpha = 1;
    }
    // 通关惩罚提示（秒表/连杀）
    if (run.combo >= 8) {
      ctx.fillStyle = 'rgba(255,212,59,.8)';
      ctx.font = font(13, 800);
      ctx.fillText(`连杀 ×${run.combo}`, 640, 700);
    }
    // 淡入
    if (G.fade > 0) {
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      ctx.fillStyle = `rgba(0,0,0,${G.fade})`;
      ctx.fillRect(0, 0, view.w, view.h);
    }
  }

  function renderReward() {

      const icx = x + cw / 2 - 34, icy = y + 48;
      c.fillStyle = '#05070b'; c.fillRect(icx - 2, icy - 2, 72, 72);
      c.fillStyle = rar.color; c.fillRect(icx, icy, 68, 68);
      c.fillStyle = '#0d1119'; c.fillRect(icx + 4, icy + 4, 60, 60);
      c.fillStyle = rar.color; c.font = font(30, 900);
      c.fillText(r.name[0], icx + 34, icy + 43);
      c.fillStyle = 'rgba(255,255,255,.5)';
      c.fillRect(icx + 4, icy + 4, 2, 2); c.fillRect(icx + 62, icy + 4, 2, 2);
      c.fillRect(icx + 4, icy + 62, 2, 2); c.fillRect(icx + 62, icy + 62, 2, 2);

    for (let i = 0; i < tabs.length; i++) {
      const tx = 160 + i * 128, ty = 22, tw = 116, th = 36;
      addHot('codexTab' + i, tx, ty, tw, th);
      const on = tabIdx === i;
      c.fillStyle = '#05070b'; c.fillRect(tx, ty, tw, th);

      c.fillText(tabs[i], tx + tw / 2, ty + 24);
      c.textAlign = 'left';
    }
    btn('back', 1160, 20, 90, 38, '返回', { size: 15 });

    let list = [];
    if (tabIdx === 0) {
      list = Object.keys(WEAPONS).map((k) => WEAPONS[k]).filter((w) => w && w.name);
      list = list.map((w) => ({ n: w.name, s: (w.fam || '-') + ' · 伤害 ' + (w.dmg != null ? w.dmg : '-'), c: w.color || '#ffd43b' }));
    } else if (tabIdx === 1) {
      list = Object.keys(ENEMIES).map((k) => ENEMIES[k]).filter((e) => e && e.name);
      list = list.map((e) => ({ n: e.name, s: 'HP ' + (e.hp != null ? e.hp : '-') + ' · ' + (e.shape || 'blob'), c: e.color || '#8b5cf6' }));

    const per = 24, page = G.codexPage || 0;

      c.fillText(it.n, x + 70, y + 36);

      wrapText(it.s, cw - 82, 10, 600).slice(0, 2).forEach((ln, k) => c.fillText(ln, x + 70, y + 54 + k * 13));
      c.fillStyle = 'rgba(255,255,255,.1)'; c.fillRect(x + 5, y + chh - 30, cw - 10, 1);

      miniHero(x + cw / 2, y + 48, ch.color, ch.accent);
      c.fillStyle = 'rgba(255,255,255,.06)'; c.fillRect(x + 5, y + 79, cw - 10, 1);
      // 名字条
      c.fillStyle = ch.color; c.fillRect(x + 5, y + 82, cw - 10, 26);
      c.fillStyle = '#0b0f14'; c.font = font(17, 900);
      c.fillText(ch.name, x + 12, y + 101);
      c.font = font(9, 800);
      c.fillText(ch.role, x + cw - 12 - c.measureText(ch.role).width, y + 100);
      // 属性
      c.fillStyle = 'rgba(255,255,255,.55)'; c.font = font(9, 700);
      c.fillText('HP', x + 12, y + 124); statBar(x + 36, y + 118, ch.hp / 160, '#ff6b6b');
      c.fillText('速', x + 12, y + 138); statBar(x + 36, y + 132, ch.speed / 260, '#4dabf7');
      pxNum(ch.hp, x + cw - 12, y + 118, 1, '#ffb3b3', 'right');
      // 被动
      c.fillStyle = ch.accent; c.font = font(10, 800);
      c.fillText(ch.passiveName, x + 12, y + 160);
      c.fillStyle = 'rgba(255,255,255,.48)'; c.font = font(9, 500);
      wrapText(ch.passiveDesc, cw - 24, 9, 500).slice(0, 3).forEach((ln, k) => c.fillText(ln, x + 12, y + 173 + k * 12));
      // 主动
      c.fillStyle = ch.color; c.font = font(10, 800);
      c.fillText(ch.activeName, x + 12, y + 217);
      c.fillStyle = 'rgba(255,255,255,.48)'; c.font = font(9, 500);
      wrapText(ch.activeDesc, cw - 24, 9, 500).slice(0, 3).forEach((ln, k) => c.fillText(ln, x + 12, y + 230 + k * 12));
      // 冷却与武器
      c.fillStyle = 'rgba(255,255,255,.35)'; c.font = font(9, 700);
      c.fillText('CD', x + 12, y + 276);
      pxNum(ch.cd + 'S', x + 28, y + 270, 1, '#ced4da');
      const wd = WEAPONS[ch.weapon];
      c.fillStyle = wd ? wd.color : '#ffd43b'; c.font = font(9, 800);
      c.textAlign = 'right';
      c.fillText(wd ? wd.name : '—', x + cw - 12, y + 276);
      c.textAlign = 'left';
      c.fillStyle = 'rgba(255,255,255,.10)';
      c.fillRect(x + 5, y + chh - 27, cw - 10, 18);
      c.fillStyle = 'rgba(255,255,255,.55)'; c.font = font(10, 800); c.textAlign = 'center';
      c.fillText('点击出发', x + cw / 2, y + chh - 14);
      c.textAlign = 'left';
    }
  }

  function renderMeta() {
    const c = ctx;
    beginUI();
    c.fillStyle = '#080a12'; c.fillRect(0, 0, 1280, 720);
    c.fillStyle = '#e9ecef'; c.font = font(26, 800);
    c.fillText('永久成长', 45, 52);
    c.fillStyle = '#ffd43b'; c.font = font(16, 800);
    c.fillText(`◆ ${save.gold}`, 45, 78);
    c.fillStyle = 'rgba(255,255,255,.45)'; c.font = font(12, 600);
    c.fillText(`威胁等级 ${save.threat}（每通关 +1，敌人更强，掉落更多）`, 160, 78);
    btn('back', 1160, 30, 90, 38, '返回', { size: 15 });
    const cols = 4, nw = 288, nh = 132, gapX = 14, gapY = 14;
    const sx = (1280 - (cols * nw + (cols - 1) * gapX)) / 2, sy = 100;
    META_NODES.forEach((n, i) => {
      const x = sx + (i % cols) * (nw + gapX);
      const y = sy + Math.floor(i / cols) * (nh + gapY);
      const lv = save.meta[n.id] || 0;
      const maxed = lv >= n.max;
      const cost = maxed ? 0 : n.costs[lv];
      const locked = n.req && (save.meta[n.req.id] || 0) < n.req.lv;
      const borderCol = maxed ? '#8ce99a' : locked ? '#242936' : '#3a4354';
      c.fillStyle = '#05070b'; c.fillRect(x, y, nw, nh);
      c.fillStyle = borderCol; c.fillRect(x + 2, y + 2, nw - 4, nh - 4);
      c.fillStyle = '#0f141c'; c.fillRect(x + 5, y + 5, nw - 10, nh - 10);
      c.fillStyle = maxed ? '#8ce99a' : '#f8f9fa';
      c.font = font(16, 800);
      c.fillText(n.name, x + 16, y + 30);
      pxNum(lv + '/' + n.max, x + nw - 16, y + 20, 1, maxed ? '#8ce99a' : 'rgba(255,255,255,.45)', 'right');
      // 等级格
      for (let k = 0; k < n.max; k++) {
        c.fillStyle = k < lv ? '#ffd43b' : '#242936';
        c.fillRect(x + 16 + k * 16, y + 40, 12, 7);
      }
      c.fillStyle = locked ? 'rgba(255,255,255,.3)' : 'rgba(255,255,255,.55)'; c.font = font(11, 500);
      wrapText(n.desc, nw - 32, 11, 500).slice(0, 2).forEach((ln, k) => c.fillText(ln, x + 16, y + 66 + k * 15));
      if (locked) {
        c.fillStyle = 'rgba(255,107,107,.75)'; c.font = font(11, 700);
        c.fillText(`需要 ${META_MAP[n.req.id].name} Lv.${n.req.lv}`, x + 16, y + nh - 14);
      } else if (maxed) {
        c.fillStyle = 'rgba(140,233,154,.85)'; c.font = font(12, 800);
        c.fillText('已 满 级', x + 16, y + nh - 14);
      } else {
        const bx = x + nw - 118, by = y + nh - 44, bw = 102, bh = 30;
        addHot('meta_' + n.id, bx, by, bw, bh);
        const afford = save.gold >= cost;
        c.fillStyle = '#05070b'; c.fillRect(bx, by, bw, bh);
        c.fillStyle = afford ? '#4a3a12' : '#20242e'; c.fillRect(bx + 2, by + 2, bw - 4, bh - 4);
        c.fillStyle = afford ? '#ffd43b' : '#495057'; c.fillRect(bx + 2, by + 2, bw - 4, 2);
        pxNum(cost, bx + 40, by + 9, 2, afford ? '#ffd43b' : '#6c757d', 'right');
        c.fillStyle = afford ? '#ffd43b' : '#6c757d'; c.font = font(11, 800);
        c.fillText('金', bx + 50, by + 21);
      }
    });
    c.fillStyle = 'rgba(255,255,255,.3)'; c.font = font(11, 500);
    c.fillText('金币来自每局结算。威胁等级会在通关后自动提升，也会提高金币掉落。', sx, 690);
  }

  function uiAction(id) {
    if (!id) return;
    if (id === 'start') { G.state = 'charsel'; Sound.play('ui'); return; }
    if (id === 'meta') { G.state = 'meta'; Sound.play('ui'); return; }
    if (id === 'codex') { G.state = 'codex'; G.codexTab = 0; G.codexPage = 0; Sound.play('ui'); return; }
    if (id.indexOf('codexTab') === 0) { G.codexTab = Number(id.slice(8)); G.codexPage = 0; Sound.play('ui'); return; }
    if (id === 'codexPrev') { G.codexPage = Math.max(0, (G.codexPage || 0) - 1); Sound.play('ui'); return; }
    if (id === 'codexNext') { G.codexPage = (G.codexPage || 0) + 1; Sound.play('ui'); return; }
    if (id === 'back') {
      G.state = G.run ? 'paused' : 'title';
      if (G.state === 'title') Sound.setMusic('title');
      Sound.play('ui'); return;
    }
    if (id === 'mute') { toggleSound(); return; }
    if (id.indexOf('char') === 0) {
      const idx = Number(id.slice(4));
      if (!isNaN(idx)) { Sound.play('win'); startRun(idx); }
      return;
    }
    if (id.indexOf('meta_') === 0) {
      const k = id.slice(5);
      const n = META_MAP[k];
      if (!n) return;
      const lv = save.meta[k] || 0;
      if (lv >= n.max) return;
      if (n.req && (save.meta[n.req.id] || 0) < n.req.lv) { toast('前置未满足'); Sound.play('deny'); return; }
      const cost = n.costs[lv];
      if (save.gold < cost) { toast('金币不足'); Sound.play('deny'); return; }
      save.gold -= cost;
      save.meta[k] = lv + 1;
      writeSave();
      Sound.play('pickup');
      return;
    }
    if (id === 'pause') { pauseGame(); return; }
    if (id === 'resume') { resumeGame(); return; }
    if (id === 'skill') { if (G.state === 'playing') useSkill(); return; }
    if (id.indexOf('weapon') === 0) {
      if (G.state === 'playing') switchSlot(Number(id.slice(6)) || 0);
      return;
    }
    if (id.indexOf('reward') === 0) { takeReward(Number(id.slice(6))); return; }
    if (id === 'reroll') {
      const run = G.run;
      if (run && run.rerolls > 0 && G.reward) {
        run.rerolls--;
        G.reward.options = rollRelicOptions(3 + (save.meta.luck ? 1 : 0));
        Sound.play('pickup');
      } else Sound.play('deny');
      return;
    }
    if (id === 'skip') { closeOverlay(); Sound.play('ui'); return; }
    if (id.indexOf('ev') === 0) {
      const ev = G.event;
      if (!ev) return;
      const o = ev.ev.options[Number(id.slice(2))];
      if (o) eventChoose(o.act);
      return;
    }
    if (id === 'retry') {
      G.state = 'charsel';
      G.run = null; G.floorKey = null;
      Sound.setMusic('title');
      Sound.play('ui');
      return;
    }
    if (id === 'title') {
      if (G.run && G.state === 'paused') {
        save.gold += Math.floor(G.run.coins * 0.6);
        save.bestFloor = Math.max(save.bestFloor, G.run.floor + 1);
        writeSave();
      }
      G.run = null; G.state = 'title'; G.floorKey = null;
      Sound.setMusic('title');
      Sound.play('ui');
      return;
    }
    if (id.indexOf('buy') === 0) { buyShop(Number(id.slice(3))); return; }
  }

  function renderShopHints() {
    const run = G.run;
    if (!run || !run.shopItems) return;
    const p = run.player;
    beginUI();
    // 价签（所有商品常驻显示）
    for (const s of run.shopItems) {
      const ui = worldToUI(s.x, s.y - 74);
      const tx = ui.x, ty = ui.y, tw = 64, th = 26;
      ctx.fillStyle = '#0a0c11';
      ctx.fillRect(tx - tw / 2, ty - th / 2, tw, th);
      ctx.fillStyle = s.sold ? '#2b3040' : '#4a3a12';
      ctx.fillRect(tx - tw / 2 + 2, ty - th / 2 + 2, tw - 4, th - 4);
      ctx.fillStyle = s.sold ? '#495057' : '#ffd43b';
      ctx.fillRect(tx - tw / 2 + 2, ty - th / 2 + 2, tw - 4, 2);
      if (s.sold) {
        ctx.fillStyle = '#868e96'; ctx.font = font(11, 800); ctx.textAlign = 'center';
        ctx.fillText('已售出', tx, ty + 4);
        ctx.textAlign = 'left';
      } else {
        pxNum(s.price, tx - 7, ty - 6, 2, run.coins >= s.price ? '#ffd43b' : '#ff8787');
        ctx.fillStyle = run.coins >= s.price ? '#ffd43b' : '#ff8787';
        ctx.font = font(10, 800);
        ctx.fillText('金', tx + 18, ty + 4);
      }
    }
    run.shopItems.forEach((s, i) => {
      if (dist(p.x, p.y, s.x, s.y) < 96) {
        const ui = worldToUI(s.x, s.y - 78);
        const nm = s.kind === 'weapon' ? (WEAPONS[s.id] ? WEAPONS[s.id].name : '武器')
          : s.kind === 'relic' ? (RELIC_MAP[s.id] ? RELIC_MAP[s.id].name : '遗物') : '治疗';
        const ok = !s.sold && run.coins >= s.price;
        const w = 210, h = 62, x = ui.x - w / 2, y = ui.y - h / 2;
        ctx.fillStyle = '#0a0c11';
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = s.sold ? '#2b3040' : ok ? '#4a3a12' : '#3a1a1a';
        ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
        ctx.fillStyle = s.sold ? '#868e96' : ok ? '#ffd43b' : '#ff8787';
        ctx.fillRect(x + 3, y + 3, w - 6, 2);
        ctx.font = font(14, 800);
        ctx.fillStyle = s.sold ? '#adb5bd' : '#f8f9fa';
        ctx.textAlign = 'center';
        ctx.fillText(nm, ui.x, y + 25);
        if (s.sold) {
          ctx.fillStyle = '#868e96'; ctx.font = font(11, 700);
          ctx.fillText('已售出', ui.x, y + 46);
        } else {
          pxNum(s.price, ui.x - 16, y + 33, 2, ok ? '#ffd43b' : '#ff8787');
          ctx.fillStyle = ok ? '#ffd43b' : '#ff8787';
          ctx.font = font(10, 800);
          ctx.fillText('金', ui.x + 12, y + 43);
          ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.font = font(10, 700);
          ctx.fillText(ok ? '点击购买' : '金币不足', ui.x, y + 55);
        }
        ctx.textAlign = 'left';
        if (!s.sold) addHot('buy' + i, x, y, w, h + 40);
      }
    });
  }

  function render() {
    Input.hot.length = 0;
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.fillStyle = '#05060a';
    ctx.fillRect(0, 0, view.w, view.h);
    if (G.state === 'title') { renderTitle(); return; }
    if (G.state === 'charsel') { renderCharSel(); return; }
    if (G.state === 'meta') { renderMeta(); return; }
    if (G.state === 'codex') { renderCodex(); return; }
    if (!G.run) { renderTitle(); return; }
    renderWorld();
    renderHUD();
    renderShopHints();
    if (G.state === 'reward') renderReward();
    else if (G.state === 'event') renderEvent();
    else if (G.state === 'paused') renderPause();
    else if (G.state === 'dead') renderDead();
    else if (G.state === 'victory') renderVictory();
  }

  // ======================================================================
  //  §28 主循环与启动
  // ======================================================================
  const STEP = 1 / 60;
  let acc = 0, lastT = 0;
  function frame(ts) {
    if (!lastT) lastT = ts;
    let dt = (ts - lastT) / 1000;
    lastT = ts;
    dt = clamp(dt, 0, 0.05);
    if (dt > 0) G.fps = lerp(G.fps, 1 / dt, 0.06);
    Sound.tickMusic();
    if (G.hitstop > 0) {
      G.hitstop = Math.max(0, G.hitstop - dt);
    } else if (G.state === 'playing') {
      acc += dt;
      let steps = 0;
      while (acc >= STEP && steps < 4) { updateGame(STEP); acc -= STEP; steps++; }
      if (steps >= 4) acc = 0;
    } else {
      acc = 0;
      G.time += dt;
      if (G.state === 'dead') G.deadT += dt;
      if (G.state === 'victory') G.victoryT += dt;
    }
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener('pointerdown', function unlockOnce() {
    Sound.unlock();
    if (G.state === 'title' && !G.musicOn) {
      G.musicOn = true;
      Sound.setMusic('title');
    }
  }, { passive: true });
  window.addEventListener('keydown', function unlockKey() { Sound.unlock(); }, { passive: true });

  G.state = 'title';
  G.fade = 1;
  resize();
  requestAnimationFrame(frame);

})();
</script>
