<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: #05060a; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  }
  /* 安全区避让：刘海/挖孔/手势条区域不绘制游戏内容 */
  body {
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #game { display: block; width: 100%; height: 100%; background: #05060a; cursor: crosshair; }
  #err {
    position: fixed; left: 0; top: 0; right: 0; z-index: 50;
    padding: 8px 12px; color: #ff7b7b; background: rgba(30,0,0,.92);
    font: 12px/1.5 Consolas, monospace; white-space: pre-wrap;
    display: none; pointer-events: none; max-height: 45%; overflow: hidden;
  }
  #rotate {
    position: fixed; inset: 0; z-index: 40; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 10px;
    background: rgba(4,5,9,.88); color: #cfd8ff; font-size: 16px; letter-spacing: 2px;
    pointer-events: none;
  }
  #rotate .r { font-size: 42px; animation: spin 2.4s ease-in-out infinite; }
  @keyframes spin { 0%,100%{transform:rotate(0)} 50%{transform:rotate(90deg)} }
  @media (orientation: portrait) and (max-width: 860px) {
    #rotate { display: flex; }
  }

<script>
(function () {
  'use strict';

  // ======================================================================
  //  §1 基础工具
  // ======================================================================
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
  const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  const choose = (arr) => arr[(Math.random() * arr.length) | 0];
  const chance = (p) => Math.random() < p;
  const FONT = '"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif';
  const font = (size, weight) => `${weight || 600} ${size}px ${FONT}`;
  const pad2 = (n) => String(n).padStart(2, '0');
  const fmtTime = (s) => `${pad2(Math.floor(s / 60))}:${pad2(Math.floor(s % 60))}`;

  // 中文像素化：先以 1/k 尺寸绘制再最近邻放大，得到点阵质感（带黑色描边）
  const pixCache = new Map();
  function pixText(str, x, y, size, color, align, k) {
    const step = k || 3;
    const s = Math.max(5, Math.round(size / step));
    const key = str + '|' + s + '|' + color + '|' + step;
    let cv = pixCache.get(key);
    if (!cv) {
      const m = document.createElement('canvas');
      const mm = m.getContext('2d');
      mm.font = `900 ${s}px ${FONT}`;
      const w = Math.ceil(mm.measureText(str).width) + 3;
      m.width = Math.max(4, w);
      m.height = s + 5;
      const g = m.getContext('2d');
      g.font = `900 ${s}px ${FONT}`;
      g.textBaseline = 'top';
      g.fillStyle = '#05070b';
      g.fillText(str, 2, 2); g.fillText(str, 1, 2); g.fillText(str, 2, 1);
      g.fillStyle = color;
      g.fillText(str, 1, 1);
      cv = m;
      pixCache.set(key, cv);
    }
    const w = cv.width * step, h = cv.height * step;
    const dx = align === 'center' ? Math.round(x - w / 2) : align === 'right' ? Math.round(x - w) : Math.round(x);
    const prev = ctx.imageSmoothingEnabled;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(cv, 0, 0, cv.width, cv.height, dx, Math.round(y - cv.height * step * 0.82), w, h);
    ctx.imageSmoothingEnabled = prev;
    return w;
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const errBox = document.getElementById('err');
  const errLines = [];
  function showError(msg) {
    if (errLines.length > 8) errLines.shift();
    errLines.push(String(msg));
    errBox.textContent = errLines.join('\n');
    errBox.style.display = 'block';
  }
  window.addEventListener('error', (e) => showError(`[错误] ${e.message} @ ${e.lineno}:${e.colno}`));
  window.addEventListener('unhandledrejection', (e) => showError(`[Promise] ${e.reason && e.reason.message ? e.reason.message : e.reason}`));

  // ======================================================================
  //  §2 画布与视口
  // ======================================================================
  const canvas = document.getElementById('game');
  let ctx = canvas.getContext('2d', { alpha: false });
  const view = { w: 0, h: 0, dpr: 1, base: 1, scale: 1, viewW: 1280, viewH: 720, ox: 0, oy: 0, ui: 1 };
  const ZOOM = 1.0;

  function resize() {
    const cw = canvas.clientWidth || window.innerWidth;
    const ch = canvas.clientHeight || window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.floor(cw * dpr));
    canvas.height = Math.max(1, Math.floor(ch * dpr));
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    view.w = cw; view.h = ch; view.dpr = dpr;
    view.base = Math.min(cw / 1280, ch / 720);
    view.scale = view.base * ZOOM;
    view.viewW = cw / view.scale;
    view.viewH = ch / view.scale;
    view.ui = view.base;
    view.ox = (cw - 1280 * view.base) / 2;
    view.oy = (ch - 720 * view.base) / 2;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 80));
  resize();

  function toUI(x, y) { return { x: (x - view.ox) / view.ui, y: (y - view.oy) / view.ui }; }

  // ======================================================================
  //  §3 存档
  // ======================================================================
  const SAVE_KEY = 'abyss_echo_save_v1';
  const META_IDS = ['vit', 'pow', 'agi', 'psi', 'armor', 'crit', 'magnet', 'purse', 'luck', 'reroll', 'shopdisc', 'revive'];
  function defaultSave() {
    const meta = {};
    for (const k of META_IDS) meta[k] = 0;
    return { gold: 0, meta, threat: 0, bestFloor: 1, runs: 0, kills: 0, wins: 0, bestTime: 0, sound: true, music: true, aimAssist: true, echoBlade: false };
  }
  function loadSave() {
    const d = defaultSave();
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return d;
      const s = JSON.parse(raw);
      if (!s || typeof s !== 'object') return d;
      d.gold = Math.max(0, Number(s.gold) || 0);
      d.threat = Math.max(0, Number(s.threat) || 0);
      d.bestFloor = clamp(Number(s.bestFloor) || 1, 1, 6);
      d.runs = Math.max(0, Number(s.runs) || 0);
      d.kills = Math.max(0, Number(s.kills) || 0);
      d.wins = Math.max(0, Number(s.wins) || 0);
      d.bestTime = Math.max(0, Number(s.bestTime) || 0);
      // 旧版 upgrades 迁移
      const src = s.meta || s.upgrades;
      if (src) for (const k of META_IDS) d.meta[k] = clamp(Math.floor(Number(src[k]) || 0), 0, 5);
      if (typeof s.sound === 'boolean') d.sound = s.sound;
      if (typeof s.music === 'boolean') d.music = s.music;
      if (typeof s.aimAssist === 'boolean') d.aimAssist = s.aimAssist;
      if (typeof s.echoBlade === 'boolean') d.echoBlade = s.echoBlade;
    } catch (e) { /* 存档损坏回退默认 */ }
    return d;
  }
  let save = loadSave();
  function writeSave() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* 隐私模式忽略 */ }
  }

  // ======================================================================
  //  §4 WebAudio 程序化音频
  // ======================================================================
  const Sound = {
    ctx: null, master: null, sfx: null, mus: null, noiseBuf: null,
    ready: false, lastPlay: Object.create(null),
    init() {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        this.ctx = new AC();
        const c = this.ctx;
        this.master = c.createGain(); this.master.gain.value = 0.9;
        const comp = c.createDynamicsCompressor();
        comp.threshold.value = -16; comp.knee.value = 18; comp.ratio.value = 5;
        comp.attack.value = 0.004; comp.release.value = 0.18;
        this.sfx = c.createGain(); this.sfx.gain.value = 0.5;
        this.mus = c.createGain(); this.mus.gain.value = 0.13;
        this.sfx.connect(comp); this.mus.connect(comp);
        comp.connect(this.master); this.master.connect(c.destination);
        const len = c.sampleRate;
        const buf = c.createBuffer(1, len, c.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        this.noiseBuf = buf;
        this.ready = true;
      } catch (e) { console.warn('audio init failed', e); }
    },
    unlock() { this.init(); },
    muted() { return !save.sound; },
    tone(type, f0, f1, dur, vol, delay) {
      if (!this.ready || this.muted()) return;
      const c = this.ctx, t0 = c.currentTime + (delay || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(Math.max(20, f0), t0);
      if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + Math.min(0.012, dur * 0.2));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(this.sfx);
      o.start(t0); o.stop(t0 + dur + 0.03);
    },
    noise(dur, vol, freq, type, q, delay) {
      if (!this.ready || this.muted()) return;
      const c = this.ctx, t0 = c.currentTime + (delay || 0);
      const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
      const f = c.createBiquadFilter(); f.type = type || 'lowpass';
      f.frequency.setValueAtTime(freq || 1200, t0);
      f.Q.value = q == null ? 0.9 : q;
      const g = c.createGain();
      g.gain.setValueAtTime(Math.max(0.0002, vol), t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(this.sfx);
      src.start(t0); src.stop(t0 + dur + 0.03);
    },
    play(name) {
      if (!this.ready || this.muted()) return;
      const now = this.ctx.currentTime;
      const gap = { hit: 0.035, crit: 0.05, pickup: 0.05, hurt: 0.12, flame: 0.12, laser: 0 }[name] || 0.02;
      if (gap && this.lastPlay[name] && now - this.lastPlay[name] < gap) return;
      this.lastPlay[name] = now;
      switch (name) {
        case 'pistol': this.tone('square', 640, 240, 0.07, 0.16); this.noise(0.04, 0.1, 2600, 'highpass'); break;
        case 'smg': this.tone('square', 520, 300, 0.045, 0.09); this.noise(0.03, 0.06, 3000, 'highpass'); break;
        case 'shotgun': this.noise(0.16, 0.3, 1200, 'lowpass'); this.tone('sine', 90, 45, 0.16, 0.2); break;
        case 'pierce': this.tone('sawtooth', 900, 300, 0.1, 0.1); this.noise(0.06, 0.08, 2200); break;
        case 'bounce': this.tone('triangle', 780, 420, 0.08, 0.12); break;
        case 'laser': this.tone('sawtooth', 190, 175, 0.09, 0.045); this.tone('square', 760, 700, 0.07, 0.018); break;
        case 'chain': this.tone('square', 1100, 500, 0.08, 0.06); this.noise(0.05, 0.05, 4200, 'bandpass', 2); break;
        case 'charge': this.tone('sine', 120, 480, 0.7, 0.06); break;
        case 'launch': this.tone('square', 240, 90, 0.16, 0.15); this.noise(0.12, 0.12, 700); break;
        case 'rail': this.noise(0.34, 0.24, 2200, 'bandpass', 0.7); this.tone('sawtooth', 1400, 120, 0.3, 0.13); break;
        case 'ice': this.tone('triangle', 1200, 700, 0.08, 0.07); break;
        case 'flame': this.noise(0.1, 0.06, 800, 'bandpass'); break;
        case 'saw': this.tone('sawtooth', 300, 520, 0.2, 0.06); break;
        case 'melee': this.noise(0.09, 0.16, 1400, 'bandpass', 1.4); this.tone('triangle', 420, 180, 0.1, 0.08); break;
        case 'explode': this.noise(0.36, 0.32, 700, 'lowpass'); this.tone('sine', 70, 32, 0.32, 0.22); break;
        case 'hit': this.noise(0.045, 0.16, 1800, 'highpass', 1.2); break;
        case 'crit': this.noise(0.05, 0.16, 2400, 'highpass'); this.tone('sine', 1800, 1700, 0.1, 0.1); break;
        case 'kill': this.tone('square', 300, 70, 0.2, 0.13); this.noise(0.16, 0.11, 900); break;
        case 'hurt': this.tone('sawtooth', 170, 60, 0.24, 0.2); this.noise(0.2, 0.14, 600); break;
        case 'pickup': this.tone('sine', 880, 880, 0.06, 0.09); this.tone('sine', 1320, 1320, 0.08, 0.08, 0.055); break;
        case 'heal': this.tone('sine', 520, 780, 0.18, 0.09); break;
        case 'door': this.tone('sine', 100, 55, 0.4, 0.15); this.noise(0.3, 0.09, 420, 'lowpass'); break;
        case 'skill': this.tone('triangle', 280, 640, 0.22, 0.11); break;
        case 'shield': this.tone('sine', 420, 620, 0.3, 0.09); break;
        case 'bossin': this.tone('sawtooth', 55, 120, 1.2, 0.18); this.noise(1.0, 0.12, 300, 'lowpass'); break;
        case 'portal': this.tone('sine', 300, 900, 0.6, 0.09); break;
        case 'ui': this.tone('sine', 720, 760, 0.05, 0.07); break;
        case 'deny': this.tone('square', 180, 120, 0.09, 0.07); break;
        case 'win': [523, 659, 784, 1047].forEach((f, i) => this.tone('triangle', f, f, 0.3, 0.09, i * 0.12)); break;
        case 'dead': this.tone('sawtooth', 220, 55, 1.0, 0.16); this.noise(0.8, 0.09, 400); break;
      }
    },
    music: { on: false, next: 0, step: 0, mode: 'floor', tempo: 0.36, root: 110 },
    setMusic(mode) {
      const m = this.music;
      m.mode = mode;
      if (mode === 'boss') { m.tempo = 0.195; m.root = 92.5; }
      else if (mode === 'f2') { m.tempo = 0.33; m.root = 98; }
      else if (mode === 'f3') { m.tempo = 0.31; m.root = 87.3; }
      else if (mode === 'f4') { m.tempo = 0.29; m.root = 77.8; }
      else if (mode === 'f5') { m.tempo = 0.27; m.root = 73.4; }
      else if (mode === 'secret') { m.tempo = 0.26; m.root = 69.3; }
      else if (mode === 'title') { m.tempo = 0.44; m.root = 110; }
      else { m.tempo = 0.36; m.root = 110; }
      m.next = 0; m.step = 0; m.on = true;
    },
    stopMusic() { this.music.on = false; },
    tickMusic() {
      const m = this.music;
      if (!this.ready || !m.on || !save.music || !save.sound) return;
      const c = this.ctx, t = c.currentTime;
      if (m.next < t) m.next = t + 0.05;
      const scale = [0, 3, 5, 7, 10, 12, 15];
      while (m.next < t + 0.22) {
        const s = m.step, at = m.next;
        const bassN = [0, 0, -2, 0, 3, 3, -2, -5][Math.floor(s / 2) % 8];
        if (s % 4 === 0) {
          this.tone('triangle', m.root * Math.pow(2, bassN / 12), m.root * Math.pow(2, bassN / 12), 0.42, 0.09);
          this.tone('sine', m.root * 0.5, m.root * 0.5, 0.5, 0.07);
        }
        if (s % 2 === 0) {
          const n = scale[(s * 3 + Math.floor(s / 8)) % scale.length];
          this.tone('triangle', m.root * 2 * Math.pow(2, n / 12), m.root * 2 * Math.pow(2, n / 12), 0.18, 0.022);
        }
        if (m.mode === 'boss' && s % 2 === 1) {
          const f = m.root * 2 * Math.pow(2, scale[(s * 5) % scale.length] / 12);
          this.tone('square', f, f, 0.07, 0.011);
        }
        if (s % 2 === 1) this.noise(0.03, 0.007, 6000, 'highpass', 1.2);
        m.next += m.tempo;
        m.step++;
      }
    }
  };

  // ======================================================================

  const OPP = { N: 'S', S: 'N', W: 'E', E: 'W' };

  const Input = {
    keys: Object.create(null), mouse: { x: 640, y: 360, down: false, px: 640, py: 360 },
    moveStick: { on: false, id: null, bx: 0, by: 0, x: 0, y: 0, dx: 0, dy: 0, mag: 0 },
    aimStick: { on: false, id: null, bx: 0, by: 0, x: 0, y: 0, dx: 0, dy: 0, mag: 0 },
    aimAngle: 0, firing: false, autoFire: false, touchMode: false,
    hot: [], hover: null
  };

  function uiPoint(e) {
    const r = canvas.getBoundingClientRect();
    const cx = e.clientX - r.left, cy = e.clientY - r.top;
    const p = toUI(cx, cy);
    p.cx = cx; p.cy = cy;
    return p;
  }
  function screenToWorld(cx, cy) {
    return {
      x: G.cam.x - view.viewW / 2 + cx / view.scale,
      y: G.cam.y - view.viewH / 2 + cy / view.scale
    };
  }
  function hitHot(x, y) {
    for (let i = Input.hot.length - 1; i >= 0; i--) {
      const b = Input.hot[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
    }
    return null;
  }
  function addHot(id, x, y, w, h) { const b = { id, x, y, w, h }; Input.hot.push(b); return b; }

  function ptrDown(e) {
    Sound.unlock();
    const p = uiPoint(e);
    if (G.state !== 'playing') {
      const b = hitHot(p.x, p.y);
      if (b) { Sound.play('ui'); uiAction(b.id); }
      return;
    }
    const b = hitHot(p.x, p.y);
    if (b) { Sound.play('ui'); uiAction(b.id); return; }
    if (e.pointerType === 'mouse') {
      Input.mouse.down = true; Input.mouse.x = p.cx; Input.mouse.y = p.cy; return;
    }
    Input.touchMode = true;
    const s = p.x < 600 ? Input.moveStick : Input.aimStick;
    if (!s.on) {
      s.on = true; s.id = e.pointerId; s.bx = p.cx; s.by = p.cy;
      s.x = p.cx; s.y = p.cy; s.dx = 0; s.dy = 0; s.mag = 0;
    }
    e.preventDefault();
  }
  function ptrMove(e) {
    const p = uiPoint(e);
    if (e.pointerType === 'mouse') {
      Input.mouse.x = p.cx; Input.mouse.y = p.cy;
      if (e.buttons === 0) Input.mouse.down = false;
    }
    for (const s of [Input.moveStick, Input.aimStick]) {
      if (!s.on || s.id !== e.pointerId) continue;
      s.x = p.cx; s.y = p.cy;
      let dx = s.x - s.bx, dy = s.y - s.by;
      const m = Math.hypot(dx, dy);
      const R = 70;
      if (m > R) { s.bx += (dx / m) * (m - R); s.by += (dy / m) * (m - R); dx = s.x - s.bx; dy = s.y - s.by; }
      s.mag = clamp(Math.hypot(dx, dy) / R, 0, 1);
      s.dx = m > 0.001 ? dx / Math.max(1, Math.hypot(dx, dy)) : 0;
      s.dy = m > 0.001 ? dy / Math.max(1, Math.hypot(dx, dy)) : 0;
    }
    const a = Input.aimStick;
    if (a.on && a.mag > 0.15) Input.aimAngle = Math.atan2(a.dy, a.dx);
    if (e.pointerType !== 'mouse') e.preventDefault();
  }
  function ptrUp(e) {
    if (e.pointerType === 'mouse') Input.mouse.down = false;
    if (Input.moveStick.on && Input.moveStick.id === e.pointerId) {
      Input.moveStick.on = false; Input.moveStick.id = null; Input.moveStick.mag = 0;
    }
    if (Input.aimStick.on && Input.aimStick.id === e.pointerId) {
      Input.aimStick.on = false; Input.aimStick.id = null; Input.aimStick.mag = 0;
    }
  }
  canvas.addEventListener('pointerdown', ptrDown);
  canvas.addEventListener('pointermove', ptrMove);
  canvas.addEventListener('pointerup', ptrUp);
  canvas.addEventListener('pointercancel', ptrUp);
  canvas.addEventListener('pointerleave', ptrUp);

  // 移动端：禁用长按菜单 / 双击缩放 / 双指捏合缩放，避免干扰摇杆操作
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('gesturechange', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('wheel', (e) => {
    if (G.state === 'playing') { swapWeapon(); e.preventDefault(); }
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (Input.keys[k]) { if (k === ' ' || k.startsWith('arrow')) e.preventDefault(); return; }
    Input.keys[k] = true;
    Sound.unlock();
    if (G.state === 'playing') {
      if (k === 'q' || k === 'tab') swapWeapon();
      if (k === '1') switchSlot(0);
      if (k === '2') switchSlot(1);
      if (k === ' ') { e.preventDefault(); useSkill(); }
      if (k === 'f') { Input.autoFire = !Input.autoFire; toast(Input.autoFire ? '自动开火：开' : '自动开火：关'); }
      if (k === 'escape' || k === 'p') pauseGame();
      if (k === 'm') toggleSound();
    } else if (G.state === 'title') {
      if (k === 'enter') { Sound.play('ui'); G.state = 'charsel'; }
    } else if (G.state === 'dead' || G.state === 'victory') {
      if (k === 'enter' || k === 'escape') { Sound.play('ui'); G.state = 'title'; Sound.setMusic('title'); }
    } else if (G.state === 'paused') {
      if (k === 'escape' || k === 'p') resumeGame();
    } else if (G.state === 'event' || G.state === 'reward') {
      if (k === 'escape') closeOverlay();
    }
    if (k === ' ' || k.startsWith('arrow')) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { Input.keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => {
    Input.keys = Object.create(null);
    Input.mouse.down = false;
    Input.moveStick.on = false; Input.aimStick.on = false;
    if (G.state === 'playing') pauseGame();
  });

  // ======================================================================
  //  §15 效果辅助
  // ======================================================================
  function shake(v) { if (G.run) G.run.trauma = clamp(G.run.trauma + v, 0, 1); }
  function hitstop(t) { G.hitstop = Math.max(G.hitstop, t); }
  function burst(x, y, color, n, spd, size, life) {
    const run = G.run; if (!run) return;
    for (let i = 0; i < n; i++) {
      if (run.particles.length >= MAX_PARTICLES) run.particles.shift();
      const a = rand(0, TAU), s = rand(spd * 0.35, spd);
      run.particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: rand(life * 0.6, life), max: life, color, size: rand(size * 0.5, size), type: 'spark'
      });
    }
  }
  function addText(x, y, str, color, size) {
    const run = G.run; if (!run) return;
    if (run.texts.length > 40) run.texts.shift();
    run.texts.push({ x: x + rand(-6, 6), y, text: str, color, size: size || 14, life: 0.62, t: 0.62, vy: -52 });
  }
  function toast(msg) {
    G.toast = { text: msg, t: 1.8 };
  }

  // ======================================================================
  //  §16 地牢生成
  // ======================================================================
  function generateDungeon(floorIdx, seed) {
    const cfg = FLOORS[floorIdx];
    const rf = mulberry32((seed ^ cfg.seedBase) >>> 0);
    const map = new Map();
    const rooms = [];
    const key = (x, y) => x + ',' + y;
    const add = (x, y) => {
      const r = {
        x, y, key: key(x, y), type: 'normal', doors: Object.create(null),
        visited: false, cleared: false, seed: Math.floor(rf() * 1e9), dist: 0
      };
      map.set(r.key, r); rooms.push(r); return r;
    };
    const startRoom = add(cfg.cols >> 1, cfg.rows >> 1);
    let guard = 0;
    while (rooms.length < cfg.rooms && guard++ < 6000) {
      const base = rooms[(rf() * rooms.length) | 0];
      const d = DIRS[(rf() * 4) | 0];
      const nx = base.x + d.x, ny = base.y + d.y;
      if (nx < 0 || ny < 0 || nx >= cfg.cols || ny >= cfg.rows) continue;
      if (map.has(key(nx, ny))) continue;
      add(nx, ny);
    }
    for (const r of rooms) {
      for (const d of DIRS) {
        const n = map.get(key(r.x + d.x, r.y + d.y));
        if (n) { r.doors[d.id] = n; n.doors[OPP[d.id]] = r; }
      }
    }
    // BFS 距离
    const dq = [startRoom];
    startRoom.dist = 0;
    const seen = new Set([startRoom.key]);
    while (dq.length) {
      const c = dq.shift();
      for (const id in c.doors) {
        const n = c.doors[id];
        if (seen.has(n.key)) continue;
        seen.add(n.key); n.dist = c.dist + 1; dq.push(n);
      }
    }
    // 最远点 = Boss
    let bossRoom = startRoom;
    for (const r of rooms) if (r.dist > bossRoom.dist) bossRoom = r;
    bossRoom.type = 'boss';
    startRoom.type = 'start';
    // 特殊房：优先死胡同，按距离从远到近
    const specials = cfg.secret ? ['elite', 'treasure', 'treasure'] : ['elite', 'treasure', 'shop', 'event'];
    const cand = rooms.filter((r) => r !== startRoom && r !== bossRoom);
    const dead = cand.filter((r) => Object.keys(r.doors).length === 1).sort((a, b) => b.dist - a.dist);
    const rest = cand.filter((r) => Object.keys(r.doors).length > 1).sort((a, b) => b.dist - a.dist);
    const order = dead.concat(rest);
    specials.forEach((t, i) => { if (order[i]) order[i].type = t; });
    return { floor: floorIdx, cfg, rooms, map, startRoom, bossRoom, seed };
  }

  function buildObstacles(room, cfg, rfSeed) {
    const rf = mulberry32((rfSeed ^ 0x9e3779b9) >>> 0);
    const obs = [];
    if (room.type === 'boss') return obs;
    const n = room.type === 'treasure' || room.type === 'shop' || room.type === 'event' ? 2 : randInt(1, 3);
    for (let i = 0; i < n; i++) {
      for (let tries = 0; tries < 24; tries++) {
        const w = randInt(50, 120), h = randInt(50, 120);
        const x = 170 + rf() * (ROOM_W - 340 - w);
        const y = 150 + rf() * (ROOM_H - 300 - h);
        const cx = x + w / 2, cy = y + h / 2;
        if (dist(cx, cy, 640, 360) < 190) continue;
        if (Math.abs(cx - 640) < DOOR_GAP && (cy < 190 || cy > ROOM_H - 190)) continue;
        if (Math.abs(cy - 360) < DOOR_GAP && (cx < 190 || cx > ROOM_W - 190)) continue;
        let bad = false;
        for (const o of obs) if (Math.abs(o.x + o.w / 2 - cx) < (o.w + w) / 2 + 40 && Math.abs(o.y + o.h / 2 - cy) < (o.h + h) / 2 + 40) bad = true;
        if (bad) continue;
        obs.push({ x, y, w, h, kind: rf() < 0.5 ? 'crate' : 'pillar' });
        break;
      }
    }
    return obs;
  }

  // ======================================================================
  //  §17 游戏状态 / 单局
  // ======================================================================
  const G = {
    state: 'title', time: 0, run: null, hitstop: 0, cam: { x: 640, y: 360 },
    selectedChar: 0, selectedWeapon: null, toast: null, banner: null, fade: 1,
    deadT: 0, fps: 60, uiScroll: 0, lastState: 'title', metaSel: 0,
    reward: null, event: null, shop: null, rewardRerolled: false, confirmRestart: false
  };
  let nextSeed = (Date.now() % 100000) | 0;

  function metaStats() {
    const m = save.meta;
    return {
      hp: 120 + m.vit * 12,
      dmg: 1 + m.pow * 0.06,
      speed: 1 + m.agi * 0.04,
      energy: 100 + m.psi * 15,
      regen: 18 + m.psi * 1.5,
      armor: m.armor * 0.05,
      crit: 0.05 + m.crit * 0.04,
      magnet: 110 + m.magnet * 40,
      gold: m.purse * 30,
      disc: [1, 0.9, 0.8][m.shopdisc] || 1
    };
  }

  function relicMods(run) {
    const m = {
      dmg: 0, atkSpeed: 0, moveSpeed: 0, maxHp: 0, crit: 0, critMul: 0, armor: 0,
      magnet: 0, maxEnergy: 0, regen: 0, gold: 0, cd: 0, pierce: 0, bounce: 0,
      explodeR: 0, explodeDmg: 0, bulletSpeed: 0, range: 0, farDmg: 0, meleeSpeed: 0,
      summonDmg: 0, summonLimit: 0, lifesteal: 0, iframe: 0, slowHit: 0, extraShot: 0
    };
    for (const rid of run.relicIds) {
      const r = RELIC_MAP[rid];
      if (!r || !r.mods) continue;
      for (const k in r.mods) m[k] = (m[k] || 0) + r.mods[k];
    }
    if (hasRelic(run, 'echoheart')) m.dmg += 0.02 * Math.max(0, run.relicIds.length - 1);
    return m;
  }
  function hasRelic(run, id) { return run && run.relicIds.indexOf(id) >= 0; }

  function startRun(charIdx) {
    const ch = CHARACTERS[charIdx];
    const st = metaStats();
    const run = {
      char: ch, charIdx,
      floor: 0, dungeon: null, room: null, rooms: null,
      maxHp: Math.round(st.hp * (ch.hp / 120)), hp: 0,
      maxEnergy: Math.round(st.energy * (ch.energy / 100)), energy: 0,
      speedBase: ch.speed * st.speed, dmgMul: st.dmg, armor: st.armor, crit: st.crit,
      critMul: 1.8, magnetBase: st.magnet, magnet: st.magnet,
      relicIds: [], mods: null,
      weapons: [ch.weapon, null], slot: 0, cooldown: 0, switchCd: 0,
      combo: 0, comboT: 0, skillCd: 0, skillT: 0,
      coins: 0, kills: 0, time: 0, shards: 0, revives: save.meta.revive ? 1 : 0,
      undying: false, rerolls: save.meta.reroll ? 1 : 0,
      temp: { dmg: 0, atkSpeed: 0, moveSpeed: 0, armor: 0, until: -1 },
      trauma: 0, redFlash: 0, healFlash: 0, invuln: 0, stealth: 0, hurtCd: 0,
      player: { x: 640, y: 560, vx: 0, vy: 0, ang: -Math.PI / 2, r: PLAYER_R, dashT: 0, dashX: 0, dashY: 0 },
      enemies: [], bullets: [], ebullets: [], pickups: [], particles: [], texts: [],
      effects: [], turrets: [], hazards: [], boss: null,
      beam: null, flame: null, charge: 0, charging: false, shotCount: 0,
      shield: 0, whirlT: 0, whirlTick: 0, healFieldT: 0,
      waveTotal: 0, waveLeft: 0, waveTimer: 0, spawnQueue: [],
      portal: null, chest: null, shopItems: null, eventData: null, echoPortal: null,
      roomEnterT: 0, roomClearT: 0, killstreak: 0, lastRoom: null,
      shardBonus: 0, bestFloor: 1, seenRooms: {},
      stats: { shots: 0, hits: 0, dmg: 0 }
    };
    run.maxHp = Math.round(run.maxHp);
    run.hp = run.maxHp;
    run.maxEnergy = Math.round(run.maxEnergy);
    run.energy = run.maxEnergy;
    run.mods = relicMods(run);
    run.coins = st.gold;
    G.run = run;
    G.selectedChar = charIdx;
    G.state = 'playing';
    G.fade = 1;
    save.runs++;
    writeSave();
    startFloor(0);
  }

  function startFloor(idx) {
    const run = G.run;
    run.floor = idx;
    run.dungeon = generateDungeon(idx, nextSeed + idx * 7919);
    run.rooms = run.dungeon.rooms;
    run.shardBonus = 0;
    Sound.setMusic(FLOORS[idx].music);
    G.banner = { title: `第 ${idx + 1} 层 · ${FLOORS[idx].name}`, sub: FLOORS[idx].sub, t: 2.8 };
    enterRoom(run.dungeon.startRoom, null, true);
  }

  function roomCenter() { return { x: ROOM_W / 2, y: ROOM_H / 2 }; }

  function enterRoom(room, fromDir, first) {
    const run = G.run;
    run.room = room;
    room.visited = true;
    const cfg = FLOORS[run.floor];
    room.obstacles = buildObstacles(room, cfg, room.seed);
    run.enemies.length = 0; run.bullets.length = 0; run.ebullets.length = 0;
    run.pickups.length = 0; run.particles.length = 0; run.texts.length = 0;
    run.effects.length = 0; run.turrets.length = 0; run.hazards.length = 0;
    run.boss = null; run.portal = null; run.chest = null; run.shopItems = null;
    run.eventData = null; run.echoPortal = null; run.beam = null; run.flame = null;
    if (room.portal) run.portal = room.portal;
    run.charge = 0; run.charging = false; run.roomEnterT = 1.6; run.waveTimer = 0;
    run.waveTotal = 0; run.waveLeft = 0; run.spawnQueue.length = 0;
    // 玩家入场位置
    const p = run.player;
    p.vx = 0; p.vy = 0;
    if (!fromDir) { p.x = 640; p.y = 560; p.ang = -Math.PI / 2; }
    else if (fromDir === 'N') { p.x = 640; p.y = 120; p.ang = Math.PI / 2; }
    else if (fromDir === 'S') { p.x = 640; p.y = ROOM_H - 120; p.ang = -Math.PI / 2; }
    else if (fromDir === 'W') { p.x = 120; p.y = 360; p.ang = 0; }
    else { p.x = ROOM_W - 120; p.y = 360; p.ang = Math.PI; }
    run.invuln = Math.max(run.invuln, 0.6);
    G.cam.x = clamp(p.x, view.viewW / 2, ROOM_W - view.viewW / 2);
    G.cam.y = clamp(p.y, view.viewH / 2, ROOM_H - view.viewH / 2);
    // 房间内容
    if (room.type === 'boss') {
      soundtrackBoss();
      run.boss = makeBoss(cfg.boss, room);
      Sound.play('bossin');
      G.banner = { title: BOSSES[cfg.boss].name, sub: BOSSES[cfg.boss].title, t: 2.2 };
    } else if (room.type === 'treasure') {
      if (!room.looted) { run.chest = { x: 640, y: 330, open: false }; }
      room.cleared = true;
    } else if (room.type === 'shop') {
      if (!room.shopStock) room.shopStock = rollShop(run.floor);
      spawnShop(room.shopStock);
      room.cleared = true;
    } else if (room.type === 'event') {
      if (!room.eventId) room.eventId = EVENTS[(Math.random() * EVENTS.length) | 0].id;
      run.eventData = { x: 640, y: 340, id: room.eventId, used: !!room.eventUsed };
      room.cleared = true;
    } else if (room.type === 'start') {
      room.cleared = true;
      spawnStartItems();
    } else if (room.type === 'elite') {
      setupWaves(room, true);
    } else {
      setupWaves(room, false);
    }
    if (room.cleared) unlockDoors(room);
    // 宝箱直觉 / 命运骰子等进房触发
    if (hasRelic(run, 'dice')) rollDiceBuff();
    run.roomEnterT = first ? 1.2 : 0.5;
  }

  function soundtrackBoss() { Sound.setMusic('boss'); }

  function spawnStartItems() {
    const run = G.run;
    // 起点房给一点回复与金币
    addPickup(620, 300, 'hp');
    addPickup(660, 300, 'energy');
    addPickup(640, 250, 'gold', 8);
  }

  function setupWaves(room, elite) {
    const run = G.run;
    const f = run.floor;
    const base = f <= 1 ? 2 : f <= 3 ? 3 : 3;
    room.waveTotal = elite ? 1 : base;
    run.waveTotal = room.waveTotal;
    run.waveLeft = room.waveTotal;
    run.waveTimer = 0.5;
    room.waves = run.waveTotal;
    room.elite = elite;
  }

  function spawnWave(room) {
    const run = G.run;
    const cfg = FLOORS[run.floor];
    const pool = cfg.pool;
    const p = run.player;
    const isElite = room.elite && run.waveLeft === room.waveTotal;
    const count = isElite ? randInt(2, 3) : (run.floor === 0 ? randInt(3, 4) : randInt(3, 6));
    let ranged = false;
    for (let i = 0; i < count; i++) {
      for (let tries = 0; tries < 24; tries++) {
        const x = rand(120, ROOM_W - 120), y = rand(110, ROOM_H - 110);
        if (dist(x, y, p.x, p.y) < 210) continue;
        if (insideObstacle(run.room.obstacles, x, y, 22)) continue;
        let type = choose(pool);
        if (!ranged && i === count - 1) {
          const rs = pool.filter((t) => ENEMIES[t].shot);
          if (rs.length) { type = choose(rs); ranged = true; }
        }
        spawnEnemy(type, x, y, false);
        break;
      }
    }
    if (isElite) {
      for (let tries = 0; tries < 20; tries++) {
        const x = rand(200, ROOM_W - 200), y = rand(160, ROOM_H - 160);
        if (dist(x, y, p.x, p.y) < 260) continue;
        const type = choose(pool.filter((t) => ENEMIES[t].ai !== 'stationary') || pool);
        const e = spawnEnemy(type, x, y, true);
        if (e) break;
      }
    }
  }

  function spawnShop(stock) {
    const run = G.run;
    run.shopItems = stock.map((s, i) => ({
      x: 300 + i * 226, y: 330, kind: s.kind, id: s.id, price: s.price, sold: false
    }));
  }

  function rollShop(floorIdx) {
    const cfg = FLOORS[floorIdx];
    const disc = metaStats().disc;
    const scal = Math.pow(1.3, floorIdx);
    const items = [];
    const used = new Set();
    while (items.length < 2) {
      const id = choose(cfg.shopPool);
      if (used.has(id)) continue;
      used.add(id);
      items.push({ kind: 'weapon', id, price: Math.round(45 * scal * disc) });
    }
    const relicPool = RELICS.filter((r) => r.rar <= (floorIdx >= 3 ? 2 : 1));
    const r1 = choose(relicPool);
    items.push({ kind: 'relic', id: r1.id, price: Math.round(70 * scal * disc) });
    items.push({ kind: 'heal', id: 'heal', price: Math.round(35 * scal * disc) });
    return items;
  }

  function addPickup(x, y, type, val, extra) {
    const run = G.run;
    const it = { x, y, type, val: val || 0, t: 0, vx: rand(-60, 60), vy: rand(-60, 60) };
    if (extra) Object.assign(it, extra);
    run.pickups.push(it);
    return it;
  }

  function unlockDoors(room) {
    room.cleared = true;
    if (room === runSafe().room && room.type !== 'boss') {
      Sound.play('door');
      G.banner = G.banner || null;
    }
  }
  function runSafe() { return G.run || {}; }

  function checkRoomClear() {
    const run = G.run; if (!run || !run.room) return;
    const room = run.room;
    if (room.cleared) return;
    if (run.enemies.length === 0 && run.waveLeft <= 0 && !run.boss) {
      room.cleared = true;
      Sound.play('door');
      onRoomCleared(room);
    }
  }

  function onRoomCleared(room) {
    const run = G.run;
    run.roomClearT = 1;
    if (hasRelic(run, 'hourglass')) run.hourglassT = 5;
    const n = randInt(6, 14) + run.floor * 3;
    for (let i = 0; i < 3; i++) addPickup(640 + rand(-120, 120), 300 + rand(-90, 90), 'gold', Math.ceil(n / 3));
    if (chance(0.55)) addPickup(640 + rand(-140, 140), 360 + rand(-80, 80), 'energy');
    if (chance(0.35)) addPickup(640 + rand(-140, 140), 360 + rand(-80, 80), 'hp');
    if (chance(0.15)) {
      const buffs = ['dmg', 'atkSpeed', 'moveSpeed', 'armor'];
      const b = choose(buffs);
      run.temp[b] = b === 'armor' ? 0.08 : 0.15;
      run.temp.until = run.floor;
      toast(`临时增益：${b === 'dmg' ? '火力' : b === 'atkSpeed' ? '急速' : b === 'moveSpeed' ? '轻身' : '坚韧'}药剂`);
    }
    if (room.type === 'elite' && !room.rewarded) {
      room.rewarded = true;
      addPickup(640, 330, 'relic');
    }
  }

  function checkDoorExit() {
    const run = G.run; if (!run || !run.room || !run.room.cleared) return;
    const p = run.player;
    const room = run.room;
    let side = null;
    if (p.y < WALL + 26 && Math.abs(p.x - 640) < DOOR_GAP / 2 - 10) side = 'N';
    else if (p.y > ROOM_H - WALL - 26 && Math.abs(p.x - 640) < DOOR_GAP / 2 - 10) side = 'S';
    else if (p.x < WALL + 26 && Math.abs(p.y - 360) < DOOR_GAP / 2 - 10) side = 'W';
    else if (p.x > ROOM_W - WALL - 26 && Math.abs(p.y - 360) < DOOR_GAP / 2 - 10) side = 'E';
    if (!side) return;
    const next = room.doors[side];
    if (!next) { p.x = clamp(p.x, WALL + PLAYER_R + 4, ROOM_W - WALL - PLAYER_R - 4); p.y = clamp(p.y, WALL + PLAYER_R + 4, ROOM_H - WALL - PLAYER_R - 4); return; }
    if (next.type === 'boss' && room.type !== 'boss') {
      // 允许进入 Boss 房
    }
    enterRoom(next, side, false);
  }

  function enterPortal() {
    const run = G.run;
    if (!run || !run.portal) return;
    const p = run.player;
    if (dist(p.x, p.y, run.portal.x, run.portal.y) > 46) return;
    if (run.portal.kind === 'echo') {
      run.portal = null;
      run.boss = makeBoss('echo', run.room);
      run.room.type = 'boss';
      run.room.cleared = false;
      Sound.play('bossin');
      Sound.setMusic('boss');
      G.banner = { title: BOSSES.echo.name, sub: BOSSES.echo.title, t: 2.4 };
      return;
    }
    if (run.portal.kind === 'end') { run.portal = null; victory(); return; }
    if (run.floor >= FLOORS.length - 1) { victory(); return; }
    const heal = Math.round(run.maxHp * 0.25);
    run.hp = Math.min(run.maxHp, run.hp + heal);
    startFloor(run.floor + 1);
  }

  // 房间内障碍碰撞
  function insideObstacle(obs, x, y, r) {
    for (const o of obs) {
      if (x + r > o.x && x - r < o.x + o.w && y + r > o.y && y - r < o.y + o.h) return true;
    }
    return false;
  }
  function resolveObstacles(ent, obs, r) {
    for (const o of obs) {
      const cx = clamp(ent.x, o.x, o.x + o.w), cy = clamp(ent.y, o.y, o.y + o.h);
      const dx = ent.x - cx, dy = ent.y - cy;
      const d = Math.hypot(dx, dy);
      if (d < r) {
        if (d < 0.001) { ent.y = o.y - r; continue; }
        ent.x = cx + (dx / d) * r;
        ent.y = cy + (dy / d) * r;
      }
    }
  }
  function resolveWalls(ent, r) {
    ent.x = clamp(ent.x, WALL + r, ROOM_W - WALL - r);
    ent.y = clamp(ent.y, WALL + r, ROOM_H - WALL - r);
  }

  // ======================================================================
  //  §18 玩家
  // ======================================================================
  function curWeapon() {
    const run = G.run;
    if (!run) return null;
    const id = run.weapons[run.slot];
    return id ? WEAPONS[id] : null;
  }
  function switchSlot(i) {
    const run = G.run;
    if (!run || !run.weapons[i] || run.slot === i) return;
    run.slot = i; run.switchCd = 0.22; run.charging = false; run.charge = 0;
    Sound.play('ui');
  }
  function swapWeapon() {
    const run = G.run; if (!run) return;
    const other = run.slot === 0 ? 1 : 0;
    if (!run.weapons[other]) { toast('另一武器槽为空'); Sound.play('deny'); return; }
    switchSlot(other);
  }

  function moveSpeedMul() {
    const run = G.run;
    let m = 1 + run.mods.moveSpeed + run.temp.moveSpeed;
    if (run.char.passive === 'turretBoost' && run.turrets.some((t) => t.kind === 'turret')) m += 0.08;
    if (run.char.passive === 'comboSpeed') m += Math.min(0.2, run.combo * 0.02);
    return m;
  }

  function atkMul(w) {
    const run = G.run;
    let m = 1 + run.mods.atkSpeed + run.temp.atkSpeed;
    if (w && w.fam === 'melee' && run.mods.meleeSpeed) m += run.mods.meleeSpeed;
    if (hasRelic(run, 'bloodmoon') && run.hp < run.maxHp * 0.4) m *= 1.25;
    if (run.hourglassT > 0) m *= 1.4;
    if (run.healFieldT > 0) m *= 1.25;
    return m;
  }

  function damageMul(enemy, base, opts) {
    const run = G.run;
    let d = base * run.dmgMul * (1 + run.mods.dmg + run.temp.dmg);
    if (hasRelic(run, 'overflow') && run.energy >= run.maxEnergy * 0.8) d *= 1.25;
    if (hasRelic(run, 'bloodmoon') && run.hp < run.maxHp * 0.4) d *= 1.35;
    if (run.echoStacks) d *= 1 + 0.2 * run.echoStacks;
    if (run.meltStacks) d *= 1 + 0.01 * run.meltStacks;
    if (run.char.passive === 'longRange' && enemy && dist(run.player.x, run.player.y, enemy.x, enemy.y) > 320) d *= 1.35;
    if (hasRelic(run, 'scope') && enemy && dist(run.player.x, run.player.y, enemy.x, enemy.y) > 300) d *= 1.2;
    if (enemy && enemy.markT > 0) d *= 1.5;
    if (opts && opts.explode) d *= 1 + run.mods.explodeDmg;
    if (opts && opts.element) {
      if (hasRelic(run, 'furnace')) d *= 2;
      if (run.char.passive === 'burnStack' && opts.element === 'burn') d *= 1.5;
    }
    if (run.stealth > 0) d *= 1.3;
    return d;
  }

  function updatePlayer(dt) {
    const run = G.run, p = run.player, ch = run.char;
    if (!run || !p) return;
    run.invuln = Math.max(0, run.invuln - dt);
    run.stealth = Math.max(0, run.stealth - dt);
    run.hurtCd = Math.max(0, run.hurtCd - dt);
    run.skillCd = Math.max(0, run.skillCd - dt);
    run.switchCd = Math.max(0, run.switchCd - dt);
    run.comboT = Math.max(0, run.comboT - dt);
    if (run.comboT <= 0) run.combo = 0;
    if (run.echoT > 0) { run.echoT -= dt; if (run.echoT <= 0) run.echoStacks = 0; }
    if (run.hourglassT > 0) run.hourglassT -= dt;
    if (run.healFieldT > 0) run.healFieldT -= dt;
    if (run.meltT > 0) { run.meltT -= dt; if (run.meltT <= 0) run.meltStacks = 0; }
    // 被动：泉涌
    if (ch.passive === 'regenTick') {
      run.regenT = (run.regenT || 0) + dt;
      if (run.regenT >= 18) { run.regenT = 0; run.hp = Math.min(run.maxHp, run.hp + 12); addText(p.x, p.y - 26, '+12', '#69db7c', 13); }
    }
    if (hasRelic(run, 'resoshield')) {
      run.reshieldT = (run.reshieldT || 0) + dt;
      if (run.reshieldT >= 8) { run.reshieldT = 0; run.shield = (run.shield || 0) + 20; }
    }
    // 瞄准
    const aimStick = Input.aimStick;
    if (aimStick.on && aimStick.mag > 0.18) {
      p.ang = Math.atan2(aimStick.dy, aimStick.dx);
    } else if (!Input.touchMode) {
      const w = screenToWorld(Input.mouse.x, Input.mouse.y);
      p.ang = Math.atan2(w.y - p.y, w.x - p.x);
    }
    // 移动
    let mx = 0, my = 0;
    const k = Input.keys;
    if (k['a'] || k['arrowleft']) mx -= 1;
    if (k['d'] || k['arrowright']) mx += 1;
    if (k['w'] || k['arrowup']) my -= 1;
    if (k['s'] || k['arrowdown']) my += 1;
    if (Input.moveStick.on && Input.moveStick.mag > 0.08) {
      mx = Input.moveStick.dx * Input.moveStick.mag;
      my = Input.moveStick.dy * Input.moveStick.mag;
    }
    const ml = Math.hypot(mx, my);
    if (ml > 1) { mx /= ml; my /= ml; }
    const speed = run.speedBase * moveSpeedMul();
    if (p.dashT > 0) {
      p.dashT -= dt;
      p.x += p.dashX * 900 * dt;
      p.y += p.dashY * 900 * dt;
      if (chance(0.6)) burst(p.x, p.y, ch.color, 1, 40, 4, 0.25);
    } else {
      const targetVx = mx * speed, targetVy = my * speed;
      p.vx = lerp(p.vx, targetVx, 1 - Math.pow(0.001, dt));
      p.vy = lerp(p.vy, targetVy, 1 - Math.pow(0.001, dt));
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    // 碰撞
    const obs = run.room ? run.room.obstacles : [];
    resolveObstacles(p, obs, p.r);
    const cleared = run.room && run.room.cleared;
    const inDoorY = Math.abs(p.y - 360) < DOOR_GAP / 2 - 8;
    const inDoorX = Math.abs(p.x - 640) < DOOR_GAP / 2 - 8;
    const canExit = cleared;
    if (p.x < WALL + p.r) { if (!(canExit && inDoorY)) p.x = WALL + p.r; }
    if (p.x > ROOM_W - WALL - p.r) { if (!(canExit && inDoorY)) p.x = ROOM_W - WALL - p.r; }
    if (p.y < WALL + p.r) { if (!(canExit && inDoorX)) p.y = WALL + p.r; }
    if (p.y > ROOM_H - WALL - p.r) { if (!(canExit && inDoorX)) p.y = ROOM_H - WALL - p.r; }
    if (canExit) checkDoorExit();
    // 能量回复
    run.energy = Math.min(run.maxEnergy, run.energy + (18 + run.mods.regen) * dt);
    // 光环减速
    let auraSlow = 0;
    for (const e of run.enemies) if (e.def.aura && dist(p.x, p.y, e.x, e.y) < e.def.aura) auraSlow = Math.max(auraSlow, 0.15);
    if (auraSlow > 0) { p.x -= p.vx * auraSlow * dt; p.y -= p.vy * auraSlow * dt; }
    // 交互
    if (run.chest && !run.chest.open && dist(p.x, p.y, run.chest.x, run.chest.y) < 64) openChest();
    if (run.eventData && !run.eventData.used && dist(p.x, p.y, run.eventData.x, run.eventData.y) < 64) {
      openEvent(run.eventData);
    }
    if (run.portal) {
      if (dist(p.x, p.y, run.portal.x, run.portal.y) < 46) enterPortal();
    }
    // 商店自动提示
    if (run.shopItems) {
      for (const s of run.shopItems) {
        if (!s.sold && dist(p.x, p.y, s.x, s.y) < 52) {
          run.shopHint = s;
          break;
        }
      }
    }
  }

  function updateWeapons(dt) {
    const run = G.run; if (!run) return;
    const w = curWeapon();
    run.cooldown = Math.max(0, run.cooldown - dt);
    const trigger = Input.mouse.down || (Input.aimStick.on && Input.aimStick.mag > 0.2) || Input.autoFire;
    if (!w) { run.beam = null; run.flame = null; return; }
    if (run.switchCd > 0) return;
    if (w.fam === 'laser') {
      if (trigger && run.energy > 0.5) {
        run.energy = Math.max(0, run.energy - w.energy * dt);
        const p = run.player;
        const len = w.laserRange * (1 + run.mods.range);
        run.beam = { x: p.x, y: p.y, ang: p.ang, len, color: w.color, w };
        run.beamTick = (run.beamTick || 0) + dt;
        if (run.beamTick > 0.1) {
          run.beamTick = 0;
          laserTick(w, len);
        }
        if (chance(0.4)) Sound.play('laser');
      } else run.beam = null;
      return;
    }
    run.beam = null;
    if (w.fam === 'flame') {
      if (trigger && run.energy > 0.5) {
        run.energy = Math.max(0, run.energy - w.energy * dt);
        const p = run.player;
        const range = w.flameRange * (1 + run.mods.range);
        run.flame = { x: p.x, y: p.y, ang: p.ang, range, color: w.color };
        run.flameTick = (run.flameTick || 0) + dt;
        if (run.flameTick > w.rate) { run.flameTick = 0; flameTick(w, range); }
        if (chance(0.25)) Sound.play('flame');
      } else run.flame = null;
      return;
    }
    run.flame = null;
    if (w.fam === 'charge') {
      if (trigger) {
        if (!run.charging) { run.charging = true; run.charge = 0; }
        run.charge = Math.min(1, run.charge + dt / w.chargeTime);
        if (chance(0.08)) Sound.play('charge');
      } else if (run.charging) {
        run.charging = false;
        const c = run.charge; run.charge = 0;
        fireWeapon(w, c);
      }
      return;
    }
    if (trigger && run.cooldown <= 0 && run.energy >= w.energy) {
      fireWeapon(w, 0);
    }
  }

  function laserTick(w, len) {
    const run = G.run, p = run.player;
    const dx = Math.cos(p.ang), dy = Math.sin(p.ang);
    for (const e of run.enemies) {
      const rx = e.x - p.x, ry = e.y - p.y;
      const t = clamp(rx * dx + ry * dy, 0, len);
      const d = Math.hypot(rx - dx * t, ry - dy * t);
      if (d < e.r + 10) {
        damageEnemy(e, damageMul(e, w.dmg * 0.1), { element: 'burn', slow: w.slow, freeze: w.freeze });
      }
    }
    if (run.boss) {
      const b = run.boss;
      const rx = b.x - p.x, ry = b.y - p.y;
      const t = clamp(rx * dx + ry * dy, 0, len);
      const d = Math.hypot(rx - dx * t, ry - dy * t);
      if (d < b.r + 10) damageBoss(b, damageMul(b, w.dmg * 0.1), {});
    }
  }

  function flameTick(w, range) {
    const run = G.run, p = run.player;
    const half = w.flameArc / 2;
    for (const e of run.enemies) {
      const d = dist(p.x, p.y, e.x, e.y);
      if (d > range + e.r) continue;
      const a = Math.atan2(e.y - p.y, e.x - p.x);
      if (Math.abs(angDiff(p.ang, a)) < half + e.r / Math.max(40, d)) {
        damageEnemy(e, damageMul(e, w.dmg, { element: w.poison ? 'poison' : 'burn' }),
          { burn: w.burn || 0, poison: w.poison ? w.poison : 0, poisonDur: w.poisonDur, slow: w.slow });
      }
    }
    if (run.boss) {
      const b = run.boss;
      const d = dist(p.x, p.y, b.x, b.y);
      if (d < range + b.r) {
        const a = Math.atan2(b.y - p.y, b.x - p.x);
        if (Math.abs(angDiff(p.ang, a)) < half + 0.4) damageBoss(b, damageMul(b, w.dmg, { element: 'burn' }), {});
      }
    }
  }

  function fireWeapon(w, charge) {
    const run = G.run, p = run.player;
    const full = charge >= 0.999;
    const cMul = w.chargeTime ? 1 + (w.chargeMul - 1) * (charge || 0) : 1;
    const free = hasRelic(run, 'infmag') && chance(0.2);
    run.cooldown = free ? 0 : w.rate / atkMul(w);
    run.stats.shots++;
    if (w.fam === 'melee') {
      meleeAttack(w, cMul);
      return;
    }
    if (w.fam === 'summon') {
      deploySummon(w);
      return;
    }
    if (w.fam === 'rail') {
      railShot(w);
      return;
    }
    if (w.fam === 'explosive' && w.mine) {
      placeMine(w, cMul);
      return;
    }
    let ang = p.ang;
    let count = w.count;
    if (hasRelic(run, 'twinstar') && (w.fam === 'single' || w.fam === 'spread')) count += run.mods.extraShot;
    const spread = w.spread;
    Sound.play(w.sfx);
    shake(w.recoil * 0.012);
    run.effects.push({ type: 'muzzle', x: p.x + Math.cos(ang) * 22, y: p.y + Math.sin(ang) * 22, ang, size: 10 + w.size, color: w.color, t: 0.09, life: 0.09 });
    if (w.fam === 'flame' || w.fam === 'laser') return;
    for (let i = 0; i < count; i++) {
      let a = ang;
      if (count > 1 && spread > 0) a = ang + (i / (count - 1) - 0.5) * spread;
      else if (count > 1) a = ang + (i - (count - 1) / 2) * 0.1;
      a += rand(-w.jitter, w.jitter) * 0.5;
      fireProjectile(w, a, cMul, full);
    }
    if (hasRelic(run, 'twinmag') && chance(0.25)) {
      setTimeout(() => { if (G.run === run) for (let i = 0; i < count; i++) fireProjectile(w, ang + (count > 1 ? (i / (count - 1) - 0.5) * spread : 0), cMul, full); }, 60);
    }
    if (hasRelic(run, 'melt')) { run.meltStacks = Math.min(30, (run.meltStacks || 0) + 1); run.meltT = 3; }
  }

  function fireProjectile(w, ang, cMul, full) {
    const run = G.run, p = run.player;
    if (run.bullets.length >= MAX_BULLETS) run.bullets.shift();
    const speed = w.speed * (1 + run.mods.bulletSpeed);
    const b = {
      x: p.x + Math.cos(ang) * 20, y: p.y + Math.sin(ang) * 20,
      vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
      r: w.size, dmg: w.dmg * (cMul || 1), color: w.color,
      life: w.life * (1 + run.mods.range), maxLife: w.life * (1 + run.mods.range),
      pierce: w.pierce + run.mods.pierce + (full ? w.chargePierce : 0),
      bounce: w.bounce + run.mods.bounce,
      homing: w.homing, explode: w.explode, pull: w.pull,
      knock: w.knock, slow: w.slow + run.mods.slowHit, slowDur: w.slowDur,
      freeze: w.freeze, poison: w.poison, poisonDur: w.poisonDur, burn: w.burn, burnDur: w.burnDur,
      chain: w.chain, hit: new Set(), kind: w.fam, w,
      boomerang: w.fam === 'boomerang', phase: 'out', origin: { x: p.x, y: p.y },
      spin: 0, born: 0, trail: true, weaponId: w.id
    };
    if (w.fam === 'homing') b.life = w.life;
    if (w.fam === 'boomerang') b.life = w.life;
    if (w.fam === 'grenade' || w.fam === 'explosive') { b.fuse = 0.65; }
    run.bullets.push(b);
    return b;
  }

  function railShot(w) {
    const run = G.run, p = run.player;
    Sound.play('rail');
    shake(0.12);
    const len = 1600;
    const dx = Math.cos(p.ang), dy = Math.sin(p.ang);
    run.effects.push({ type: 'rail', x: p.x, y: p.y, ang: p.ang, len, color: w.color, t: 0.28, life: 0.28 });
    for (const e of run.enemies.slice()) {
      const rx = e.x - p.x, ry = e.y - p.y;
      const t = rx * dx + ry * dy;
      if (t < 0) continue;
      const d = Math.abs(rx * dy - ry * dx);
      if (d < e.r + 12) damageEnemy(e, damageMul(e, w.dmg), {});
    }
    if (run.boss) {
      const b = run.boss;
      const rx = b.x - p.x, ry = b.y - p.y;
      const t = rx * dx + ry * dy;
      const d = Math.abs(rx * dy - ry * dx);
      if (t > 0 && d < b.r + 14) damageBoss(b, damageMul(b, w.dmg), {});
    }
  }

  function meleeAttack(w, cMul) {
    const run = G.run, p = run.player;
    if (!run.comboIdx || run.comboIdxT <= 0) run.comboIdx = 0;
    run.comboIdx = (run.comboIdx + 1) % Math.max(1, w.combo);
    run.comboIdxT = 0.8;
    let mult = cMul * (w.combo > 1 && run.comboIdx === 0 ? 1.6 : 1);
    const range = w.meleeRange * (1 + run.mods.range);
    const arc = w.meleeArc;
    const ang = p.ang;
    Sound.play('melee');
    shake(0.02);
    run.effects.push({ type: 'swing', x: p.x, y: p.y, ang, arc, range, color: w.color, t: 0.16, life: 0.16 });
    for (const e of run.enemies.slice()) {
      const d = dist(p.x, p.y, e.x, e.y);
      if (d > range + e.r) continue;
      const a = Math.atan2(e.y - p.y, e.x - p.x);
      if (Math.abs(angDiff(ang, a)) > arc / 2 + 0.15) continue;
      damageEnemy(e, damageMul(e, w.dmg * mult), { knock: w.knock || 140, element: w.freeze ? 'freeze' : null, freeze: w.freeze, slow: w.slow });
      if (w.slow) e.slowT = Math.max(e.slowT || 0, 1.5);
      if (w.freeze) e.freezeT = Math.max(e.freezeT || 0, w.freeze);
    }
    if (run.boss) {
      const b = run.boss;
      const d = dist(p.x, p.y, b.x, b.y);
      const a = Math.atan2(b.y - p.y, b.x - p.x);
      if (d < range + b.r && Math.abs(angDiff(ang, a)) < arc / 2 + 0.3) damageBoss(b, damageMul(b, w.dmg * mult), {});
    }
    if (w.wave) {
      if (run.bullets.length < MAX_BULLETS) {
        run.bullets.push({
          x: p.x + Math.cos(ang) * 30, y: p.y + Math.sin(ang) * 30,
          vx: Math.cos(ang) * 620, vy: Math.sin(ang) * 620, r: 18,
          dmg: damageMul(null, w.dmg * 0.6), color: w.color, life: 0.7, maxLife: 0.7,
          pierce: 4, bounce: 0, explode: 0, hit: new Set(), kind: 'wave', knock: 200, trail: true, born: 0
        });
      }
    }
  }

  function deploySummon(w) {
    const run = G.run, p = run.player;
    const s = w.summon;
    const maxT = 3 + run.mods.summonLimit + (run.char.passive === 'summonBoost' ? 1 : 0);
    const count = s.count || 1;
    for (let i = 0; i < count; i++) {
      if (run.turrets.length >= maxT) run.turrets.shift();
      const ang = p.ang + (i - (count - 1) / 2) * 0.7;
      const dmgMul = (run.char.passive === 'summonBoost' ? 1.2 : 1) * (1 + run.mods.summonDmg);
      run.turrets.push({
        kind: s.type, x: p.x + Math.cos(ang) * 46, y: p.y + Math.sin(ang) * 46,
        t: s.dur, dmg: w.dmg * dmgMul, rate: w.rate, cd: 0.3, ang: p.ang,
        color: w.color, w, fireT: 0
      });
    }
    Sound.play('skill');
    shake(0.02);
  }

  function placeMine(w, cMul) {
    const run = G.run, p = run.player;
    run.bullets.push({
      x: p.x + Math.cos(p.ang) * 40, y: p.y + Math.sin(p.ang) * 40,
      vx: 0, vy: 0, r: 10, dmg: w.dmg * cMul, color: w.color, life: 12, maxLife: 12,
      explode: w.explode, mine: true, arm: 0.4, hit: new Set(), kind: 'mine',
      freeze: w.freeze, slow: w.slow, poison: w.poison, poisonDur: w.poisonDur, born: 0
    });
    Sound.play('launch');
  }

  // ======================================================================
  //  §19 主动技能（13 种）
  // ======================================================================
  function useSkill() {
    const run = G.run; if (!run) return;
    if (run.skillCd > 0) { toast('技能冷却中'); Sound.play('deny'); return; }
    const ch = run.char, p = run.player;
    run.skillCd = ch.cd * (1 - run.mods.cd);
    run.skillBase = run.skillCd;
    Sound.play('skill');
    switch (ch.skill) {
      case 'turret': {
        run.turrets.push({
          kind: 'turret', x: p.x + Math.cos(p.ang) * 40, y: p.y + Math.sin(p.ang) * 40,
          t: 9, dmg: 10 * (ch.passive === 'turretBoost' ? 1.3 : 1), rate: 0.32, cd: 0, ang: p.ang,
          color: ch.color, fireT: 0
        });
        run.effects.push({ type: 'ring', x: p.x, y: p.y, max: 70, color: ch.color, t: 0.3, life: 0.3 });
        break;
      }
      case 'blinkBomb': {
        const ang = p.ang;
        run.invuln = Math.max(run.invuln, 0.35);
        run.dashBuffT = 1.2;
        burst(p.x, p.y, ch.color, 14, 300, 5, 0.4);
        p.x = clamp(p.x + Math.cos(ang) * 230, WALL + 20, ROOM_W - WALL - 20);
        p.y = clamp(p.y + Math.sin(ang) * 230, WALL + 20, ROOM_H - WALL - 20);
        resolveObstacles(p, run.room.obstacles, p.r);
        explode(p.x, p.y, 110, 22 * run.dmgMul, ch.accent, { fromSkill: true });
        break;
      }
      case 'singularity': {
        run.hazards.push({ kind: 'sing', x: p.x + Math.cos(p.ang) * 200, y: p.y + Math.sin(p.ang) * 200, r: 150, t: 1.6, tick: 0, dmg: 12, color: ch.color });
        break;
      }
      case 'shield': {
        run.shield = (run.shield || 0) + 60;
        run.effects.push({ type: 'ring', x: p.x, y: p.y, max: 60, color: ch.accent, t: 0.4, life: 0.4 });
        Sound.play('shield');
        break;
      }
      case 'summonWorms': {
        for (let i = 0; i < 2; i++) {
          run.turrets.push({ kind: 'worm', x: p.x + rand(-40, 40), y: p.y + rand(-40, 40), t: 10, dmg: 9 * (1 + run.mods.summonDmg), rate: 0.9, cd: 0, ang: p.ang, color: ch.color, mobile: true, fireT: 0 });
        }
        break;
      }
      case 'clusterBomb': {
        for (let i = 0; i < 3; i++) {
          const ax = p.x + Math.cos(p.ang) * (120 + i * 90), ay = p.y + Math.sin(p.ang) * (120 + i * 90);
          run.hazards.push({ kind: 'delayBoom', x: ax, y: ay, r: 90, t: 0.25 + i * 0.16, dmg: 30, color: ch.accent });
        }
        break;
      }
      case 'boomerangBlade': {
        for (let i = 0; i < 3; i++) {
          const a = p.ang + (i - 1) * 0.26;
          run.bullets.push({
            x: p.x, y: p.y, vx: Math.cos(a) * 760, vy: Math.sin(a) * 760, r: 16,
            dmg: damageMul(null, 26), color: ch.accent, life: 1.1, maxLife: 1.1, pierce: 99,
            bounce: 0, hit: new Set(), kind: 'saw', boomerang: true, phase: 'out',
            origin: { x: p.x, y: p.y }, spin: 0, born: 0, trail: true
          });
        }
        break;
      }
      case 'whirl': {
        run.whirlT = 1.2;
        run.whirlTick = 0;
        break;
      }
      case 'healField': {
        run.hazards.push({ kind: 'heal', x: p.x, y: p.y, r: 170, t: 4, tick: 0, color: ch.accent });
        run.healFieldT = 4;
        break;
      }
      case 'mark': {
        let best = null, bd = 1e9;
        for (const e of run.enemies) { const d = dist(p.x, p.y, e.x, e.y); if (d < bd) { bd = d; best = e; } }
        if (run.boss) best = run.boss;
        if (best) { best.markT = 8; addText(best.x, best.y - best.r - 20, '标记', '#f783ac', 16); }
        break;
      }
      case 'nova': {
        run.effects.push({ type: 'nova', x: p.x, y: p.y, max: 230, color: ch.accent, t: 0.5, life: 0.5 });
        for (const e of run.enemies.slice()) if (dist(p.x, p.y, e.x, e.y) < 230) damageEnemy(e, damageMul(e, 60, { element: 'burn' }), { burn: 3 });
        if (run.boss && dist(p.x, p.y, run.boss.x, run.boss.y) < 230 + run.boss.r) damageBoss(run.boss, damageMul(run.boss, 60), {});
        shake(0.24);
        break;
      }
      case 'freezeField': {
        run.effects.push({ type: 'nova', x: p.x, y: p.y, max: 280, color: '#a5d8ff', t: 0.5, life: 0.5 });
        for (const e of run.enemies) if (dist(p.x, p.y, e.x, e.y) < 280) e.freezeT = Math.max(e.freezeT || 0, 2.2);
        break;
      }
      case 'shadowStrike': {
        let best = null, bd = 520;
        for (const e of run.enemies) { const d = dist(p.x, p.y, e.x, e.y); if (d < bd) { bd = d; best = e; } }
        const ang = best ? Math.atan2(best.y - p.y, best.x - p.x) : p.ang;
        burst(p.x, p.y, ch.color, 12, 260, 4, 0.35);
        p.x = clamp(p.x + Math.cos(ang) * Math.min(220, bd), WALL + 20, ROOM_W - WALL - 20);
        p.y = clamp(p.y + Math.sin(ang) * Math.min(220, bd), WALL + 20, ROOM_H - WALL - 20);
        run.invuln = Math.max(run.invuln, 0.3);
        run.stealth = Math.max(run.stealth, 1);
        for (const e of run.enemies.slice()) if (dist(p.x, p.y, e.x, e.y) < 90) damageEnemy(e, damageMul(e, 45), { crit: true, knock: 200 });
        if (run.boss && dist(p.x, p.y, run.boss.x, run.boss.y) < 90 + run.boss.r) damageBoss(run.boss, damageMul(run.boss, 45), {});
        break;
      }
    }
    run.effects.push({ type: 'ring', x: p.x, y: p.y, max: 40, color: ch.color, t: 0.25, life: 0.25 });
  }

  // ======================================================================
  //  §20 遗物 / 宝箱 / 事件 / 商店
  // ======================================================================
  function addRelic(id) {
    const run = G.run; if (!run) return;
    if (run.relicIds.indexOf(id) >= 0) return;
    const old = run.mods;
    run.relicIds.push(id);
    run.mods = relicMods(run);
    const dHp = run.mods.maxHp - old.maxHp;
    run.maxHp += dHp;
    run.hp = Math.min(run.maxHp, run.hp + Math.max(0, dHp));
    const dEn = run.mods.maxEnergy - old.maxEnergy;
    run.maxEnergy += dEn;
    run.energy = Math.min(run.maxEnergy, run.energy + Math.max(0, dEn));
    const dm = run.mods.magnet - old.magnet;
    run.magnet += dm;
    const r = RELIC_MAP[id];
    toast(`获得遗物：${r.name}`);
    addText(run.player.x, run.player.y - 40, r.name, RARITY[r.rar].color, 17);
    burst(run.player.x, run.player.y, RARITY[r.rar].color, 16, 220, 5, 0.5);
  }

  function rollRelicOptions(n) {
    const run = G.run;
    const luck = save.meta.luck;
    const pool = [];
    for (const r of RELICS) if (run.relicIds.indexOf(r.id) < 0) pool.push(r);
    const opts = [];
    for (let i = 0; i < n; i++) {
      const rr = [];
      for (const r of pool) {
        let w = r.rar === 0 ? 60 : r.rar === 1 ? 30 : r.rar === 2 ? 9 : 1.5;
        if (luck) w += r.rar * 6;
        rr.push([r, w]);
      }
      if (!rr.length) break;
      let tot = 0; for (const p of rr) tot += p[1];
      let x = Math.random() * tot;
      let pick = rr[0][0];
      for (const p of rr) { x -= p[1]; if (x <= 0) { pick = p[0]; break; } }
      opts.push(pick);
      pool.splice(pool.indexOf(pick), 1);
    }
    return opts;
  }

  function openChest() {
    const run = G.run;
    if (!run.chest) return;
    run.chest.open = true;
    run.room.looted = true;
    const n = 3 + (save.meta.luck ? 1 : 0);
    G.reward = { options: rollRelicOptions(n), source: 'chest' };
    G.state = 'reward';
    Sound.play('pickup');
  }

  function openEvent(data) {
    const ev = EVENTS.find((e) => e.id === data.id) || EVENTS[0];
    G.event = { ev, data, result: null };
    G.state = 'event';
    Sound.play('ui');
  }

  function eventChoose(act) {
    const run = G.run, ev = G.event;
    if (!ev) return;
    const data = ev.data;
    const cfgs = FLOORS[run.floor];
    if (act === 'leave') { data.used = true; run.room.eventUsed = true; closeOverlay(); return; }
    if (act === 'blood') {
      run.hp = Math.max(1, run.hp - Math.round(run.hp * 0.25));
      const opts = rollRelicOptions(1);
      if (opts[0]) addRelic(opts[0].id);
      run.hp = Math.max(1, run.hp);
    } else if (act === 'gamble') {
      if (run.coins < 60) { toast('金币不足'); Sound.play('deny'); return; }
      run.coins -= 60;
      const roll = Math.random();
      if (roll < 0.6) { const o = rollRelicOptions(1); if (o[0]) addRelic(o[0].id); }
      else if (roll < 0.85) {
        const pool = RELICS.filter((r) => r.rar === 2 && run.relicIds.indexOf(r.id) < 0);
        if (pool.length) addRelic(choose(pool).id);
      } else toast('什么都没有...');
    } else if (act === 'heal') {
      run.hp = Math.min(run.maxHp, run.hp + Math.round(run.maxHp * 0.4));
      Sound.play('heal');
    } else if (act === 'energy') {
      run.maxEnergy += 25; run.energy += 25;
    } else if (act === 'curse') {
      const o = rollRelicOptions(2);
      for (const r of o) addRelic(r.id);
      run.maxHp = Math.max(20, Math.round(run.maxHp * 0.85));
      run.hp = Math.min(run.hp, run.maxHp);
    } else if (act === 'upgrade') {
      const w = curWeapon();
      if (w) { w.dmg = Math.round(w.dmg * 1.15 * 10) / 10; w.level = (w.level || 0) + 1; toast(`${w.name} 强化至 +${w.level}`); }
    } else if (act === 'swap') {
      const id = choose(cfgs.shopPool);
      equipWeapon(id, true);
    }
    data.used = true; run.room.eventUsed = true;
    closeOverlay();
  }

  function equipWeapon(id, free) {
    const run = G.run;
    if (!run || !WEAPONS[id]) return;
    run.weapons[run.slot] = id;
    run.charging = false; run.charge = 0; run.cooldown = 0.2;
    Sound.play('pickup');
    toast(`装备：${WEAPONS[id].name}`);
  }

  function buyShop(idx) {
    const run = G.run;
    if (!run.shopItems) return;
    const s = run.shopItems[idx];
    if (!s || s.sold) return;
    if (run.coins < s.price) { toast('金币不足'); Sound.play('deny'); return; }
    run.coins -= s.price;
    s.sold = true;
    Sound.play('pickup');
    if (s.kind === 'weapon') equipWeapon(s.id);
    else if (s.kind === 'relic') addRelic(s.id);
    else if (s.kind === 'heal') { run.hp = Math.min(run.maxHp, run.hp + Math.round(run.maxHp * 0.35)); Sound.play('heal'); }
  }

  function rollDiceBuff() {
    const run = G.run;
    const b = choose(['dmg', 'atkSpeed', 'moveSpeed', 'armor']);
    run.temp[b] = b === 'armor' ? 0.08 : 0.15;
    run.temp.until = run.floor;
    toast(`命运骰子：${b === 'dmg' ? '伤害' : b === 'atkSpeed' ? '攻速' : b === 'moveSpeed' ? '移速' : '护甲'}提升`);
  }

  function takeReward(i) {
    const run = G.run;
    if (!G.reward) return;
    const r = G.reward.options[i];
    if (r) addRelic(r.id);
    closeOverlay();
  }

  function closeOverlay() {
    G.state = 'playing';
    G.reward = null; G.event = null;
    G.hitstop = 0;
  }

  // ======================================================================
  //  §21 实体生成 · 战斗结算
  // ======================================================================
  function spawnEnemy(type, x, y, elite) {
    const run = G.run; if (!run) return null;
    if (run.enemies.length >= MAX_ENEMIES) return null;
    const d = ENEMIES[type]; if (!d) return null;
    const f = run.floor;
    const hpMul = (1 + 0.55 * f) * (1 + 0.12 * save.threat) * (elite ? 2.6 : 1);
    const dmgS = (1 + 0.22 * f) * (1 + 0.08 * save.threat) * (elite ? 1.25 : 1);
    const hp = Math.max(1, Math.round(d.hp * hpMul));
    const e = {
      id: type, def: d, x, y, vx: 0, vy: 0, r: d.r, ang: 0,
      hp, maxHp: hp, dmg: d.dmg * dmgS, speed: d.speed, t: rand(0, 9),
      state: 'idle', stT: 0, shotT: rand(0.5, 1.6), hitFlash: 0, contactT: 0,
      slowT: 0, slowMul: 1, freezeT: 0, freezeStacks: 0, burnT: 0, burnStacks: 0,
      poisonT: 0, poisonDur: 0, poisonStacks: 0, markT: 0,
      shieldHp: d.shield > 0 ? d.shield * 22 : 0, shieldMax: d.shield > 0 ? d.shield * 22 : 0,
      elite: !!elite, affixes: [], splitGen: d.split && d.split.gen ? d.split.gen : 1,
      summonT: d.summon ? d.summon.rate : 0, dashCd: rand(0.6, 2), orbA: rand(0, TAU),
      burrowT: 0, stealthA: 0, alive: true, wobble: rand(0, TAU), phaseT: 0
    };
    if (elite) {
      const pool = AFFIXES.slice();
      const n = chance(0.45) ? 2 : 1;
      for (let i = 0; i < n; i++) {
        const a = pool.splice((Math.random() * pool.length) | 0, 1)[0];
        if (!a) break;
        e.affixes.push(a.id);
        if (a.id === 'swift') e.speed *= 1.35;
        if (a.id === 'shielded') e.shieldMax = e.shieldHp = 60, e.shieldRegen = 4;
      }
      e.r += 3;
    }
    run.enemies.push(e);
    return e;
  }

  function makeBoss(id, room) {
    const run = G.run;
    const d = BOSSES[id];
    const f = run.floor;
    const hp = Math.round(d.hp * (1 + 0.1 * save.threat) * (1 + 0.05 * f));
    return {
      id, def: d, name: d.name, x: 640, y: 230, vx: 0, vy: 0, r: d.r,
      hp, maxHp: hp, dmg: d.dmg * (1 + 0.18 * f) * (1 + 0.08 * save.threat),
      phase: 0, moveName: null, mt: 0, moveT: 0, rest: 1.4,
      hitFlash: 0, slowT: 0, freezeT: 0, burnT: 0, burnStacks: 0, markT: 0,
      shieldHp: 0, tele: 0, invuln: 0, dead: false, md: {},
      subPhase: 0, beams: [], orbs: [], t: 0
    };
  }

  function applyStatus(e, opts) {
    if (!opts) return;
    if (opts.slow) { e.slowT = Math.max(e.slowT || 0, opts.slowDur || 1.8); e.slowMul = Math.min(e.slowMul || 1, 1 - opts.slow); }
    if (opts.freeze) { e.freezeT = Math.max(e.freezeT || 0, opts.freeze); e.freezeStacks = 0; }
    if (opts.burn) { e.burnT = Math.max(e.burnT || 0, opts.burnDur || 2); e.burnStacks = Math.min(runStacks(), (e.burnStacks || 0) + 1); }
    if (opts.poison) { e.poisonT = Math.max(e.poisonT || 0, opts.poisonDur || 3); e.poisonStacks = Math.min(5, (e.poisonStacks || 0) + 1); }
  }
  function runStacks() { return G.run && G.run.char.passive === 'burnStack' ? 4 : 2; }

  function damageEnemy(e, dmg, opts) {
    const run = G.run;
    if (!run || !e || e.alive === false) return;
    opts = opts || {};
    let d = Math.max(0.5, dmg);
    let crit = !!opts.crit || chance(run.crit)
    if (crit) d *= run.critMul + run.mods.critMul;
    if (run.char.passive === 'dashBuff' && run.dashBuffT > 0) d *= 1.25;
    d *= 1 - (e.def.armor || 0);
    // 正面护盾：从面朝玩家的方向命中减免
    if (e.shieldHp > 0 && (e.def.aura || e.def.ai === 'juggernaut')) {
      const a = Math.atan2(run.player.y - e.y, run.player.x - e.x);
      if (Math.abs(angDiff(e.ang, a)) < 1.2) { e.shieldHp = Math.max(0, e.shieldHp - d * 0.6); d *= 0.4; }
    }
    d = Math.max(1, Math.round(d));
    e.hp -= d; e.hitFlash = 0.08;
    run.stats.hits++; run.stats.dmg += d;
    addText(e.x, e.y - e.r - 6, String(d), crit ? '#ffd43b' : '#f1f3f5', crit ? 19 : 13);
    const canHs = !e.hitstopCd || e.hitstopCd <= 0;
    if (crit) Sound.play('crit'); else Sound.play('hit');
    if (canHs) hitstop(crit ? 0.045 : 0.03);
    e.hitstopCd = 0.09;
    burst(e.x, e.y, crit ? '#ffd43b' : e.def.color, crit ? 7 : 3, 170, 3, 0.22);
    shake(crit ? 0.045 : 0.02);
    if (run.mods.lifesteal > 0) {
      run.hp = Math.min(run.maxHp, run.hp + d * run.mods.lifesteal);
    }
    if (opts.knock && e.def.ai !== 'stationary') {
      const a = Math.atan2(e.y - run.player.y, e.x - run.player.x);
      e.vx += Math.cos(a) * opts.knock; e.vy += Math.sin(a) * opts.knock;
    }
    if (e.def.ai !== 'juggernaut') applyStatus(e, opts);
    else if (opts.slow) e.slowT = Math.max(e.slowT, 1.2);
    const w = opts.weapon;
    if (w) {
      if (hasRelic(run, 'burnblood') || w.burn) { e.burnT = Math.max(e.burnT, 2); e.burnStacks = Math.min(4, (e.burnStacks || 0) + 1); }
    }
    if (run.char.passive === 'slowOnHit') { e.slowT = Math.max(e.slowT, 1.4); e.slowStacks = Math.min(3, (e.slowStacks || 0) + 1); }
    if (run.char.passive === 'freezeStack') {
      e.freezeStacks = (e.freezeStacks || 0) + 1;
      if (e.freezeStacks >= 4) { e.freezeStacks = 0; e.freezeT = Math.max(e.freezeT, 1.2); }
    }
    if (hasRelic(run, 'chainHit') && chance(0.2)) chainZap(e, damageMul(null, d * 0.5));
    if (e.hp <= 0) killEnemy(e);
  }

  function chainZap(from, dmg) {
    const run = G.run; if (!run) return;
    let best = null, bd = 210;
    for (const o of run.enemies) {
      if (o === from || o.hp <= 0) continue;
      const d = dist(from.x, from.y, o.x, o.y);
      if (d < bd) { bd = d; best = o; }
    }
    if (!best) return;
    run.effects.push({ type: 'zap', x: from.x, y: from.y, x2: best.x, y2: best.y, color: '#c0a2ff', t: 0.14, life: 0.14 });
    damageEnemy(best, dmg, { crit: false });
  }

  function killEnemy(e) {
    const run = G.run;
    if (!run || e.alive === false) return;
    e.alive = false;
    const idx = run.enemies.indexOf(e);
    if (idx >= 0) run.enemies.splice(idx, 1);
    run.kills++;
    if (!run.char) return;
    Sound.play('kill');
    hitstop(0.06);
    shake(0.05);
    burst(e.x, e.y, e.def.color, e.elite ? 18 : 10, 240, 4, 0.45);
    const gold = Math.round((2 + run.floor * 1.5) * (e.def.prize || 1) * (e.elite ? 3 : 1) * (1 + run.mods.gold));
    addPickup(e.x, e.y, 'gold', gold);
    run.combo++; run.comboT = 2.4;
    // 遗物：击杀回复 / 爆炸新星 / 冰霜爆裂 / 回响层
    if (hasRelic(run, 'bloodsac') && chance(0.08)) run.hp = Math.min(run.maxHp, run.hp + 3);
    if (hasRelic(run, 'echocrystal')) { run.echoStacks = Math.min(3, (run.echoStacks || 0) + 1); run.echoT = 2; }
    if (hasRelic(run, 'deathecho') && chance(0.15)) explode(e.x, e.y, 100, 30, '#b197fc', {});
    if (hasRelic(run, 'frozenheart') && (e.freezeT > 0 || e.slowT > 0)) explode(e.x, e.y, 80, 15, '#99e9f2', { freeze: 0 });
    if (hasRelic(run, 'kaleido') && chance(0.2)) { const b = addPickup(e.x, e.y, 'energy'); }
    if (run.char.passive === 'meleeHeal') {
      const cw = curWeapon();
      if (cw && cw.fam === 'melee') { run.hp = Math.min(run.maxHp, run.hp + 4); addText(e.x, e.y - 30, '+4', '#69db7c', 13); }
    }
    if (run.char.passive === 'stealthKill') run.stealth = Math.max(run.stealth, 1);
    if (e.affixes && e.affixes.indexOf('splitting') >= 0 && e.splitGen < 3) {
      for (let i = 0; i < 2; i++) {
        const c = spawnEnemy(e.id, e.x + rand(-20, 20), e.y + rand(-20, 20), false);
        if (c) { c.hp = Math.max(1, Math.round(e.maxHp * 0.25)); c.splitGen = e.splitGen + 1; c.r *= 0.75; }
      }
    }
    if (e.def.split && e.splitGen < 3 && !e.affixes.length) {
      const sp = e.def.split;
      for (let i = 0; i < (sp.n || 2); i++) {
        const c = spawnEnemy(sp.type, e.x + rand(-18, 18), e.y + rand(-18, 18), false);
        if (c) c.splitGen = e.splitGen + 1;
      }
    }
    if (e.elite) {
      addPickup(e.x, e.y, 'relic');
      if (chance(0.5)) addPickup(e.x + 20, e.y, 'shard');
    }
    if (e.def.prize >= 1 && chance(0.05)) addPickup(e.x + 14, e.y, 'hp');
  }

  function damageBoss(b, dmg, opts) {
    const run = G.run;
    if (!run || !b || b.dead) return;
    opts = opts || {};
    let d = Math.max(1, dmg);
    let crit = !!opts.crit || chance(run.crit);
    if (crit) d *= run.critMul + run.mods.critMul;
    if (b.shieldHp > 0) { b.shieldHp = Math.max(0, b.shieldHp - d); d *= 0.35; }
    d *= 1 - (b.def.armor || 0);
    d = Math.max(1, Math.round(d));
    b.hp -= d; b.hitFlash = 0.08;
    run.stats.hits++; run.stats.dmg += d;
    addText(b.x + rand(-20, 20), b.y - b.r - 10, String(d), crit ? '#ffd43b' : '#fff', crit ? 20 : 14);
    if (crit) Sound.play('crit'); else Sound.play('hit');
    if (!b.hitstopCd || b.hitstopCd <= 0) hitstop(crit ? 0.045 : 0.03);
    b.hitstopCd = 0.12;
    shake(0.025);
    if (opts.knock) b.vx += 0;
    const hpFrac = b.hp / b.maxHp;
    const totalPhases = b.def.phases.length;
    const wantPhase = Math.min(totalPhases - 1, Math.floor((1 - hpFrac) * totalPhases));
    if (wantPhase > b.phase && b.hp > 0) {
      b.phase = wantPhase; b.rest = 0.5; b.moveName = null; b.mt = 0;
      hitstop(0.12); shake(0.3); b.invuln = 0.8;
      addText(b.x, b.y - b.r - 30, '阶段变化', '#ffd43b', 22);
      burst(b.x, b.y, b.def.accent, 26, 320, 5, 0.7);
      Sound.play('bossin');
      run.ebullets.length = 0;
    }
    if (b.hp <= 0) killBoss(b);
  }

  function killBoss(b) {
    const run = G.run;
    if (!b || b.dead) return;
    b.dead = true; b.hp = 0;
    Sound.play('explode');
    shake(0.6); hitstop(0.12);
    for (let i = 0; i < 12; i++) {
      setTimeout(() => {
        if (G.run !== run) return;
        burst(b.x + rand(-70, 70), b.y + rand(-50, 50), i % 2 ? b.def.accent : b.def.color, 14, 320, 6, 0.6);
        Sound.play('explode');
      }, i * 90);
    }
    run.boss = null;
    run.room.cleared = true;
    const gold = Math.round((60 + run.floor * 45) * (1 + run.mods.gold));
    for (let i = 0; i < 6; i++) addPickup(560 + i * 32, 300 + rand(-40, 40), 'gold', Math.round(gold / 6));
    addPickup(640, 360, 'hp'); addPickup(672, 360, 'energy');
    addPickup(608, 380, 'shard');
    run.shards++;
    run.bossKills = (run.bossKills || 0) + 1;
    if (run.floor >= FLOORS.length - 1) {
      // 隐藏层：守卫死后开启回响之门（原地召唤隐藏 Boss），原型死后结算
      run.portal = { x: 640, y: 300, kind: b.id === 'guardian' ? 'echo' : 'end', t: 0 };
    } else if (run.floor === FLOORS.length - 2) {
      // 第 5 层：集齐 3 枚回响碎片才能进入隐藏层
      run.portal = { x: 640, y: 300, kind: run.shards >= 3 ? 'next' : 'end', t: 0 };
    } else {
      run.portal = { x: 640, y: 300, kind: 'next', t: 0 };
    }
    run.room.portal = run.portal;
    Sound.play('win');
    G.banner = { title: '区域肃清', sub: '传送门已开启', t: 2.2 };
    save.kills += 1;
  }

  function explode(x, y, r, dmg, color, opts) {
    const run = G.run; if (!run) return;
    opts = opts || {};
    const rm = 1 + run.mods.explodeR + (run.char.passive === 'explodeBoost' ? 0.2 : 0);
    const radius = r * rm;
    const dm = dmg * (1 + run.mods.explodeDmg);
    run.effects.push({ type: 'nova', x, y, max: radius, color, t: 0.4, life: 0.4 });
    burst(x, y, color, 16, 320, 5, 0.45);
    Sound.play('explode');
    shake(0.16);
    for (const e of run.enemies.slice()) {
      if (dist(x, y, e.x, e.y) < radius + e.r) {
        damageEnemy(e, dm, { element: opts.element, burn: opts.burn, poison: opts.poison, poisonDur: opts.poisonDur, freeze: opts.freeze, slow: opts.slow, knock: 220 });
      }
    }
    if (run.boss && dist(x, y, run.boss.x, run.boss.y) < radius + run.boss.r) damageBoss(run.boss, dm, {});
    if (opts.pull) {
      for (const e of run.enemies) {
        const d = dist(x, y, e.x, e.y);
        if (d < radius * 1.6 && d > 1) {
          e.x += (x - e.x) / d * 26; e.y += (y - e.y) / d * 26;
        }
      }
    }
    if (opts.poison) {
